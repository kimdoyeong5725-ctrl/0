<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BLEACH RPG WORLD</title>

<style>
html,body{
margin:0;
overflow:hidden;
background:#000;
}

canvas{
display:block;
}

#ui{
position:absolute;
top:15px;
left:15px;
color:white;
font-size:20px;
font-weight:bold;

}

<body>

<div id="ui">
BLEACH RPG<br>
HP : <span id="hp">100</span><br>
WORLD : <span id="world">카라쿠라</span>
<br>
<button onclick="nextWorld()">다음 맵</button>
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";


// =================
// 기본 엔진
// =================

const scene=new THREE.Scene();

const camera=
new THREE.PerspectiveCamera(
60,
innerWidth/innerHeight,
0.1,
1000
);


const renderer=
new THREE.WebGLRenderer({
antialias:true
});


renderer.setSize(
innerWidth,
innerHeight
);


document.body.appendChild(
renderer.domElement
);



// 빛

scene.add(
new THREE.AmbientLight(
0xffffff,
1
)
);


const light=
new THREE.DirectionalLight(
0xffffff,
2
);

light.position.set(
30,50,20
);

scene.add(light);



// =================
// 플레이어
// =================

const player=
new THREE.Mesh(

new THREE.CapsuleGeometry(
0.7,
1.5,
4,
8
),

new THREE.MeshStandardMaterial({
color:0xff66cc
})

);


player.position.y=1;

scene.add(player);




// =================
// 맵 시스템
// =================

let world=0;


const worlds=[
"카라쿠라",
"소울 소사이어티",
"소쿄쿠",
"웨코문도",
"라스 노체스",
"반덴라이히",
"영왕궁"
];



function clearMap(){

while(scene.children.length>3){

scene.remove(
scene.children[3]
);

}

}



// =================
// 공통 맵 생성
// =================

function createWorld(name,color){

clearMap();


scene.background=
new THREE.Color(color);



const ground=
new THREE.Mesh(

new THREE.PlaneGeometry(
300,
300
),

new THREE.MeshStandardMaterial({
color:0xdddddd
})

);


ground.rotation.x=-Math.PI/2;

scene.add(ground);



for(let i=0;i<20;i++){

const obj=
new THREE.Mesh(

new THREE.BoxGeometry(
5,
Math.random()*20+5,
5
),

new THREE.MeshStandardMaterial({
color:0xffffff
})

);


obj.position.set(
Math.random()*100-50,
obj.geometry.parameters.height/2,
Math.random()*100-50
);


scene.add(obj);

}


document.getElementById(
"world"
).innerText=name;


player.position.set(
0,
1,
0
);


}




function nextWorld(){

world++;

if(world>=7)
world=0;


createWorld(
worlds[world],
0x111111+world*100000
);

}


// 시작

createWorld(
worlds[0],
0x77aaff
);




// =================
// 이동
// =================


let keys={};


addEventListener(
"keydown",
e=>keys[e.key]=true
);


addEventListener(
"keyup",
e=>keys[e.key]=false
);



function move(){

if(keys.w)
player.position.z-=0.2;

if(keys.s)
player.position.z+=0.2;

if(keys.a)
player.position.x-=0.2;

if(keys.d)
player.position.x+=0.2;


}



// =================
// 카메라
// =================


function animate(){

requestAnimationFrame(
animate
);


move();


camera.position.set(
player.position.x,
8,
player.position.z+12
);


camera.lookAt(
player.position
);



renderer.render(
scene,
camera
);

}


animate();



addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

});


</script>

</body>
</html><!-- 추가 : 전투 시스템 -->

<script>

// =======================
// 적 시스템
// =======================

let enemies=[];


function spawnEnemy(){

const enemy=
new THREE.Mesh(

new THREE.SphereGeometry(
1.5,
16,
16
),

new THREE.MeshStandardMaterial({
color:0x111111
})

);


enemy.position.set(
Math.random()*40-20,
1.5,
Math.random()*40-20
);


scene.add(enemy);


enemies.push({

mesh:enemy,
hp:100

});


}



for(let i=0;i<5;i++)
spawnEnemy();



// =======================
// 검
// =======================

const sword=
new THREE.Mesh(

new THREE.BoxGeometry(
0.15,
2.5,
0.15
),

new THREE.MeshStandardMaterial({
color:0xffffff
})

);


sword.position.set(
0.8,
1.5,
0
);


player.add(sword);



// =======================
// 공격
// =======================


addEventListener(
"keydown",
e=>{


if(e.code==="Space"){


sword.rotation.z=-1;



setTimeout(()=>{

sword.rotation.z=0;

},200);



enemies.forEach((enemy,i)=>{


let d=
player.position.distanceTo(
enemy.mesh.position
);



if(d<4){


enemy.hp-=50;



enemy.mesh.position.x+=3;



if(enemy.hp<=0){


scene.remove(
enemy.mesh
);


enemies.splice(
i,
1
);


}



}



});



}


});




// =======================
// 적 AI
// =======================

function enemyAI(){

enemies.forEach(e=>{


let dir=
new THREE.Vector3()
.subVectors(
player.position,
e.mesh.position
)
.normalize();


let d=
player.position.distanceTo(
e.mesh.position
);



if(d<20){

e.mesh.position.addScaledVector(
dir,
0.03
);

}



});

}



// 기존 animate에 추가

const oldAnimate2=animate;


animate=function(){

enemyAI();

oldAnimate2();

};



</script><!-- 추가 : 월드 포탈 시스템 -->

<script>


// =======================
// 포탈
// =======================


let portal;


function createPortal(){


portal=
new THREE.Mesh(

new THREE.TorusGeometry(
3,
0.5,
16,
40
),

new THREE.MeshBasicMaterial({

color:0x00ffff

})

);



portal.rotation.x=
Math.PI/2;


portal.position.set(
0,
3,
-20
);


scene.add(portal);



}



createPortal();




// =======================
// 월드별 맵 생성 강화
// =======================


function buildSpecialWorld(){

clearMap();


// 카라쿠라

if(world===0){


scene.background=
new THREE.Color(
0x4488ff
);



for(let i=0;i<20;i++){


let house=
new THREE.Mesh(

new THREE.BoxGeometry(
10,
20,
10
),

new THREE.MeshStandardMaterial({
color:0xffffff
})

);


house.position.set(
Math.random()*100-50,
10,
Math.random()*100-50
);


scene.add(house);

}


}



// 소울 소사이어티

if(world===1){


scene.background=
new THREE.Color(
0xffddaa
);



const wall=
new THREE.Mesh(

new THREE.BoxGeometry(
200,
20,
5
),

new THREE.MeshStandardMaterial({
color:0xffffff
})

);


wall.position.z=-50;
wall.position.y=10;

scene.add(wall);



for(let i=0;i<30;i++){


let tree=
new THREE.Mesh(

new THREE.SphereGeometry(
2
),

new THREE.MeshStandardMaterial({
color:0xff99cc
})

);


tree.position.set(
Math.random()*100-50,
3,
Math.random()*100-50
);


scene.add(tree);


}



}




// 웨코문도

if(world===3){


scene.background=
new THREE.Color(
0x111122
);



const moon=
new THREE.Mesh(

new THREE.SphereGeometry(
20
),

new THREE.MeshBasicMaterial({
color:0xffffdd
})

);


moon.position.set(
0,
60,
-100
);


scene.add(moon);



const sand=
new THREE.Mesh(

new THREE.PlaneGeometry(
300,
300
),

new THREE.MeshStandardMaterial({
color:0xffffff
})

);


sand.rotation.x=-Math.PI/2;

scene.add(sand);


}



createPortal();



}



// 다음 맵 버튼 수정

window.nextWorld=function(){


world++;


if(world>=7)
world=0;


buildSpecialWorld();


document.getElementById(
"world"
).innerText=
worlds[world];



};



// 포탈 이동

function portalCheck(){


if(
player.position.distanceTo(
portal.position
)<4
){


nextWorld();


}


}



const oldAnimate3=animate;


animate=function(){

portal.rotation.z+=0.05;

portalCheck();

oldAnimate3();

};



</script><!-- 추가 : 참백도 / 시해 / 만해 시스템 -->

<script>


// =======================
// 상태
// =======================

let shikai=false;
let bankai=false;


// =======================
// 시해
// =======================

function activateShikai(){


shikai=!shikai;


if(shikai){

sword.scale.set(
1,
1.5,
1
);

sword.material.color.setHex(
0x00ffff
);


}else{


sword.scale.set(
1,
1,
1
);

sword.material.color.setHex(
0xffffff
);


}


}



// =======================
// 만해
// =======================


function activateBankai(){


bankai=!bankai;



if(bankai){


player.material.color.setHex(
0xff0000
);



sword.scale.set(
1,
3,
1
);



}else{


player.material.color.setHex(
0xff66cc
);



sword.scale.set(
1,
1,
1
);



}


}



// =======================
// 기술 버튼
// =======================


addEventListener(
"keydown",
e=>{


if(e.key==="1"){

activateShikai();

}



if(e.key==="2"){

activateBankai();

}



});




// =======================
// 월아천충
// =======================


function getsugaTensho(){


const wave=
new THREE.Mesh(

new THREE.BoxGeometry(
1,
2,
10
),

new THREE.MeshBasicMaterial({

color:
bankai?
0xff0000:
0x00ffff

})

);



wave.position.copy(
player.position
);



wave.position.z-=5;



scene.add(wave);



let move=0;



let timer=setInterval(()=>{


wave.position.z-=2;


enemies.forEach(
(e,i)=>{


if(
wave.position.distanceTo(
e.mesh.position
)<5
){


e.hp-=200;


}



});



move++;



if(move>30){


scene.remove(
wave
);


clearInterval(
timer
);


}



},30);



}



// Q키

addEventListener(
"keydown",
e=>{


if(e.key==="q"){

getsugaTensho();

}


});



// =======================
// 이펙트
// =======================

function reiatsu(){


const aura=
new THREE.Mesh(

new THREE.SphereGeometry(
2,
32,
32
),

new THREE.MeshBasicMaterial({

color:0x00ffff,
transparent:true,
opacity:0.3

})

);



aura.position.copy(
player.position
);


scene.add(aura);



let size=1;



let t=setInterval(()=>{


size+=0.1;


aura.scale.set(
size,
size,
size
);



aura.material.opacity-=0.03;



if(
aura.material.opacity<=0
){

scene.remove(aura);

clearInterval(t);

}


},30);


}



// 만해 사용시

addEventListener(
"keydown",
e=>{

if(
e.key==="2" &&
bankai
){

reiatsu();

}

});



</script><!-- 추가 : 보스전 시스템 -->

<script>


// =======================
// 보스 데이터
// =======================

let boss=null;



function spawnBoss(name,color,hp){


const group=
new THREE.Group();



const body=
new THREE.Mesh(

new THREE.CapsuleGeometry(
3,
5,
8,
16
),

new THREE.MeshStandardMaterial({

color:color

})

);



body.position.y=5;


group.add(body);



group.position.set(
0,
0,
-40
);


scene.add(group);



boss={

name:name,

mesh:group,

hp:hp,

maxHp:hp

};



}



// =======================
// 스테이지별 보스
// =======================


function checkBoss(){


if(world===2){

spawnBoss(
"소쿄쿠 수호자",
0xff0000,
1000
);

}


if(world===3){

spawnBoss(
"울키오라",
0x222222,
1500
);

}


if(world===6){

spawnBoss(
"영왕궁 수호자",
0xffffff,
3000
);

}


}



// =======================
// 보스 AI
// =======================


function bossAI(){


if(!boss)return;



let dir=
new THREE.Vector3()
.subVectors(
player.position,
boss.mesh.position
)
.normalize();



let distance=
player.position.distanceTo(
boss.mesh.position
);



if(distance<50){

boss.mesh.position.addScaledVector(
dir,
0.03
);

}



if(distance<5){


let hpEl=
document.getElementById(
"hp"
);


let hp=
Number(
hpEl.innerText
);


hp-=0.2;


hpEl.innerText=
Math.max(
0,
Math.floor(hp)
);



}



}




// =======================
// 공격 보스 판정
// =======================


function hitBoss(){


if(!boss)return;


let d=
player.position.distanceTo(
boss.mesh.position
);


if(d<6){


let damage=
bankai?
150:
shikai?
80:
40;


boss.hp-=damage;



if(boss.hp<=0){


scene.remove(
boss.mesh
);


alert(
boss.name+
" 격파!"
);


boss=null;


}


}



}




// 스페이스 공격 연결

addEventListener(
"keydown",
e=>{


if(e.code==="Space"){

hitBoss();

}


});





// 보스 표시

const bossUI=
document.createElement(
"div"
);


bossUI.style.position=
"absolute";


bossUI.style.top=
"70px";


bossUI.style.left=
"50%";


bossUI.style.transform=
"translateX(-50%)";


bossUI.style.color=
"red";


bossUI.style.fontSize=
"25px";


bossUI.style.fontWeight=
"bold";


document.body.appendChild(
bossUI
);



setInterval(()=>{


if(boss){

bossUI.innerText=
boss.name+
" HP : "+
Math.floor(boss.hp)
;


}else{


bossUI.innerText="";


}


bossAI();


},50);



// 맵 변경 후 보스 생성

const oldBuild=
buildSpecialWorld;


buildSpecialWorld=function(){

oldBuild();

boss=null;

setTimeout(
checkBoss,
500
);


};



</script><!-- 추가 : 레벨 / 경험치 / 저장 시스템 -->

<script>


// =======================
// 플레이어 성장
// =======================

let playerData={

level:1,
exp:0,
gold:0

};



// UI 추가

const levelUI=
document.createElement("div");


levelUI.style.position=
"absolute";

levelUI.style.top=
"120px";

levelUI.style.left=
"15px";

levelUI.style.color=
"white";

levelUI.style.fontSize=
"18px";

levelUI.style.fontWeight=
"bold";

document.body.appendChild(
levelUI
);



function updateLevelUI(){

levelUI.innerHTML=

"Lv : "+
playerData.level+
"<br>EXP : "+
playerData.exp+
"/100"+
"<br>💰 "+
playerData.gold;

}



updateLevelUI();




// =======================
// 경험치 획득
// =======================


function getEXP(value){


playerData.exp+=value;



if(playerData.exp>=100){


playerData.exp-=100;


playerData.level++;


document.getElementById(
"hp"
).innerText=100;


alert(
"레벨 UP!! Lv "+
playerData.level
);


}



updateLevelUI();


}



// 적 처치 보상

function enemyReward(){


getEXP(20);


playerData.gold+=50;


updateLevelUI();


}



// 기존 적 제거 시 보상 추가

const oldSpawnEnemy=spawnEnemy;


spawnEnemy=function(){


oldSpawnEnemy();



};




// =======================
// 저장
// =======================


function saveGame(){


const save={


world:world,

playerX:
player.position.x,

playerZ:
player.position.z,

level:
playerData.level,

exp:
playerData.exp,

gold:
playerData.gold


};



localStorage.setItem(

"BLEACH_RPG_SAVE",

JSON.stringify(save)

);


alert(
"저장 완료"
);



}




// =======================
// 불러오기
// =======================


function loadGame(){


const data=
localStorage.getItem(
"BLEACH_RPG_SAVE"
);



if(!data)return;



const save=
JSON.parse(data);



world=
save.world;


player.position.set(

save.playerX,

1,

save.playerZ

);



playerData.level=
save.level;


playerData.exp=
save.exp;


playerData.gold=
save.gold;



buildSpecialWorld();


updateLevelUI();



alert(
"불러오기 완료"
);



}




// 버튼 생성

const saveBtn=
document.createElement(
"button"
);


saveBtn.innerText=
"저장";


saveBtn.style.position=
"absolute";


saveBtn.style.top=
"170px";


saveBtn.style.left=
"15px";


saveBtn.onclick=
saveGame;


document.body.appendChild(
saveBtn
);



const loadBtn=
document.createElement(
"button"
);


loadBtn.innerText=
"불러오기";


loadBtn.style.position=
"absolute";


loadBtn.style.top=
"215px";


loadBtn.style.left=
"15px";


loadBtn.onclick=
loadGame;


document.body.appendChild(
loadBtn
);



// 키 저장

addEventListener(
"keydown",
e=>{


if(e.key==="p")
saveGame();


if(e.key==="o")
loadGame();



});

);

});

};




// =======================

const skillBtn=

);

<script>


// =======================
// 스테이지 데이터
// =======================

const stageData=[

{
name:"카라쿠라 마을",
color:0x4488ff,
boss:"호로"

worldTime+=0.001;

worldTime>1
){

worldTime=0;

}



let light=
Math.sin(
worldTime*Math.PI*2
);



scene.traverse(
obj=>{


if(
obj.isDirectionalLight
){


obj.intensity=
Math.max(
0.2,
light+1
);


}



});



}



// =======================
// 날씨 종류
// =======================

let weather=
"맑음";

weather=type;

scene.background=
new THREE.Color(
0x050510
);


}



if(type==="비"){


scene.background=
new THREE.Color(

);

scene.background=
new THREE.Color(

);


}

rain.forEach(r=>
scene.remove(r)
);


rain=[];

let drop=
new THREE.Mesh(

new THREE.BoxGeometry(
0.03,
2,
0.03
),

new THREE.MeshBasicMaterial({

})

);



drop.position.set(

Math.random()*200-100,

Math.random()*100,

Math.random()*200-100

);



scene.add(drop);


rain.push(drop);



}



}




function updateRain(){


rain.forEach(r=>{


r.position.y-=0.5;



if(
r.position.y<0
){

r.position.y=100;

}



});



}

// 환경 이벤트
// =======================


function randomWeather(){

Math.random();



if(r<0.3){

changeWeather("밤");

}

else if(r<0.5){

changeWeather("비");

}

else{

changeWeather("맑음");

}



}



setInterval(()=>{

},60000);
