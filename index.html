<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>블리치: 차원 레거시 (Giant Toshiro Edition)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
        body { background: #000; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; }
        #game-container { position: relative; width: 100%; max-width: 480px; height: 100%; max-height: 860px; background: #000; overflow: hidden; display: flex; flex-direction: column; border: 2px solid #1a1a24; box-shadow: 0 0 60px rgba(0, 229, 255, 0.2); }
        
        #top-status-bar { width: 100%; height: 18%; background: rgba(5, 7, 12, 0.95); border-bottom: 2px solid #00e5ff44; padding: 8px 12px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 6px; z-index: 105; }
        .bar-group { display: flex; flex-direction: column; gap: 3px; justify-content: center; }
        .bar-row { display: flex; align-items: center; gap: 6px; }
        .bar-label { width: 45px; font-weight: bold; color: #88a0a8; font-size: 9px; }
        .bar-bg { flex: 1; height: 9px; background: #06090e; border: 1px solid #1e2d3d; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.2s ease-out; }
        #hp-fill { background: linear-gradient(90deg, #ff1744, #b20028); }
        #exp-fill { background: linear-gradient(90deg, #76ff03, #33691e); width: 0%; }
        #mp-fill { background: linear-gradient(90deg, #00e5ff, #007c91); width: 0%; }
        .bar-text { font-size: 8.5px; width: 55px; text-align: right; color: #a0b0b8; font-weight: bold; }
        
        .right-info { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; font-size: 10px; border-left: 1px solid #1e2d3d; padding-left: 8px; color: #eee; gap: 2px; }
        .char-tag { color: #00e5ff; font-weight: 900; font-size: 12px; text-shadow: 0 0 10px rgba(0,229,255,0.6); }
        .lvl-tag { color: #76ff03; font-weight: 900; font-size: 11px; }

        #glb-btn-top { background: #00e5ff; color: #000; font-weight: bold; border: none; font-size: 9px; padding: 3px 6px; border-radius: 3px; cursor: pointer; margin-top: 2px; }

        #quest-box { position: absolute; top: 19%; left: 10px; z-index: 140; background: rgba(5, 10, 20, 0.85); border: 1px solid #00e5ff; border-radius: 6px; padding: 6px 10px; color: #fff; font-size: 10px; width: 220px; }
        #quest-box div { color: #ffd700; font-weight: bold; margin-bottom: 2px; }

        #canvas3d-container { position: relative; width: 100%; height: 50%; background: #050811; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; display: block; }

        #combo-container { position: absolute; top: 12%; right: 15px; z-index: 145; color: #fff; font-weight: 900; font-size: 28px; text-align: right; opacity: 0; transform: scale(0.5); transition: 0.2s; }
        #combo-container.active { opacity: 1; transform: scale(1); }
        #combo-container span { font-size: 9px; color: #00e5ff; display: block; }

        .damage-popup { position: absolute; color: #fff; font-weight: 900; font-size: 18px; pointer-events: none; z-index: 150; transform: translate(-50%, -50%); animation: popupAnim 0.5s ease-out forwards; }
        .crit-popup { color: #00e5ff !important; font-size: 26px !important; text-shadow: 0 0 12px #00e5ff; }
        .bankai-popup { color: #ffd700 !important; font-size: 28px !important; text-shadow: 0 0 20px #ffaa00; }
        
        @keyframes popupAnim { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); } 30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -50%) translateY(-40px); } }

        #ui-panel { width: 100%; height: 32%; background: #040609; border-top: 1px solid #1e2d3d; padding: 6px; display: grid; grid-template-columns: 0.9fr 1.1fr 1.2fr; gap: 4px; z-index: 100; }
        #dpad-container { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 95px; height: 95px; margin: auto; gap: 2px; }
        .dpad-btn { background: #0a0f18; border: 1px solid #1e2d3d; border-radius: 4px; color: #708898; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .dpad-btn:active { background: #00e5ff; color: #000; }
        .dpad-empty { visibility: hidden; }

        #status-board { background: #020305; border: 1px solid #141f2c; border-radius: 5px; padding: 6px; color: #8090a0; font-size: 8.5px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
        .log-title { color: #00e5ff; font-weight: bold; border-bottom: 1px solid #141f2c; padding-bottom: 2px; }
        #log-content { flex: 1; font-size: 8px; overflow-y: auto; color: #607080; }

        #action-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 3px; }
        .action-btn { width: 100%; height: 100%; border: 1px solid #1e2d3d; border-radius: 4px; font-size: 9.5px; font-weight: bold; color: #a0b0c0; background: #0a0f18; cursor: pointer; }
        #btn-atk { background: linear-gradient(180deg, #141f2c, #0a0f18); color: #fff; grid-column: span 2; }
        #btn-z { background: linear-gradient(180deg, #0088cc, #004466); color: #fff; }
        #btn-x { background: linear-gradient(180deg, #00e5ff, #007c91); color: #000; }
        #btn-c { background: linear-gradient(180deg, #9933ff, #440088); color: #fff; }
        #btn-v { background: linear-gradient(180deg, #ffd700, #998000); color: #000; font-weight: 900; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="combo-container"><span id="combo-count">0</span><span>COMBO</span></div>

    <div id="top-status-bar">
        <div class="bar-group">
            <div class="bar-row"><span class="bar-label">HP</span><div class="bar-bg"><div id="hp-fill" class="bar-fill"></div></div><span id="hp-txt" class="bar-text">300 / 300</span></div>
            <div class="bar-row"><span class="bar-label">EXP</span><div class="bar-bg"><div id="exp-fill" class="bar-fill"></div></div><span id="exp-txt" class="bar-text">0 / 100</span></div>
            <div class="bar-row"><span class="bar-label">MP 영압</span><div class="bar-bg"><div id="mp-fill" class="bar-fill"></div></div><span id="mp-txt" class="bar-text">0 / 100</span></div>
        </div>
        <div class="right-info">
            <div class="lvl-tag" id="player-lvl">LV. 1</div>
            <div class="char-tag" id="player-char-name">히츠가야 토시로</div>
            <button id="glb-btn-top" onclick="triggerFileUpload()">📂 GLB 업로드</button>
        </div>
    </div>

    <div id="quest-box">
        <div>📜 현재 퀘스트 [Blox Quest]</div>
        <span id="quest-desc">하급 호로 3마리를 처치하세요 (0/3)</span>
    </div>

    <div id="canvas3d-container"></div>

    <div id="ui-panel">
        <div id="dpad-container">
            <div class="dpad-empty"></div><div class="dpad-btn" id="dpad-up">▲</div><div class="dpad-empty"></div>
            <div class="dpad-btn" id="dpad-left">◀</div><div class="dpad-empty"></div><div class="dpad-btn" id="dpad-right">▶</div>
            <div class="dpad-empty"></div><div class="dpad-btn" id="dpad-down">▼</div><div class="dpad-empty"></div>
        </div>
        
        <div id="status-board">
            <div class="log-title">📜 [차원 필드 기록]</div>
            <div id="log-content">거대 토시로 렌더링 완료!</div>
        </div>

        <div id="action-grid">
            <button id="btn-atk" class="action-btn">⚔️ 기본 참격 [M1]</button>
            <button id="btn-z" class="action-btn">🐉 [Z] 거대 빙룡천상</button>
            <button id="btn-x" class="action-btn">🧊 [X] 대형 빙주 폭발</button>
            <button id="btn-c" class="action-btn">❄️ [C] 초거대 백화장</button>
            <button id="btn-v" class="action-btn">🌌 [V] 대홍련빙륜환</button>
        </div>
    </div>
</div>

<script>
let gameInstance = null;
const MAP_WIDTH = 120;
const MAP_LENGTH = 300;

function triggerFileUpload() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.glb,.gltf';
    input.onchange = (e) => {
        const file = e.target.files[0];
        if(file && gameInstance) {
            const url = URL.createObjectURL(file);
            gameInstance.player.loadCustomModel(url);
        }
    };
    input.click();
}

class Game {
    constructor() {
        this.container = document.getElementById('canvas3d-container');
        this.logBox = document.getElementById('log-content');
        
        this.mp = 0;
        this.questTarget = 3; this.questCount = 0;
        this.comboCount = 0; this.comboTimer = null;
        this.clock = new THREE.Clock();

        this.initThree();
        this.initWorld();
        this.player = new Player(this);
        
        this.enemies = []; this.particles = []; this.fxObjects = [];
        this.spawnBloxMobs();
        
        this.keys = { up: false, down: false, left: false, right: false };
        this.initEvents(); this.updateUI();
    }

    initThree() {
        this.scene = new THREE.Scene(); 
        this.scene.background = new THREE.Color(0x060913);
        this.scene.fog = new THREE.FogExp2(0x060913, 0.005);
        
        // 10배 커진 캐릭터에 맞춘 카메라 거리 설정
        this.camera = new THREE.PerspectiveCamera(45, this.container.clientWidth / this.container.clientHeight, 0.1, 1000);
        this.camera.position.set(0, 60, 80);
        
        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.shadowMap.enabled = true;
        this.container.appendChild(this.renderer.domElement);
        
        this.mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
        this.mainLight.position.set(50, 100, 50);
        this.scene.add(this.mainLight);
        this.scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    }

    initWorld() {
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(MAP_WIDTH, MAP_LENGTH), 
            new THREE.MeshStandardMaterial({ color: 0x1a233a, roughness: 0.7 })
        );
        floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, -MAP_LENGTH/2 + 20);
        this.scene.add(floor);

        const grid = new THREE.GridHelper(MAP_LENGTH, 40, 0x00e5ff, 0x112233);
        grid.position.set(0, 0.1, -MAP_LENGTH/2 + 20);
        this.scene.add(grid);
    }

    spawnBloxMobs() {
        const zoneConfigs = [
            { zOffset: -40, type: 'HOLLOW', count: 3, name: '[LV.1] 하급 호로' },
            { zOffset: -100, type: 'SHINIGAMI', count: 3, name: '[LV.10] 호정 사신' },
            { zOffset: -180, type: 'ARRANCAR', count: 3, name: '[LV.25] 아란칼' },
            { zOffset: -250, type: 'QUINCY_BOSS', count: 1, name: '[LV.50 BOSS] 슈테른릿터 보스', boss: true }
        ];

        zoneConfigs.forEach(zCfg => {
            for(let i=0; i<zCfg.count; i++) {
                const mob = new BloxEnemy(this, zCfg.type, zCfg.name, zCfg.boss);
                mob.mesh.position.set((Math.random()-0.5)*(MAP_WIDTH-20), 0, zCfg.zOffset + (Math.random()-0.5)*30);
                this.enemies.push(mob);
            }
        });
    }

    addParticles(pos, color, count = 20, scaleMult = 5.0) {
        for(let i=0; i<count; i++) {
            const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.95 });
            const p = new THREE.Mesh(new THREE.BoxGeometry(0.5 * scaleMult, 0.5 * scaleMult, 0.5 * scaleMult), mat);
            p.position.copy(pos);
            p.userData = { vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() * 0.8 + 0.3), vz: (Math.random() - 0.5) * 1.2, life: 1.0 };
            this.scene.add(p); this.particles.push(p);
        }
    }

    addFXObject(mesh, updateFn) {
        this.scene.add(mesh);
        this.fxObjects.push({ mesh: mesh, update: updateFn, life: 1.0 });
    }

    updateAndCleanFX() {
        for(let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
            p.userData.life -= 0.03; p.material.opacity = p.userData.life;
            if(p.userData.life <= 0) { this.scene.remove(p); this.particles.splice(i, 1); }
        }
        for(let i = this.fxObjects.length - 1; i >= 0; i--) {
            const fx = this.fxObjects[i]; fx.life -= 0.02;
            if (fx.update) fx.update(fx.mesh, fx.life);
            if(fx.life <= 0) { this.scene.remove(fx.mesh); this.fxObjects.splice(i, 1); }
        }
    }

    applyCameraUpdate() {
        let targetX = this.player.mesh.position.x;
        let targetY = this.player.mesh.position.y + 55.0;
        let targetZ = this.player.mesh.position.z + 65.0;
        this.camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.16);
        this.camera.lookAt(this.player.mesh.position.x, this.player.mesh.position.y + 10, this.player.mesh.position.z);
    }

    addCombo() {
        this.comboCount++;
        const el = document.getElementById('combo-container');
        document.getElementById('combo-count').innerText = this.comboCount; el.classList.add('active');
        clearTimeout(this.comboTimer);
        this.comboTimer = setTimeout(() => { this.comboCount = 0; el.classList.remove('active'); }, 2000);
    }

    onMobKilled() {
        this.questCount++;
        if(this.questCount >= this.questTarget) {
            this.questCount = 0;
            this.player.addExp(100);
            this.log(`📜 <b>[퀘스트 완료]</b> 보상 EXP 100 획득!`);
        }
        document.getElementById('quest-desc').innerText = `하급 호로 처치 진행 중 (${this.questCount}/${this.questTarget})`;
    }

    log(msg) { this.logBox.innerHTML = msg + "<br>" + this.logBox.innerHTML; }

    updateUI() {
        document.getElementById('hp-fill').style.width = (this.player.hp / this.player.maxHp * 100) + "%";
        document.getElementById('hp-txt').innerText = `${Math.round(this.player.hp)} / ${this.player.maxHp}`;
        document.getElementById('exp-fill').style.width = (this.player.exp / this.player.maxExp * 100) + "%";
        document.getElementById('exp-txt').innerText = `${this.player.exp} / ${this.player.maxExp}`;
        document.getElementById('mp-fill').style.width = this.mp + "%";
        document.getElementById('mp-txt').innerText = `${this.mp} / 100`;
        document.getElementById('player-lvl').innerText = `LV. ${this.player.level}`;
    }

    popText(pos, text, type = 'NORMAL') {
        const p = pos.clone().project(this.camera);
        const pop = document.createElement('div');
        pop.className = "damage-popup " + (type === 'CRIT' ? "crit-popup" : (type === 'BANKAI' ? "bankai-popup" : ""));
        pop.innerText = text; 
        pop.style.left = ((p.x * .5 + .5) * this.container.clientWidth) + "px"; 
        pop.style.top = ((-(p.y * .5) + .5) * this.container.clientHeight) + "px";
        this.container.appendChild(pop); setTimeout(() => pop.remove(), 600);
    }

    initEvents() {
        const setKey = (id, dir, val) => {
            const el = document.getElementById(id);
            el.addEventListener('mousedown', () => this.keys[dir] = val);
            el.addEventListener('mouseup', () => this.keys[dir] = !val);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys[dir] = val; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); this.keys[dir] = !val; });
        };
        setKey('dpad-up', 'up', true); setKey('dpad-down', 'down', true);
        setKey('dpad-left', 'left', true); setKey('dpad-right', 'right', true);
        
        document.getElementById('btn-atk').addEventListener('click', () => this.player.attack());
        document.getElementById('btn-z').addEventListener('click', () => this.player.skillZ());
        document.getElementById('btn-x').addEventListener('click', () => this.player.skillX());
        document.getElementById('btn-c').addEventListener('click', () => this.player.skillC());
        document.getElementById('btn-v').addEventListener('click', () => this.player.skillV());
    }
}

class Player {
    constructor(game) {
        this.game = game; this.level = 1; this.exp = 0; this.maxExp = 100;
        this.hp = 300; this.maxHp = 300; this.atk = 120; this.speed = 0.6; // 10배 스케일링 이동속도
        this.isBankai = false;
        
        this.mesh = new THREE.Group();
        this.game.scene.add(this.mesh);
        this.buildToshiroModel();
    }

    loadCustomModel(url) {
        if(this.model) this.mesh.remove(this.model);
        const loader = new THREE.GLTFLoader();
        loader.load(url, (gltf) => {
            this.model = gltf.scene; 
            // GLB 10배 확충 스케일링
            this.model.scale.set(20.0, 20.0, 20.0);
            this.mesh.add(this.model);
            this.game.log(`✨ 커스텀 GLB (10배 스케일) 로드 완료!`);
        }, undefined, () => this.buildToshiroModel());
    }

    buildToshiroModel() {
        // 🔥 토시로 10배 확대 모델링
        const group = new THREE.Group();
        
        const head = new THREE.Mesh(new THREE.SphereGeometry(7.5), new THREE.MeshStandardMaterial({ color: 0xffdfc4 }));
        head.position.y = 26;
        const hair = new THREE.Mesh(new THREE.ConeGeometry(8.5, 10, 8), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        hair.position.set(0, 31, -0.5);
        const body = new THREE.Mesh(new THREE.CylinderGeometry(4, 6.5, 20), new THREE.MeshStandardMaterial({ color: 0x0a0a0f }));
        body.position.y = 13;
        
        const haori = new THREE.Mesh(new THREE.CylinderGeometry(4.5, 7.5, 18, 12, 1, true, 0, Math.PI * 0.8), new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
        haori.position.set(0, 13, 0); haori.rotation.y = Math.PI * 0.8;

        group.add(head, hair, body, haori);
        this.mesh.add(group);
        this.model = group;
    }

    addExp(amt) {
        this.exp += amt;
        if(this.exp >= this.maxExp) {
            this.level++; this.exp = 0; this.maxExp += 60;
            this.atk += 30; this.maxHp += 100; this.hp = this.maxHp;
            this.game.popText(this.mesh.position, `⭐ LEVEL UP! (LV.${this.level})`, 'BANKAI');
        }
        this.game.updateUI();
    }

    attack() {
        const frontPos = this.mesh.position.clone().add(new THREE.Vector3(0, 10, -18).applyQuaternion(this.mesh.quaternion));
        this.game.addParticles(frontPos, 0x00e5ff, 25, 8.0);
        
        let targets = this.game.enemies.filter(e => e.hp > 0 && this.mesh.position.distanceTo(e.mesh.position) < 25.0);
        if (targets.length > 0) this.game.addCombo();
        targets.forEach(e => {
            let dmg = this.atk * (this.isBankai ? 2.5 : 1.0);
            e.takeDamage(dmg);
            this.game.popText(e.mesh.position, `⚔️ -${Math.round(dmg)}`, this.isBankai ? 'CRIT' : 'NORMAL');
        });
        this.game.mp = Math.min(100, this.game.mp + 20);
        this.game.updateUI();
    }

    // 🐉 10배 거대 [Z] 빙룡천상
    skillZ() {
        this.game.log(`🐉 <b>[Z] 초거대 빙룡천상!</b>`);
        const dragon = new THREE.Mesh(new THREE.ConeGeometry(12, 35, 8), new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.85, wireframe: true }));
        dragon.rotation.x = -Math.PI / 2;
        dragon.position.copy(this.mesh.position).add(new THREE.Vector3(0, 15, -20).applyQuaternion(this.mesh.quaternion));
        
        this.game.addFXObject(dragon, (m, life) => {
            m.position.add(new THREE.Vector3(0, 0, -3.5).applyQuaternion(this.mesh.quaternion));
            m.rotation.z += 0.25;
            this.game.addParticles(m.position, 0x88ccff, 4, 6.0);
        });

        this.game.enemies.forEach(e => {
            if(e.hp > 0 && this.mesh.position.distanceTo(e.mesh.position) < 55.0) {
                e.takeDamage(this.atk * 2.5);
                this.game.popText(e.mesh.position, `🐉 초거대 빙룡 -${Math.round(this.atk * 2.5)}`, 'CRIT');
            }
        });
        this.game.addCombo();
    }

    // 🧊 10배 대형 [X] 빙주 폭발
    skillX() {
        this.game.log(`🧊 <b>[X] 대형 빙주 폭발!</b>`);
        for(let i=0; i<8; i++) {
            const pillar = new THREE.Mesh(new THREE.CylinderGeometry(2.0, 10.0, 50.0, 6), new THREE.MeshStandardMaterial({ color: 0xaaddff, transparent: true, opacity: 0.8 }));
            let offset = new THREE.Vector3((Math.random()-0.5)*40, 25, -20 - Math.random()*40).applyQuaternion(this.mesh.quaternion);
            pillar.position.copy(this.mesh.position).add(offset);
            
            this.game.addFXObject(pillar, (m, life) => {
                m.scale.y = life;
                this.game.addParticles(m.position, 0x00e5ff, 3, 7.0);
            });
        }

        this.game.enemies.forEach(e => {
            if(e.hp > 0 && this.mesh.position.distanceTo(e.mesh.position) < 45.0) {
                e.takeDamage(this.atk * 3.0);
                this.game.popText(e.mesh.position, `💥 대형 빙주 -${Math.round(this.atk * 3.0)}`, 'CRIT');
            }
        });
        this.game.addCombo();
    }

    // ❄️ 10배 초거대 [C] 빙천백화장
    skillC() {
        this.game.log(`❄️ <b>[C] 초거대 빙천백화장!</b>`);
        const flower = new THREE.Mesh(new THREE.TorusGeometry(35.0, 3.0, 8, 32), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
        flower.rotation.x = Math.PI / 2;
        flower.position.copy(this.mesh.position).add(new THREE.Vector3(0, 2.0, -35.0).applyQuaternion(this.mesh.quaternion));

        this.game.addFXObject(flower, (m, life) => {
            m.scale.multiplyScalar(1.03);
            this.game.addParticles(m.position, 0xffffff, 10, 8.0);
        });

        this.game.enemies.forEach(e => {
            if(e.hp > 0 && this.mesh.position.distanceTo(e.mesh.position) < 60.0) {
                e.takeDamage(this.atk * 4.2);
                this.game.popText(e.mesh.position, `❄️ 백화장 -${Math.round(this.atk * 4.2)}`, 'BANKAI');
            }
        });
        this.game.addCombo();
    }

    // 🌌 10배 초대형 [V] 만해 개방
    skillV() {
        if(this.game.mp < 100) return;
        this.game.mp = 0; this.isBankai = true;
        this.game.log(`🌌 <span style='color:#ffd700;font-weight:900;'>[V] 만해: 초대형 "대홍련빙륜환" 개방!!</span>`);
        
        // 10배 확대 얼음 날개
        const wingL = new THREE.Mesh(new THREE.BoxGeometry(35.0, 2.0, 10.0), new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.85 }));
        wingL.position.set(-18.0, 25.0, -5.0); wingL.rotation.z = 0.35;
        const wingR = wingL.clone(); wingR.position.x = 18.0; wingR.rotation.z = -0.35;
        
        this.mesh.add(wingL, wingR);
        this.game.popText(this.mesh.position, `❄️ 대홍련빙륜환!`, 'BANKAI');

        setTimeout(() => {
            this.mesh.remove(wingL, wingR);
            this.isBankai = false;
            this.game.updateUI();
        }, 15000);
        this.game.updateUI();
    }

    move(delta) {
        let dx = 0, dz = 0;
        if (this.game.keys.up) dz = -1; if (this.game.keys.down) dz = 1;
        if (this.game.keys.left) dx = -1; if (this.game.keys.right) dx = 1;
        
        if (dx !== 0 || dz !== 0) {
            let mag = Math.sqrt(dx*dx + dz*dz);
            let nextX = this.mesh.position.x + (dx/mag) * this.speed;
            let nextZ = this.mesh.position.z + (dz/mag) * this.speed;
            
            if (Math.abs(nextX) < MAP_WIDTH / 2 - 5.0) this.mesh.position.x = nextX;
            if (nextZ > -MAP_LENGTH + 30 && nextZ < 15) this.mesh.position.z = nextZ;
            this.mesh.rotation.y = Math.atan2(dx, dz);
        }
    }
}

class BloxEnemy {
    constructor(game, type, name, isBoss = false) {
        this.game = game; this.type = type; this.name = name; this.isBoss = isBoss;
        this.hp = isBoss ? 1500 : 400; this.maxHp = this.hp;
        this.speed = isBoss ? 0.15 : 0.2;
        this.mesh = new THREE.Group();
        
        let scale = isBoss ? 8.0 : 5.0;
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5 * scale, 0.8 * scale, 2.0 * scale), new THREE.MeshStandardMaterial({ color: isBoss ? 0xff1744 : 0x223344 }));
        body.position.y = 1.0 * scale;
        this.mesh.add(body);

        this.game.scene.add(this.mesh);
    }

    takeDamage(amt) {
        this.hp = Math.max(0, this.hp - amt);
        if(this.hp <= 0) {
            this.game.addParticles(this.mesh.position, 0xffffff, 25, 8.0);
            this.mesh.position.y = -200;
            this.game.player.addExp(this.isBoss ? 200 : 50);
            this.game.onMobKilled();
        }
    }

    update() {
        if(this.hp <= 0) return;
        const pPos = this.game.player.mesh.position;
        const dist = this.mesh.position.distanceTo(pPos);

        if (dist < 45.0) {
            let dir = new THREE.Vector3().subVectors(pPos, this.mesh.position).normalize();
            this.mesh.position.addScaledVector(dir, this.speed);
            this.mesh.rotation.y = Math.atan2(dir.x, dir.z);

            if(dist < (this.isBoss ? 12.0 : 7.0)) {
                this.game.player.hp = Math.max(0, this.game.player.hp - (this.isBoss ? 0.3 : 0.12));
                this.game.updateUI();
            }
        }
    }
}

window.onload = () => {
    gameInstance = new Game();
    function animate() {
        requestAnimationFrame(animate);
        if (gameInstance) {
            const delta = gameInstance.clock.getDelta();
            gameInstance.player.move(delta); 
            gameInstance.enemies.forEach(e => e.update()); 
            gameInstance.updateAndCleanFX();
            gameInstance.applyCameraUpdate(); 
            gameInstance.renderer.render(gameInstance.scene, gameInstance.camera);
        }
    }
    animate();
};
</script>
