<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 야치루 삼포검수 - 모바일 모드</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: -apple-system, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #ffeef5; color: #333; }
        #webgl-container { width: 100%; height: 100%; display: block; }

        /* HUD & Mobile Overlay */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }

        .top-hud { display: flex; justify-content: space-between; align-items: flex-start; }
        .player-card { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(10px); border: 2px solid #ff69b4; padding: 10px 14px; border-radius: 16px; width: 220px; pointer-events: auto; box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3); }
        .player-card h2 { font-size: 0.95rem; color: #ff1493; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .bar-bg { width: 100%; height: 10px; background: #ffd0e0; border-radius: 5px; overflow: hidden; margin-bottom: 4px; }
        .bar-hp { height: 100%; background: linear-gradient(90deg, #ff1493, #ff69b4); width: 100%; transition: width 0.2s; }
        .bar-mp { height: 100%; background: linear-gradient(90deg, #ba55d3, #da70d6); width: 100%; transition: width 0.2s; }

        /* Mobile Touch Controls */
        .bottom-hud { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; pointer-events: auto; }
        
        /* Left Joystick Zone */
        #joystick-zone { width: 130px; height: 130px; background: rgba(255, 255, 255, 0.4); border: 2px solid #ff69b4; border-radius: 50%; position: relative; touch-action: none; backdrop-filter: blur(4px); }
        #joystick-knob { width: 50px; height: 50px; background: #ff1493; border: 2px solid #fff; border-radius: 50%; position: absolute; top: 38px; left: 38px; box-shadow: 0 0 10px rgba(255,20,147,0.5); }

        /* Right Action Buttons */
        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-act { width: 58px; height: 58px; border-radius: 50%; border: 2px solid #ff69b4; background: rgba(255, 255, 255, 0.9); color: #ff1493; font-weight: bold; font-size: 0.75rem; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 4px 12px rgba(255, 105, 180, 0.3); touch-action: manipulation; }
        .btn-act:active { transform: scale(0.9); background: #ff69b4; color: #fff; }
        .btn-act.main-atk { width: 68px; height: 68px; background: #ff1493; color: #fff; border-color: #fff; grid-column: span 2; justify-self: center; font-size: 0.85rem; }

        /* Floating Damage Text */
        .dmg-float { position: absolute; font-weight: 900; font-size: 1.6rem; pointer-events: none; animation: floatUp 0.8s forwards; text-shadow: 0 0 6px #fff, 0 0 10px #ff1493; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-45px) scale(1.3); } }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <div id="hud">
        <div class="top-hud">
            <div class="player-card">
                <h2><span>🌸 야치루</span><span style="font-size:0.75rem; color:#ff1493;">Lv.MAX</span></h2>
                <div class="bar-bg"><div class="bar-hp" id="ui-hp-bar"></div></div>
                <div class="bar-bg"><div class="bar-mp" id="ui-mp-bar"></div></div>
            </div>
        </div>

        <div class="bottom-hud">
            <div id="joystick-zone">
                <div id="joystick-knob"></div>
            </div>

            <div class="action-grid">
                <button class="btn-act" onclick="useDash()">⚡<br>순보</button>
                <button class="btn-act" onclick="useUltimate()">🌸<br>폭발</button>
                <button class="btn-act" onclick="useBeastSkill()">👹<br>난무</button>
                <button class="btn-act main-atk" onclick="playerAttack()">⚔️<br>삼포참격</button>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let playerGroup, frontBeastMesh, backBeastMesh, particleGroup;
        let monsters = [];

        // 모바일 조이스틱 상태
        let joystickInput = { x: 0, z: 0, active: false };

        let player = {
            hp: 200, maxHp: 200, mp: 100, maxMp: 100,
            atk: 50, angle: 0,
            attackCooldown: false,
            isDashing: false
        };

        function init() {
            const container = document.getElementById('webgl-container');
            scene = new THREE.Scene();
            
            // ☀️ 1. 분위기 더욱 밝게 변경 (밝은 핑크빛 벚꽃 배경 & 안개)
            scene.background = new THREE.Color(0xffebf2);
            scene.fog = new THREE.FogExp2(0xffebf2, 0.008);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // ☀️ 2. 밝은 조명 세팅
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfff0f5, 1.5);
            dirLight.position.set(20, 50, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            particleGroup = new THREE.Group();
            scene.add(particleGroup);

            // 🗺️ 3. 코드로 직접 만든 밝은 타일 맵 (외부 이미지 필요 없음)
            createProceduralMap();

            // 🌸 4. 캐릭터 크기 확대 및 땅 위치 정밀 교정
            createYachiruAndBeasts();

            // 몬스터 생성
            spawnMonsters(12);

            // 모바일 터치 조이스틱 바인딩
            setupJoystick();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // 🎨 코드로 밝은 벚꽃 문양 맵 텍스처 직접 그리기
        function createProceduralMap() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // 바닥 밝은 핑크/화이트 격자 패턴
            ctx.fillStyle = '#fff5f8';
            ctx.fillRect(0, 0, 512, 512);

            ctx.strokeStyle = '#ffc0cb';
            ctx.lineWidth = 8;
            ctx.strokeRect(0, 0, 512, 512);

            // 중앙 장식 동그라미
            ctx.fillStyle = '#ffe4e1';
            ctx.beginPath();
            ctx.arc(256, 256, 180, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ffb6c1';
            ctx.lineWidth = 4;
            ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(12, 12);

            const floorGeo = new THREE.PlaneGeometry(160, 160);
            const floorMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.4 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
        }

        // 🌸 야치루 & 삼포검수 3D 캐릭터 생성
        function createYachiruAndBeasts() {
            playerGroup = new THREE.Group();

            // 🔍 [요청사항 반영] 캐릭터 크기를 크게 확대 (Scale 1.8배)
            playerGroup.scale.set(1.8, 1.8, 1.8);

            // 🔍 [요청사항 반영] 땅에 박히지 않도록 피벗 Y축을 0 위로 정밀하게 배치
            // 야치루 본체 (사패장 + 분홍 머리)
            const bodyHeight = 1.2;
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.25, 0.35, bodyHeight, 16),
                new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3 })
            );
            body.position.y = bodyHeight / 2; // 발바닥이 딱 y=0에 오도록 설정
            body.castShadow = true;
            playerGroup.add(body);

            // 분홍 단발머리
            const hair = new THREE.Mesh(
                new THREE.SphereGeometry(0.42, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xff1493, roughness: 0.2 })
            );
            hair.position.y = bodyHeight + 0.2;
            hair.castShadow = true;
            playerGroup.add(hair);

            // 참백도
            const katana = new THREE.Mesh(
                new THREE.BoxGeometry(0.08, 1.2, 0.15),
                new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xff69b4, emissiveIntensity: 0.8 })
            );
            katana.position.set(0.4, bodyHeight * 0.6, 0.2);
            katana.rotation.x = Math.PI / 4;
            playerGroup.add(katana);

            // 前獸 (앞의 뼈 야수 모구라)
            frontBeastMesh = new THREE.Group();
            const fHead = new THREE.Mesh(
                new THREE.ConeGeometry(0.45, 1.0, 8),
                new THREE.MeshStandardMaterial({ color: 0xf0f0f0, emissive: 0x9b5de5, emissiveIntensity: 0.3 })
            );
            fHead.rotation.x = -Math.PI / 2;
            fHead.position.y = 0.8;
            frontBeastMesh.add(fHead);

            frontBeastMesh.position.set(0, 0, 1.6);
            frontBeastMesh.scale.set(0.001, 0.001, 0.001);
            playerGroup.add(frontBeastMesh);

            // 後獸 (뒤의 털 야수 호네호네)
            backBeastMesh = new THREE.Group();
            const bBody = new THREE.Mesh(
                new THREE.DodecahedronGeometry(0.7),
                new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.8 })
            );
            bBody.position.y = 0.8;
            backBeastMesh.add(bBody);

            backBeastMesh.position.set(0, 0, -1.6);
            backBeastMesh.scale.set(0.001, 0.001, 0.001);
            playerGroup.add(backBeastMesh);

            scene.add(playerGroup);
        }

        // ⚔️ 삼포참격 (3중 시차 연속 공격)
        function playerAttack() {
            if (player.attackCooldown) return;
            player.attackCooldown = true;

            // 1타: 야치루 참격
            spawnPinkSlashArc(playerGroup.position, player.angle, 0, 0xff1493);
            executeDamageHit(0, 1.0);

            // 2타: 앞의 야수 참격
            setTimeout(() => {
                frontBeastMesh.scale.set(1.2, 1.2, 1.2);
                spawnPinkSlashArc(playerGroup.position, player.angle, 2.0, 0x9b5de5);
                executeDamageHit(2.0, 0.9);
            }, 80);

            // 3타: 뒤의 야수 참격
            setTimeout(() => {
                backBeastMesh.scale.set(1.3, 1.3, 1.3);
                spawnPinkSlashArc(playerGroup.position, player.angle, -1.6, 0xffd700);
                executeDamageHit(-1.6, 0.9);
            }, 160);

            setTimeout(() => {
                frontBeastMesh.scale.set(0.001, 0.001, 0.001);
                backBeastMesh.scale.set(0.001, 0.001, 0.001);
                player.attackCooldown = false;
            }, 320);
        }

        function useBeastSkill() {
            if (player.mp < 25 || player.attackCooldown) return;
            player.mp -= 25;
            player.attackCooldown = true;

            frontBeastMesh.scale.set(1.4, 1.4, 1.4);
            backBeastMesh.scale.set(1.4, 1.4, 1.4);

            let spins = 0;
            const interval = setInterval(() => {
                playerGroup.rotation.y += Math.PI / 2;
                spawnParticles(playerGroup.position.x, 1.5, playerGroup.position.z, 0xff1493, 12);

                monsters.forEach(m => {
                    if (playerGroup.position.distanceTo(m.mesh.position) < 6.0) {
                        let dmg = Math.floor(player.atk * 0.9);
                        m.hp -= dmg;
                        showDamageText(dmg, m.mesh.position, '#ff1493');
                    }
                });

                spins++;
                if (spins >= 6) {
                    clearInterval(interval);
                    frontBeastMesh.scale.set(0.001, 0.001, 0.001);
                    backBeastMesh.scale.set(0.001, 0.001, 0.001);
                    player.attackCooldown = false;
                }
            }, 60);

            updateUI();
        }

        function useUltimate() {
            if (player.mp < 40 || player.attackCooldown) return;
            player.mp -= 40;
            player.attackCooldown = true;

            spawnParticles(playerGroup.position.x, 2, playerGroup.position.z, 0xff1493, 80);

            monsters.forEach(m => {
                if (playerGroup.position.distanceTo(m.mesh.position) < 11.0) {
                    let dmg = Math.floor(player.atk * 3.8);
                    m.hp -= dmg;
                    showDamageText(`💥${dmg}`, m.mesh.position, '#ff007f');
                }
            });

            setTimeout(() => { player.attackCooldown = false; }, 400);
            updateUI();
        }

        function useDash() {
            if (player.mp < 10 || player.isDashing) return;
            player.mp -= 10;
            player.isDashing = true;

            spawnParticles(playerGroup.position.x, 1, playerGroup.position.z, 0xff69b4, 20);
            playerGroup.position.x += Math.sin(player.angle) * 8.0;
            playerGroup.position.z += Math.cos(player.angle) * 8.0;

            setTimeout(() => { player.isDashing = false; }, 200);
            updateUI();
        }

        function executeDamageHit(offsetZ, mult) {
            const hitPos = new THREE.Vector3(
                playerGroup.position.x + Math.sin(player.angle) * offsetZ,
                playerGroup.position.y + 1.0,
                playerGroup.position.z + Math.cos(player.angle) * offsetZ
            );

            monsters.forEach(m => {
                if (hitPos.distanceTo(m.mesh.position) < 4.5) {
                    let dmg = Math.floor(player.atk * mult + Math.random() * 8);
                    m.hp -= dmg;
                    showDamageText(dmg, m.mesh.position, '#ff1493');
                }
            });
        }

        function spawnPinkSlashArc(pos, angle, offsetZ, colorHex) {
            const arcGeo = new THREE.RingGeometry(1.6, 2.8, 16, 1, 0, Math.PI);
            const arcMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.95 });
            const arcMesh = new THREE.Mesh(arcGeo, arcMat);

            arcMesh.rotation.x = Math.PI / 2;
            arcMesh.rotation.z = -angle + Math.PI / 2;
            arcMesh.position.set(pos.x + Math.sin(angle) * offsetZ, pos.y + 1.2, pos.z + Math.cos(angle) * offsetZ);

            scene.add(arcMesh);

            let opacity = 0.95;
            const fade = setInterval(() => {
                opacity -= 0.15;
                arcMesh.material.opacity = opacity;
                if (opacity <= 0) {
                    clearInterval(fade);
                    scene.remove(arcMesh);
                }
            }, 30);
        }

        // 📱 모바일 가상 조이스틱 터치 이벤트 처리
        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const maxRadius = 40;

            function handleTouch(e) {
                const touch = e.touches[0];
                const rect = zone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                let dist = Math.hypot(dx, dy);

                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickInput.x = dx / maxRadius;
                joystickInput.z = dy / maxRadius;
                joystickInput.active = true;
            }

            zone.addEventListener('touchstart', handleTouch, { passive: false });
            zone.addEventListener('touchmove', (e) => { e.preventDefault(); handleTouch(e); }, { passive: false });
            zone.addEventListener('touchend', () => {
                knob.style.transform = `translate(0px, 0px)`;
                joystickInput = { x: 0, z: 0, active: false };
            });
        }

        function spawnMonsters(count) {
            for (let i = 0; i < count; i++) {
                const group = new THREE.Group();
                const mesh = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(1.0),
                    new THREE.MeshStandardMaterial({ color: 0x9b5de5, roughness: 0.3 })
                );
                mesh.position.y = 1.0; // 땅 위에 올바르게 생성
                mesh.castShadow = true;
                group.add(mesh);

                let rx = (Math.random() - 0.5) * 100;
                let rz = (Math.random() - 0.5) * 100;
                if (Math.abs(rx) < 12) rx += 20;
                group.position.set(rx, 0, rz);

                scene.add(group);
                monsters.push({ mesh: group, hp: 130, maxHp: 130, speed: 0.05 });
            }
        }

        function updateGame() {
            const speed = 0.28;

            if (joystickInput.active) {
                const moveX = joystickInput.x;
                const moveZ = joystickInput.z;

                const angle = Math.atan2(moveX, moveZ);
                player.angle = angle;
                playerGroup.rotation.y = angle;

                playerGroup.position.x += moveX * speed;
                playerGroup.position.z += moveZ * speed;

                player.mp = Math.min(player.maxMp, player.mp + 0.08);
                updateUI();
            }

            // 몬스터 이동 및 사망
            for (let i = monsters.length - 1; i >= 0; i--) {
                const m = monsters[i];
                if (m.hp <= 0) {
                    spawnParticles(m.mesh.position.x, 1, m.mesh.position.z, 0x9b5de5, 20);
                    scene.remove(m.mesh);
                    monsters.splice(i, 1);
                    continue;
                }

                const dist = m.mesh.position.distanceTo(playerGroup.position);
                if (dist < 22 && dist > 1.8) {
                    m.mesh.position.x += ((playerGroup.position.x - m.mesh.position.x) / dist) * m.speed;
                    m.mesh.position.z += ((playerGroup.position.z - m.mesh.position.z) / dist) * m.speed;
                    m.mesh.lookAt(playerGroup.position);
                }
            }

            // 카메라도 확대된 캐릭터 비율에 맞춰 시원하게 추적
            camera.position.x = playerGroup.position.x;
            camera.position.y = playerGroup.position.y + 16;
            camera.position.z = playerGroup.position.z + 18;
            camera.lookAt(playerGroup.position);
        }

        function spawnParticles(x, y, z, colorHex, count = 10) {
            for(let i = 0; i < count; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.15), new THREE.MeshBasicMaterial({ color: colorHex }));
                p.position.set(x, y, z);
                p.userData = { vx: (Math.random() - 0.5) * 0.3, vy: Math.random() * 0.3, vz: (Math.random() - 0.5) * 0.3, life: 1.0 };
                particleGroup.add(p);
            }
        }

        function showDamageText(dmg, pos, color = '#ff1493') {
            const el = document.createElement('div');
            el.className = 'dmg-float';
            el.innerText = `${dmg}`;
            el.style.color = color;

            const vector = pos.clone().project(camera);
            const x = (vector.x * .5 + .5) * window.innerWidth;
            const y = (-(vector.y * .5) + .5) * window.innerHeight;

            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function updateUI() {
            document.getElementById('ui-hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
            document.getElementById('ui-mp-bar').style.width = `${(player.mp / player.maxMp) * 100}%`;
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();

            for (let i = particleGroup.children.length - 1; i >= 0; i--) {
                let p = particleGroup.children[i];
                p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
                p.userData.life -= 0.04; p.scale.setScalar(p.userData.life);
                if (p.userData.life <= 0) particleGroup.remove(p);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
