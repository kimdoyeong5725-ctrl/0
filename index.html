<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>블리치: 야치루 삼포검수 - 스토리 모드</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; color: #fff; }
        #webgl-container { width: 100%; height: 100%; display: block; }

        /* HUD Overlay */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }

        .top-hud { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .player-card { background: rgba(10, 10, 20, 0.85); border: 2px solid #ff1493; border-left: 6px solid #ff1493; padding: 10px 14px; border-radius: 8px; width: 230px; pointer-events: auto; }
        .player-card h2 { font-size: 0.95rem; color: #ff69b4; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .bar-bg { width: 100%; height: 10px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
        .bar-hp { height: 100%; background: linear-gradient(90deg, #ff0055, #ff1493); width: 100%; transition: width 0.15s; }
        .bar-mp { height: 100%; background: linear-gradient(90deg, #7b1fa2, #ba55d3); width: 100%; transition: width 0.15s; }

        /* Stage Banner */
        #stage-banner { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 1px solid #ff1493; padding: 6px 20px; border-radius: 20px; font-weight: bold; color: #ff69b4; font-size: 1rem; letter-spacing: 1px; text-shadow: 0 0 8px #ff1493; }

        /* Game Over / Stage Clear Overlay */
        #msg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; pointer-events: auto; }
        #msg-overlay h1 { font-size: 2.8rem; color: #ff0055; margin-bottom: 10px; text-shadow: 0 0 20px #ff0000; }
        #msg-overlay p { font-size: 1.2rem; color: #ccc; margin-bottom: 20px; }
        #msg-overlay button { padding: 12px 30px; font-size: 1.1rem; font-weight: bold; background: #ff1493; color: #fff; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 0 15px #ff1493; }

        /* Mobile Joystick & Controls */
        .bottom-hud { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; pointer-events: auto; }
        #joystick-zone { width: 120px; height: 120px; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 105, 180, 0.5); border-radius: 50%; position: relative; touch-action: none; }
        #joystick-knob { width: 45px; height: 45px; background: radial-gradient(circle, #ff1493, #7b1fa2); border: 2px solid #fff; border-radius: 50%; position: absolute; top: 35px; left: 35px; }

        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .btn-act { width: 56px; height: 56px; border-radius: 50%; border: 2px solid #ff69b4; background: rgba(15, 10, 25, 0.9); color: #ff69b4; font-weight: bold; font-size: 0.75rem; display: flex; flex-direction: column; justify-content: center; align-items: center; touch-action: manipulation; }
        .btn-act:active { transform: scale(0.9); background: #ff1493; color: #fff; }
        .btn-act.main-atk { width: 68px; height: 68px; background: linear-gradient(135deg, #ff1493, #8a2be2); color: #fff; border: 2px solid #fff; grid-column: span 2; justify-self: center; font-size: 0.85rem; }

        .dmg-float { position: absolute; font-weight: 900; font-size: 1.6rem; pointer-events: none; animation: floatUp 0.6s forwards; text-shadow: 0 0 8px #000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1.2); } 100% { opacity: 0; transform: translateY(-40px) scale(0.8); } }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <div id="hud">
        <div class="top-hud">
            <div class="player-card">
                <h2><span>🌸 야치루</span><span id="ui-stage-num">ST 1</span></h2>
                <div class="bar-bg"><div class="bar-hp" id="ui-hp-bar"></div></div>
                <div class="bar-bg"><div class="bar-mp" id="ui-mp-bar"></div></div>
            </div>
            <div id="stage-banner">STAGE 1: 현세 - 호로 습격</div>
        </div>

        <div class="bottom-hud">
            <div id="joystick-zone"><div id="joystick-knob"></div></div>
            <div class="action-grid">
                <button class="btn-act" onclick="useDash()">⚡<br>순보</button>
                <button class="btn-act" onclick="useUltimate()">🌀<br>영압</button>
                <button class="btn-act" onclick="useBeastSkill()">👹<br>난무</button>
                <button class="btn-act main-atk" onclick="playerAttack()">⚔️<br>참격</button>
            </div>
        </div>
    </div>

    <div id="msg-overlay">
        <h1 id="msg-title">GAME OVER</h1>
        <p id="msg-desc">야치루의 영압이 다했습니다...</p>
        <button onclick="restartGame()">다시 도전하기</button>
    </div>

    <script>
        let scene, camera, renderer, gltfLoader;
        let playerGroup, frontBeastMesh, backBeastMesh, particleGroup, floorMesh;
        let monsters = [];

        let joystickInput = { x: 0, z: 0, active: false };
        let currentStage = 1;
        let isGameOver = false;

        let player = {
            hp: 200, maxHp: 200, mp: 100, maxMp: 100,
            atk: 70, angle: 0, attackCooldown: false, isDashing: false
        };

        const STAGE_DATA = {
            1: { name: "STAGE 1: 현세 - 호로 습격", bg: 0x050814, fog: 0x050814, floorColor: 0x1a202c, monsterCount: 8, mHp: 180, mAtk: 12, mSpeed: 0.08, bossHp: 800 },
            2: { name: "STAGE 2: 정령정 - 길리안 침공", bg: 0x0a0518, fog: 0x0a0518, floorColor: 0x2d1b36, monsterCount: 12, mHp: 320, mAtk: 22, mSpeed: 0.10, bossHp: 1800 },
            3: { name: "STAGE 3: 웨코문드 - 에스파다 결전", bg: 0x121218, fog: 0x121218, floorColor: 0xdddddd, monsterCount: 15, mHp: 550, mAtk: 35, mSpeed: 0.13, bossHp: 3500 }
        };

        function init() {
            const container = document.getElementById('webgl-container');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            gltfLoader = new THREE.GLTFLoader();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfff0f5, 1.5);
            dirLight.position.set(20, 50, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            particleGroup = new THREE.Group();
            scene.add(particleGroup);

            // 맵 구판 생성
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshStandardMaterial({ roughness: 0.8 });
            floorMesh = new THREE.Mesh(floorGeo, floorMat);
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            createYachiruCharacter();
            loadStage(1);
            setupJoystick();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // 🛠️ GLB 자동 바닥 안착 & 크기 보정 탑재 함수
        function loadGLBWithAutoGround(path, parentGroup, fallbackFunc, targetSize = 2.0) {
            gltfLoader.load(path, (gltf) => {
                const model = gltf.scene;
                // 1. 모델 크기 자동 측정 및 스케일 조정
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = targetSize / (maxDim || 1);
                model.scale.set(scale, scale, scale);

                // 2. 바닥(y=0)에 피벗 안착 정렬
                const adjustedBox = new THREE.Box3().setFromObject(model);
                model.position.y = -adjustedBox.min.y;

                model.traverse(child => { if (child.isMesh) child.castShadow = true; });
                parentGroup.add(model);
            }, undefined, () => {
                // 파일이 없거나 CORS 오류 시 fallback 실행
                fallbackFunc(parentGroup);
            });
        }

        function createYachiruCharacter() {
            playerGroup = new THREE.Group();

            loadGLBWithAutoGround('assets/yachiru.glb', playerGroup, (group) => {
                // Fallback 메쉬
                const body = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.3, 0.4, 1.4, 16),
                    new THREE.MeshStandardMaterial({ color: 0x111111 })
                );
                body.position.y = 0.7;
                group.add(body);

                const hair = new THREE.Mesh(
                    new THREE.SphereGeometry(0.45, 16, 16),
                    new THREE.MeshStandardMaterial({ color: 0xff1493 })
                );
                hair.position.y = 1.5;
                group.add(hair);
            }, 2.2);

            // 야수들 생성
            frontBeastMesh = new THREE.Group();
            const fMesh = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.2, 8), new THREE.MeshStandardMaterial({ color: 0x8a2be2 }));
            fMesh.rotation.x = -Math.PI / 2; fMesh.position.y = 0.8;
            frontBeastMesh.add(fMesh);
            frontBeastMesh.position.set(0, 0, 1.8);
            frontBeastMesh.scale.set(0.001, 0.001, 0.001);
            playerGroup.add(frontBeastMesh);

            backBeastMesh = new THREE.Group();
            const bMesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.7), new THREE.MeshStandardMaterial({ color: 0xffd700 }));
            bMesh.position.y = 0.8;
            backBeastMesh.add(bMesh);
            backBeastMesh.position.set(0, 0, -1.8);
            backBeastMesh.scale.set(0.001, 0.001, 0.001);
            playerGroup.add(backBeastMesh);

            scene.add(playerGroup);
        }

        // 📖 스테이지 전환
        function loadStage(stageNum) {
            currentStage = stageNum;
            const data = STAGE_DATA[stageNum];

            scene.background = new THREE.Color(data.bg);
            scene.fog = new THREE.FogExp2(data.fog, 0.012);
            floorMesh.material.color.setHex(data.floorColor);

            document.getElementById('stage-banner').innerText = data.name;
            document.getElementById('ui-stage-num').innerText = `ST ${stageNum}`;

            // 기존 몬스터 제거
            monsters.forEach(m => scene.remove(m.mesh));
            monsters = [];

            // 잡몹 스폰
            for (let i = 0; i < data.monsterCount; i++) {
                spawnMonster(data.mHp, data.mAtk, data.mSpeed, false);
            }

            // 보스 스폰
            spawnMonster(data.bossHp, data.mAtk * 1.8, data.mSpeed * 0.8, true);
        }

        function spawnMonster(hp, atk, speed, isBoss) {
            const mGroup = new THREE.Group();
            const scaleSize = isBoss ? 4.5 : 2.0;

            loadGLBWithAutoGround('assets/hollow.glb', mGroup, (group) => {
                // Fallback 메쉬
                const color = isBoss ? 0xff0055 : (currentStage === 3 ? 0xdddddd : 0x4a148c);
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(0.8, isBoss ? 2.5 : 1.5, 0.8),
                    new THREE.MeshStandardMaterial({ color: color })
                );
                body.position.y = isBoss ? 1.25 : 0.75;
                group.add(body);

                // 가면
                const mask = new THREE.Mesh(
                    new THREE.SphereGeometry(0.4, 12, 12),
                    new THREE.MeshStandardMaterial({ color: 0xffffff })
                );
                mask.position.set(0, isBoss ? 2.4 : 1.4, 0.3);
                group.add(mask);
            }, scaleSize);

            let rx = (Math.random() - 0.5) * 120;
            let rz = (Math.random() - 0.5) * 120;
            if (Math.abs(rx) < 15) rx += 25;
            mGroup.position.set(rx, 0, rz);

            scene.add(mGroup);
            monsters.push({
                mesh: mGroup, hp: hp, maxHp: hp, atk: atk, speed: speed,
                isBoss: isBoss, lastAttack: 0
            });
        }

        function playerAttack() {
            if (player.attackCooldown || isGameOver) return;
            player.attackCooldown = true;

            spawnSlashArc(playerGroup.position, player.angle, 0, 0xff1493);
            executeHit(0, 1.0);

            setTimeout(() => {
                frontBeastMesh.scale.set(1.4, 1.4, 1.4);
                spawnSlashArc(playerGroup.position, player.angle, 2.2, 0x8a2be2);
                executeHit(2.2, 1.2);
            }, 90);

            setTimeout(() => {
                backBeastMesh.scale.set(1.5, 1.5, 1.5);
                spawnSlashArc(playerGroup.position, player.angle, -1.8, 0xffd700);
                executeHit(-1.8, 1.3);
            }, 180);

            setTimeout(() => {
                frontBeastMesh.scale.set(0.001, 0.001, 0.001);
                backBeastMesh.scale.set(0.001, 0.001, 0.001);
                player.attackCooldown = false;
            }, 340);
        }

        function useBeastSkill() {
            if (player.mp < 25 || player.attackCooldown || isGameOver) return;
            player.mp -= 25;
            player.attackCooldown = true;

            let spins = 0;
            const interval = setInterval(() => {
                playerGroup.rotation.y += Math.PI / 2;
                spawnParticles(playerGroup.position.x, 1.5, playerGroup.position.z, 0xff1493, 10);

                monsters.forEach(m => {
                    if (playerGroup.position.distanceTo(m.mesh.position) < 7.0) {
                        let dmg = Math.floor(player.atk * 0.9);
                        m.hp -= dmg;
                        showDamageText(dmg, m.mesh.position, '#ff69b4');
                    }
                });

                spins++;
                if (spins >= 8) {
                    clearInterval(interval);
                    player.attackCooldown = false;
                }
            }, 50);
            updateUI();
        }

        function useUltimate() {
            if (player.mp < 40 || player.attackCooldown || isGameOver) return;
            player.mp -= 40;
            player.attackCooldown = true;

            spawnParticles(playerGroup.position.x, 2, playerGroup.position.z, 0x8a2be2, 90);
            monsters.forEach(m => {
                if (playerGroup.position.distanceTo(m.mesh.position) < 14.0) {
                    let dmg = Math.floor(player.atk * 4.0);
                    m.hp -= dmg;
                    showDamageText(`💥${dmg}`, m.mesh.position, '#ba55d3');
                }
            });

            setTimeout(() => { player.attackCooldown = false; }, 400);
            updateUI();
        }

        function useDash() {
            if (player.mp < 10 || player.isDashing || isGameOver) return;
            player.mp -= 10;
            player.isDashing = true;
            playerGroup.position.x += Math.sin(player.angle) * 9.0;
            playerGroup.position.z += Math.cos(player.angle) * 9.0;
            setTimeout(() => { player.isDashing = false; }, 180);
            updateUI();
        }

        function executeHit(offsetZ, mult) {
            const hitPos = new THREE.Vector3(
                playerGroup.position.x + Math.sin(player.angle) * offsetZ,
                playerGroup.position.y + 1.0,
                playerGroup.position.z + Math.cos(player.angle) * offsetZ
            );

            monsters.forEach(m => {
                if (hitPos.distanceTo(m.mesh.position) < 5.0) {
                    let dmg = Math.floor(player.atk * mult + Math.random() * 10);
                    m.hp -= dmg;
                    showDamageText(m.isBoss ? `⚔️${dmg}` : dmg, m.mesh.position, m.isBoss ? '#ff0000' : '#ff1493');
                }
            });
        }

        function spawnSlashArc(pos, angle, offsetZ, colorHex) {
            const arcGeo = new THREE.RingGeometry(1.8, 3.2, 16, 1, 0, Math.PI);
            const arcMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
            const arcMesh = new THREE.Mesh(arcGeo, arcMat);
            arcMesh.rotation.x = Math.PI / 2;
            arcMesh.rotation.z = -angle + Math.PI / 2;
            arcMesh.position.set(pos.x + Math.sin(angle) * offsetZ, pos.y + 1.2, pos.z + Math.cos(angle) * offsetZ);

            scene.add(arcMesh);
            let opacity = 0.9;
            const fade = setInterval(() => {
                opacity -= 0.18;
                arcMesh.material.opacity = opacity;
                if (opacity <= 0) { clearInterval(fade); scene.remove(arcMesh); }
            }, 30);
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const maxRadius = 38;

            function handleTouch(e) {
                const touch = e.touches[0];
                const rect = zone.getBoundingClientRect();
                let dx = touch.clientX - (rect.left + rect.width / 2);
                let dy = touch.clientY - (rect.top + rect.height / 2);
                let dist = Math.hypot(dx, dy);

                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickInput.x = dx / maxRadius;
                joystickInput.z = dy / maxRadius;
                joystickInput.active = true;
            }

            zone.addEventListener('touchstart', handleTouch, { passive: false });
            zone.addEventListener('touchmove', (e) => { e.preventDefault(); handleTouch(e); }, { passive: false });
            zone.addEventListener('touchend', () => {
                knob.style.transform = `translate(0px, 0px)`;
                joystickInput = { x: 0, z: 0, active: false };
            });
        }

        function updateGame() {
            if (isGameOver) return;

            const speed = 0.32;
            if (joystickInput.active) {
                const moveX = joystickInput.x;
                const moveZ = joystickInput.z;
                const angle = Math.atan2(moveX, moveZ);

                player.angle = angle;
                playerGroup.rotation.y = angle;
                playerGroup.position.x += moveX * speed;
                playerGroup.position.z += moveZ * speed;

                player.mp = Math.min(player.maxMp, player.mp + 0.12);
                updateUI();
            }

            const now = Date.now();

            // 몬스터 AI & 피격 데미지 시스템
            for (let i = monsters.length - 1; i >= 0; i--) {
                const m = monsters[i];

                if (m.hp <= 0) {
                    spawnParticles(m.mesh.position.x, 1, m.mesh.position.z, 0xff0055, 25);
                    scene.remove(m.mesh);
                    monsters.splice(i, 1);

                    // 모든 적 전멸 시 다음 스테이지 진입
                    if (monsters.length === 0) {
                        if (currentStage < 3) {
                            loadStage(currentStage + 1);
                        } else {
                            showGameOver(true);
                        }
                    }
                    continue;
                }

                const dist = m.mesh.position.distanceTo(playerGroup.position);

                // 추격 AI
                if (dist > 1.8) {
                    m.mesh.position.x += ((playerGroup.position.x - m.mesh.position.x) / dist) * m.speed;
                    m.mesh.position.z += ((playerGroup.position.z - m.mesh.position.z) / dist) * m.speed;
                    m.mesh.lookAt(playerGroup.position);
                } else {
                    // 🔥 적이 플레이어를 공격!
                    if (now - m.lastAttack > 1200) {
                        m.lastAttack = now;
                        player.hp -= m.atk;
                        showDamageText(`-${m.atk}`, playerGroup.position, '#ff0000');
                        updateUI();

                        if (player.hp <= 0) {
                            showGameOver(false);
                        }
                    }
                }
            }

            camera.position.set(playerGroup.position.x, playerGroup.position.y + 17, playerGroup.position.z + 19);
            camera.lookAt(playerGroup.position);
        }

        function showGameOver(isWin) {
            isGameOver = true;
            const overlay = document.getElementById('msg-overlay');
            const title = document.getElementById('msg-title');
            const desc = document.getElementById('msg-desc');

            overlay.style.display = 'flex';
            if (isWin) {
                title.innerText = "VICTORY!";
                title.style.color = "#ff1493";
                desc.innerText = "야치루가 웨코문드의 모든 적을 제압했습니다!";
            } else {
                title.innerText = "GAME OVER";
                title.style.color = "#ff0000";
                desc.innerText = "야치루의 영압이 다했습니다...";
            }
        }

        function restartGame() {
            isGameOver = false;
            player.hp = player.maxHp;
            player.mp = player.maxMp;
            playerGroup.position.set(0, 0, 0);
            document.getElementById('msg-overlay').style.display = 'none';
            updateUI();
            loadStage(1);
        }

        function spawnParticles(x, y, z, colorHex, count = 12) {
            for (let i = 0; i < count; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.MeshBasicMaterial({ color: colorHex }));
                p.position.set(x, y, z);
                p.userData = { vx: (Math.random() - 0.5) * 0.4, vy: Math.random() * 0.4, vz: (Math.random() - 0.5) * 0.4, life: 1.0 };
                particleGroup.add(p);
            }
        }

        function showDamageText(dmg, pos, color = '#ff1493') {
            const el = document.createElement('div');
            el.className = 'dmg-float';
            el.innerText = `${dmg}`;
            el.style.color = color;

            const vector = pos.clone().project(camera);
            const x = (vector.x * .5 + .5) * window.innerWidth;
            const y = (-(vector.y * .5) + .5) * window.innerHeight;

            el.style.left = `${x}px`; el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }

        function updateUI() {
            document.getElementById('ui-hp-bar').style.width = `${Math.max(0, (player.hp / player.maxHp)) * 100}%`;
            document.getElementById('ui-mp-bar').style.width = `${Math.max(0, (player.mp / player.maxMp)) * 100}%`;
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();

            for (let i = particleGroup.children.length - 1; i >= 0; i--) {
                let p = particleGroup.children[i];
                p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
                p.userData.life -= 0.05; p.scale.setScalar(p.userData.life);
                if (p.userData.life <= 0) particleGroup.remove(p);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
