<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>블리치: 차원 레거시 Ultimate</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
        body { background: #000; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; }
        #game-container { position: relative; width: 100%; max-width: 480px; height: 100%; max-height: 860px; background: #000; overflow: hidden; display: flex; flex-direction: column; border: 2px solid #1a1a24; }
        
        #top-status-bar { width: 100%; height: 18%; background: rgba(5, 7, 12, 0.95); border-bottom: 2px solid #00e5ff44; padding: 8px 12px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 6px; z-index: 105; }
        .bar-group { display: flex; flex-direction: column; gap: 3px; justify-content: center; }
        .bar-row { display: flex; align-items: center; gap: 6px; }
        .bar-label { width: 45px; font-weight: bold; color: #88a0a8; font-size: 9px; }
        .bar-bg { flex: 1; height: 9px; background: #06090e; border: 1px solid #1e2d3d; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.2s ease-out; }
        #hp-fill { background: linear-gradient(90deg, #ff1744, #b20028); }
        #exp-fill { background: linear-gradient(90deg, #76ff03, #33691e); width: 0%; }
        #mp-fill { background: linear-gradient(90deg, #00e5ff, #007c91); width: 0%; }
        .bar-text { font-size: 8.5px; width: 55px; text-align: right; color: #a0b0b8; font-weight: bold; }
        
        .right-info { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; font-size: 10px; border-left: 1px solid #1e2d3d; padding-left: 8px; color: #eee; gap: 2px; }
        .char-tag { color: #00e5ff; font-weight: 900; font-size: 11px; }
        .lvl-tag { color: #76ff03; font-weight: 900; font-size: 11px; }

        #glb-btn-top { background: #ffd700; color: #000; font-weight: bold; border: none; font-size: 9px; padding: 4px 8px; border-radius: 3px; cursor: pointer; margin-top: 2px; }

        #quest-box { position: absolute; top: 19%; left: 10px; z-index: 140; background: rgba(5, 10, 20, 0.92); border: 1.5px solid #00e5ff; border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 10px; width: 240px; box-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        #quest-title { color: #ffd700; font-weight: bold; font-size: 11px; margin-bottom: 3px; }

        #zoom-controls { position: absolute; top: 19%; right: 10px; z-index: 140; display: flex; flex-direction: column; gap: 4px; }
        .zoom-btn { width: 28px; height: 28px; background: rgba(10, 15, 24, 0.8); border: 1px solid #00e5ff; color: #00e5ff; font-weight: bold; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; }

        #canvas3d-container { position: relative; width: 100%; height: 50%; background: #050811; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; display: block; }

        #combo-container { position: absolute; top: 28%; right: 15px; z-index: 145; color: #fff; font-weight: 900; font-size: 28px; text-align: right; opacity: 0; transform: scale(0.5); transition: 0.2s; }
        #combo-container.active { opacity: 1; transform: scale(1); }
        #combo-container span { font-size: 9px; color: #00e5ff; display: block; }

        .damage-popup { position: absolute; color: #fff; font-weight: 900; font-size: 18px; pointer-events: none; z-index: 150; transform: translate(-50%, -50%); animation: popupAnim 0.5s ease-out forwards; }
        .crit-popup { color: #00e5ff !important; font-size: 26px !important; text-shadow: 0 0 12px #00e5ff; }
        .bankai-popup { color: #ffd700 !important; font-size: 28px !important; text-shadow: 0 0 20px #ffaa00; }
        .freeze-popup { color: #88ffffff !important; font-size: 24px !important; text-shadow: 0 0 15px #00e5ff; }
        
        @keyframes popupAnim { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); } 30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -50%) translateY(-40px); } }

        #ui-panel { width: 100%; height: 32%; background: #040609; border-top: 1px solid #1e2d3d; padding: 6px; display: grid; grid-template-columns: 0.9fr 1.1fr 1.2fr; gap: 4px; z-index: 100; }
        #dpad-container { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 95px; height: 95px; margin: auto; gap: 2px; }
        .dpad-btn { background: #0a0f18; border: 1px solid #1e2d3d; border-radius: 4px; color: #708898; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .dpad-btn:active { background: #00e5ff; color: #000; }
        .dpad-empty { visibility: hidden; }

        #status-board { background: #020305; border: 1px solid #141f2c; border-radius: 5px; padding: 6px; color: #8090a0; font-size: 8.5px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
        .log-title { color: #00e5ff; font-weight: bold; border-bottom: 1px solid #141f2c; padding-bottom: 2px; }
        #log-content { flex: 1; font-size: 8px; overflow-y: auto; color: #607080; }

        #action-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 3px; }
        .action-btn { width: 100%; height: 100%; border: 1px solid #1e2d3d; border-radius: 4px; font-size: 9.5px; font-weight: bold; color: #a0b0c0; background: #0a0f18; cursor: pointer; }
        #btn-atk { background: linear-gradient(180deg, #141f2c, #0a0f18); color: #fff; grid-column: span 2; }
        #btn-z { background: linear-gradient(180deg, #0088cc, #004466); color: #fff; }
        #btn-x { background: linear-gradient(180deg, #00e5ff, #007c91); color: #000; }
        #btn-c { background: linear-gradient(180deg, #9933ff, #440088); color: #fff; }
        #btn-v { background: linear-gradient(180deg, #ffd700, #998000); color: #000; font-weight: 900; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="combo-container"><span id="combo-count">0</span><span>COMBO</span></div>

    <div id="top-status-bar">
        <div class="bar-group">
            <div class="bar-row"><span class="bar-label">HP</span><div class="bar-bg"><div id="hp-fill" class="bar-fill"></div></div><span id="hp-txt" class="bar-text">300 / 300</span></div>
            <div class="bar-row"><span class="bar-label">EXP</span><div class="bar-bg"><div id="exp-fill" class="bar-fill"></div></div><span id="exp-txt" class="bar-text">0 / 100</span></div>
            <div class="bar-row"><span class="bar-label">MP 영압</span><div class="bar-bg"><div id="mp-fill" class="bar-fill"></div></div><span id="mp-txt" class="bar-text">0 / 100</span></div>
        </div>
        <div class="right-info">
            <div class="lvl-tag" id="player-lvl">LV. 1</div>
            <div class="char-tag" id="chapter-tag">CH.1 소울소사이어티</div>
            <button id="glb-btn-top" onclick="triggerFileUpload()">📂 내 GLB 파일 불러오기</button>
        </div>
    </div>

    <div id="quest-box">
        <div id="quest-title">📜 퀘스트 [CH.1 토벌]</div>
        <span id="quest-desc">하급 호로 3마리 처치 (0/3)</span>
    </div>

    <div id="zoom-controls">
        <div class="zoom-btn" onclick="adjustZoom(-12)">+</div>
        <div class="zoom-btn" onclick="adjustZoom(12)">-</div>
    </div>

    <div id="canvas3d-container"></div>

    <div id="ui-panel">
        <div id="dpad-container">
            <div class="dpad-empty"></div><div class="dpad-btn" id="dpad-up">▲</div><div class="dpad-empty"></div>
            <div class="dpad-btn" id="dpad-left">◀</div><div class="dpad-empty"></div><div class="dpad-btn" id="dpad-right">▶</div>
            <div class="dpad-empty"></div><div class="dpad-btn" id="dpad-down">▼</div><div class="dpad-empty"></div>
        </div>
        
        <div id="status-board">
            <div class="log-title">📜 [차원 필드 기록]</div>
            <div id="log-content">애니 원작 고증 적 & 차원 이동 업데이트!</div>
        </div>

        <div id="action-grid">
            <button id="btn-atk" class="action-btn">⚔️ 기본 참격 [M1]</button>
            <button id="btn-z" class="action-btn">🐉 [Z] 거대 빙룡천상</button>
            <button id="btn-x" class="action-btn">🧊 [X] 대형 빙주 폭발</button>
            <button id="btn-c" class="action-btn">❄️ [C] 초거대 백화장</button>
            <button id="btn-v" class="action-btn">🌌 [V] 대홍련빙륜환 (빙결)</button>
        </div>
    </div>
</div>

<script>
let gameInstance = null;
const MAP_WIDTH = 250;
const MAP_LENGTH = 600;

const QUEST_LIST = [
    { ch: 1, title: "📜 [CH.1] 호로 습격 저지", targetType: 'HOLLOW', count: 3, desc: "하급 호로 3마리 처치" },
    { ch: 2, title: "📜 [CH.2] 아란칼 침공 차단", targetType: 'ARRANCAR', count: 3, desc: "아란칼 3마리 처치" },
    { ch: 3, title: "📜 [CH.3] 슈테른릿터 토벌", targetType: 'QUINCY_BOSS', count: 1, desc: "최종 보스 처치" }
];

function triggerFileUpload() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.glb,.gltf';
    input.onchange = (e) => {
        const file = e.target.files[0];
        if(file && gameInstance) {
            const url = URL.createObjectURL(file);
            gameInstance.player.loadCustomModel(url);
        }
    };
    input.click();
}

function adjustZoom(amount) {
    if(gameInstance) {
        gameInstance.cameraZoom = Math.max(40, Math.min(180, gameInstance.cameraZoom + amount));
    }
}

class Game {
    constructor() {
        this.container = document.getElementById('canvas3d-container');
        this.logBox = document.getElementById('log-content');
        
        this.mp = 0;
        this.currentQuestIdx = 0;
        this.questKillCount = 0;
        this.chapter = 1;
        this.cameraZoom = 90;
        this.comboCount = 0; this.comboTimer = null;
        this.clock = new THREE.Clock();

        this.initThree();
        this.initWorld();
        this.player = new Player(this);
        
        this.enemies = []; this.particles = []; this.fxObjects = [];
        this.spawnEnemies();
        
        this.keys = { up: false, down: false, left: false, right: false };
        this.initEvents(); this.updateUI();
    }

    initThree() {
        this.scene = new THREE.Scene(); 
        this.scene.background = new THREE.Color(0x060a14);
        this.scene.fog = new THREE.FogExp2(0x060a14, 0.002);
        
        this.camera = new THREE.PerspectiveCamera(45, this.container.clientWidth / this.container.clientHeight, 0.1, 2000);
        
        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.shadowMap.enabled = true;
        this.container.appendChild(this.renderer.domElement);
        
        this.mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
        this.mainLight.position.set(80, 150, 80);
        this.scene.add(this.mainLight);
        this.scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    }

    initWorld() {
        if(this.mapGroup) this.scene.remove(this.mapGroup);
        this.mapGroup = new THREE.Group();

        const floorGeo = new THREE.PlaneGeometry(MAP_WIDTH, MAP_LENGTH);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x141e2d, roughness: 0.6 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, -MAP_LENGTH/2 + 30);
        this.mapGroup.add(floor);

        const grid = new THREE.GridHelper(MAP_LENGTH, 60, 0x00e5ff, 0x112233);
        grid.position.set(0, 0.2, -MAP_LENGTH/2 + 30);
        this.mapGroup.add(grid);

        // 차원 이동 게이트 (포탈)
        const portalGeo = new THREE.TorusGeometry(18, 3.0, 16, 32);
        const portalMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true });
        this.portal = new THREE.Mesh(portalGeo, portalMat);
        this.portal.position.set(0, 20, -MAP_LENGTH + 60);
        this.mapGroup.add(this.portal);

        this.scene.add(this.mapGroup);
    }

    spawnEnemies() {
        this.enemies.forEach(e => this.scene.remove(e.mesh));
        this.enemies = [];

        const q = QUEST_LIST[this.currentQuestIdx];
        let count = q ? q.count : 3;

        for(let i=0; i<count; i++) {
            const mob = new AdvancedEnemy(this, q ? q.targetType : 'HOLLOW');
            mob.mesh.position.set((Math.random()-0.5)*(MAP_WIDTH-60), 0, -60 - (i*90));
            this.enemies.push(mob);
        }
    }

    addParticles(pos, color, count = 20, scaleMult = 5.0) {
        for(let i=0; i<count; i++) {
            const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9 });
            const p = new THREE.Mesh(new THREE.BoxGeometry(0.5 * scaleMult, 0.5 * scaleMult, 0.5 * scaleMult), mat);
            p.position.copy(pos);
            p.userData = { vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() * 0.8 + 0.3), vz: (Math.random() - 0.5) * 1.5, life: 1.0 };
            this.scene.add(p); this.particles.push(p);
        }
    }

    addFXObject(mesh, updateFn) {
        this.scene.add(mesh);
        this.fxObjects.push({ mesh: mesh, update: updateFn, life: 1.0 });
    }

    updateAndCleanFX() {
        for(let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
            p.userData.life -= 0.03; p.material.opacity = p.userData.life;
            if(p.userData.life <= 0) { this.scene.remove(p); this.particles.splice(i, 1); }
        }
        for(let i = this.fxObjects.length - 1; i >= 0; i--) {
            const fx = this.fxObjects[i]; fx.life -= 0.02;
            if (fx.update) fx.update(fx.mesh, fx.life);
            if(fx.life <= 0) { this.scene.remove(fx.mesh); this.fxObjects.splice(i, 1); }
        }

        if(this.portal) this.portal.rotation.z += 0.04;
    }

    applyCameraUpdate() {
        let targetX = this.player.mesh.position.x;
        let targetY = this.player.mesh.position.y + (this.cameraZoom * 0.7);
        let targetZ = this.player.mesh.position.z + this.cameraZoom;
        this.camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.15);
        this.camera.lookAt(this.player.mesh.position.x, this.player.mesh.position.y + 10, this.player.mesh.position.z);
    }

    addCombo() {
        this.comboCount++;
        const el = document.getElementById('combo-container');
        document.getElementById('combo-count').innerText = this.comboCount; el.classList.add('active');
        clearTimeout(this.comboTimer);
        this.comboTimer = setTimeout(() => { this.comboCount = 0; el.classList.remove('active'); }, 2000);
    }

    onEnemyKilled(type) {
        const q = QUEST_LIST[this.currentQuestIdx];
        if(q && q.targetType === type) {
            this.questKillCount++;
            if(this.questKillCount >= q.count) {
                this.log(`🎉 <b>[목표 처치 완료!]</b> 맵 끝의 🌌 차원 포탈로 이동하세요!`);
            }
            this.updateUI();
        }
    }

    // 🌌 맵 이동 감지 시스템
    checkPortalEntry() {
        if(this.portal && this.player.mesh.position.distanceTo(this.portal.position) < 25.0) {
            const q = QUEST_LIST[this.currentQuestIdx];
            if(q && this.questKillCount >= q.count) {
                this.currentQuestIdx++;
                this.chapter++;
                this.questKillCount = 0;
                
                this.player.mesh.position.set(0, 0, 0); // 플레이어 위치 초기화
                this.spawnEnemies();
                this.log(`🌌 <b>[차원 이동 성공!]</b> CH.${this.chapter} 영역에 진입했습니다.`);
                document.getElementById('chapter-tag').innerText = `CH.${this.chapter} 차원 필드`;
                this.updateUI();
            } else {
                this.log(`⚠️ 현재 퀘스트 처치 목표를 먼저 달성해야 차원을 넘아갈 수 있습니다!`);
                this.player.mesh.position.z += 10.0; // 살짝 튕겨냄
            }
        }
    }

    log(msg) { this.logBox.innerHTML = msg + "<br>" + this.logBox.innerHTML; }

    updateUI() {
        document.getElementById('hp-fill').style.width = (this.player.hp / this.player.maxHp * 100) + "%";
        document.getElementById('hp-txt').innerText = `${Math.round(this.player.hp)} / ${this.player.maxHp}`;
        document.getElementById('exp-fill').style.width = (this.player.exp / this.player.maxExp * 100) + "%";
        document.getElementById('exp-txt').innerText = `${this.player.exp} / ${this.player.maxExp}`;
        document.getElementById('mp-fill').style.width = this.mp + "%";
        document.getElementById('mp-txt').innerText = `${this.mp} / 100`;
        document.getElementById('player-lvl').innerText = `LV. ${this.player.level}`;

        const q = QUEST_LIST[this.currentQuestIdx];
        if(q) {
            document.getElementById('quest-title').innerText = q.title;
            document.getElementById('quest-desc').innerText = `${q.desc} (${this.questKillCount}/${q.count})`;
        } else {
            document.getElementById('quest-desc').innerText = `🏆 모든 차원 정복 완료!`;
        }
    }

    popText(pos, text, type = 'NORMAL') {
        const p = pos.clone().project(this.camera);
        const pop = document.createElement('div');
        pop.className = "damage-popup " + (type === 'CRIT' ? "crit-popup" : (type === 'BANKAI' ? "bankai-popup" : (type === 'FREEZE' ? "freeze-popup" : "")));
        pop.innerText = text; 
        pop.style.left = ((p.x * .5 + .5) * this.container.clientWidth) + "px"; 
        pop.style.top = ((-(p.y * .5) + .5) * this.container.clientHeight) + "px";
        this.container.appendChild(pop); setTimeout(() => pop.remove(), 650);
    }

    initEvents() {
        const setKey = (id, dir, val) => {
            const el = document.getElementById(id);
            el.addEventListener('mousedown', () => this.keys[dir] = val);
            el.addEventListener('mouseup', () => this.keys[dir] = !val);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys[dir] = val; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); this.keys[dir] = !val; });
        };
        setKey('dpad-up', 'up', true); setKey('dpad-down', 'down', true);
        setKey('dpad-left', 'left', true); setKey('dpad-right', 'right', true);
        
        this.container.addEventListener('wheel', (e) => { adjustZoom(e.deltaY > 0 ? 10 : -10); });

        document.getElementById('btn-atk').addEventListener('click', () => this.player.attack());
        document.getElementById('btn-z').addEventListener('click', () => this.player.skillZ());
        document.getElementById('btn-x').addEventListener('click', () => this.player.skillX());
        document.getElementById('btn-c').addEventListener('click', () => this.player.skillC());
        document.getElementById('btn-v').addEventListener('click', () => this.player.skillV());
    }
}

class Player {
    constructor(game) {
        this.game = game; this.level = 1; this.exp = 0; this.maxExp = 100;
        this.hp = 300; this.maxHp = 300; this.atk = 140; this.speed = 1.0;
        this.isBankai = false;
        
        this.mesh = new THREE.Group();
        this.game.scene.add(this.mesh);
        this.buildToshiroModel();
    }

    // 🛠️ GLB 바운딩 박스 정밀 계산으로 땅 땅 박힘 근본 해결
    loadCustomModel(url) {
        if(this.model) this.mesh.remove(this.model);
        const loader = new THREE.GLTFLoader();
        loader.load(url, (gltf) => {
            this.model = gltf.scene; 
            
            // 바운딩 박스 오프셋 정밀 보정
            const box = new THREE.Box3().setFromObject(this.model);
            const minY = box.min.y;
            this.model.position.y = -minY; // 땅 위로 완전히 올림!

            this.model.scale.set(18.0, 18.0, 18.0);
            this.mesh.add(this.model);
            this.game.log(`✨ GLB 모델 높이 정밀 보정 후 탑재 완료!`);
        }, undefined, () => this.buildToshiroModel());
    }

    buildToshiroModel() {
        const group = new THREE.Group();
        const head = new THREE.Mesh(new THREE.SphereGeometry(7.5), new THREE.MeshStandardMaterial({ color: 0xffdfc4 }));
        head.position.y = 26;
        const hair = new THREE.Mesh(new THREE.ConeGeometry(8.5, 10, 8), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        hair.position.set(0, 31, -0.5);
        const body = new THREE.Mesh(new THREE.CylinderGeometry(4, 6.5, 20), new THREE.MeshStandardMaterial({ color: 0x0a0a0f }));
        body.position.y = 10;
        
        group.add(head, hair, body);
        this.mesh.add(group);
        this.model = group;
    }

    addExp(amt) {
        this.exp += amt;
        if(this.exp >= this.maxExp) {
            this.level++; this.exp = 0; this.maxExp += 60;
            this.atk += 40; this.maxHp += 120; this.hp = this.maxHp;
            this.game.popText(this.mesh.position, `⭐ LEVEL UP! (LV.${this.level})`, 'BANKAI');
        }
        this.game.updateUI();
    }

    attack() {
        const frontPos = this.mesh.position.clone().add(new THREE.Vector3(0, 10, -22).applyQuaternion(this.mesh.quaternion));
        this.game.addParticles(frontPos, 0x00e5ff, 25, 6.0);
        
        let targets = this.game.enemies.filter(e => e.hp > 0 && this.mesh.position.distanceTo(e.mesh.position) < 35.0);
        if (targets.length > 0) this.game.addCombo();
        
        targets.forEach(e => {
            let dmg = this.atk * (this.isBankai ? 2.5 : 1.0);
            if(this.isBankai) {
                e.freeze(2.0);
                this.game.popText(e.mesh.position, `❄️ FREEZE! -${Math.round(dmg)}`, 'FREEZE');
            } else {
                this.game.popText(e.mesh.position, `⚔️ -${Math.round(dmg)}`, 'NORMAL');
            }
            e.takeDamage(dmg);
        });
        
        this.game.mp = Math.min(100, this.game.mp + 20);
        this.game.updateUI();
    }

    skillZ() {
        this.game.log(`🐉 <b>[Z] 거대 빙룡천상!</b>`);
        const dragon = new THREE.Mesh(new THREE.ConeGeometry(15, 45, 8), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.85, wireframe: true }));
        dragon.rotation.x = -Math.PI / 2;
        dragon.position.copy(this.mesh.position).add(new THREE.Vector3(0, 20, -25).applyQuaternion(this.mesh.quaternion));
        
        this.game.addFXObject(dragon, (m, life) => {
            m.position.add(new THREE.Vector3(0, 0, -4.5).applyQuaternion(this.mesh.quaternion));
            m.rotation.z += 0.35;
            this.game.addParticles(m.position, 0x00e5ff, 6, 8.0);
        });

        this.game.enemies.forEach(e => {
            if(e.hp > 0 && this.mesh.position.distanceTo(e.mesh.position) < 70.0) {
                if(this.isBankai) e.freeze(2.5);
                e.takeDamage(this.atk * 2.8);
                this.game.popText(e.mesh.position, `🐉 빙룡 -${Math.round(this.atk * 2.8)}`, 'CRIT');
            }
        });
        this.game.addCombo();
    }

    skillX() {
        this.game.log(`🧊 <b>[X] 대형 빙주 폭발!</b>`);
        for(let i=0; i<12; i++) {
            const pillar = new THREE.Mesh(new THREE.CylinderGeometry(3.0, 12.0, 60.0, 8), new THREE.MeshStandardMaterial({ color: 0xaaddff, transparent: true, opacity: 0.85 }));
            let offset = new THREE.Vector3((Math.random()-0.5)*60, 30, -30 - Math.random()*50).applyQuaternion(this.mesh.quaternion);
            pillar.position.copy(this.mesh.position).add(offset);
            
            this.game.addFXObject(pillar, (m, life) => {
                m.scale.y = life;
                this.game.addParticles(m.position, 0x00e5ff, 4, 8.0);
            });
        }

        this.game.enemies.forEach(e => {
            if(e.hp > 0 && this.mesh.position.distanceTo(e.mesh.position) < 60.0) {
                if(this.isBankai) e.freeze(2.5);
                e.takeDamage(this.atk * 3.2);
                this.game.popText(e.mesh.position, `💥 빙주 -${Math.round(this.atk * 3.2)}`, 'CRIT');
            }
        });
        this.game.addCombo();
    }

    skillC() {
        this.game.log(`❄️ <b>[C] 초거대 백화장!</b>`);
        const flower = new THREE.Mesh(new THREE.TorusGeometry(45.0, 4.0, 8, 32), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
        flower.rotation.x = Math.PI / 2;
        flower.position.copy(this.mesh.position).add(new THREE.Vector3(0, 2.0, -45.0).applyQuaternion(this.mesh.quaternion));

        this.game.addFXObject(flower, (m, life) => {
            m.scale.multiplyScalar(1.04);
            this.game.addParticles(m.position, 0xffffff, 15, 10.0);
        });

        this.game.enemies.forEach(e => {
            if(e.hp > 0 && this.mesh.position.distanceTo(e.mesh.position) < 80.0) {
                if(this.isBankai) e.freeze(3.0);
                e.takeDamage(this.atk * 4.5);
                this.game.popText(e.mesh.position, `❄️ 백화장 -${Math.round(this.atk * 4.5)}`, 'BANKAI');
            }
        });
        this.game.addCombo();
    }

    skillV() {
        if(this.game.mp < 100) return;
        this.game.mp = 0; this.isBankai = true;
        this.game.log(`🌌 <span style='color:#ffd700;font-weight:900;'>[V] 만해: "대홍련빙륜환" 개방 (공격 시 적 결빙)!</span>`);
        
        const wingL = new THREE.Mesh(new THREE.BoxGeometry(45.0, 3.0, 12.0), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.85 }));
        wingL.position.set(-22.0, 30.0, -5.0); wingL.rotation.z = 0.35;
        const wingR = wingL.clone(); wingR.position.x = 22.0; wingR.rotation.z = -0.35;
        
        this.mesh.add(wingL, wingR);
        this.game.popText(this.mesh.position, `❄️ 만해: 빙결 영역!`, 'BANKAI');

        setTimeout(() => {
            this.mesh.remove(wingL, wingR);
            this.isBankai = false;
            this.game.updateUI();
        }, 16000);
        this.game.updateUI();
    }

    move(delta) {
        let dx = 0, dz = 0;
        if (this.game.keys.up) dz = -1; if (this.game.keys.down) dz = 1;
        if (this.game.keys.left) dx = -1; if (this.game.keys.right) dx = 1;
        
        if (dx !== 0 || dz !== 0) {
            let mag = Math.sqrt(dx*dx + dz*dz);
            let nextX = this.mesh.position.x + (dx/mag) * this.speed;
            let nextZ = this.mesh.position.z + (dz/mag) * this.speed;
            
            if (Math.abs(nextX) < MAP_WIDTH / 2 - 10.0) this.mesh.position.x = nextX;
            if (nextZ > -MAP_LENGTH + 40 && nextZ < 30) this.mesh.position.z = nextZ;
            this.mesh.rotation.y = Math.atan2(dx, dz);
        }
    }
}

// 🎬 원작 100% 반영 고증 적 클래스
class AdvancedEnemy {
    constructor(game, type) {
        this.game = game; this.type = type;
        this.isBoss = (type === 'QUINCY_BOSS');
        this.hp = this.isBoss ? 2500 : (type === 'ARRANCAR' ? 800 : 500); 
        this.maxHp = this.hp;
        this.speed = this.isBoss ? 0.28 : 0.35;
        
        this.isFrozen = false;
        this.freezeTimer = null;
        
        this.mesh = new THREE.Group();
        this.buildEnemyModel();
        this.game.scene.add(this.mesh);
    }

    buildEnemyModel() {
        if(this.type === 'HOLLOW') {
            // ☠️ 하급 호로 (원작 흰색 가면 + 구멍)
            const head = new THREE.Mesh(new THREE.SphereGeometry(6), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            head.position.y = 12;
            const hole = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 4), new THREE.MeshBasicMaterial({ color: 0x000000 }));
            hole.rotation.x = Math.PI / 2; hole.position.set(0, 5, 0);
            const body = new THREE.Mesh(new THREE.CylinderGeometry(3, 5, 12), new THREE.MeshStandardMaterial({ color: 0x111115 }));
            body.position.y = 6;
            this.mesh.add(head, hole, body);
        } else if(this.type === 'ARRANCAR') {
            // ⚔️ 아란칼 (반쪽 가면 + 해방검)
            const head = new THREE.Mesh(new THREE.SphereGeometry(5), new THREE.MeshStandardMaterial({ color: 0xffdfc4 }));
            head.position.y = 12;
            const maskPart = new THREE.Mesh(new THREE.BoxGeometry(3, 5, 2), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            maskPart.position.set(2, 13, 2);
            const body = new THREE.Mesh(new THREE.CylinderGeometry(3, 4, 12), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            body.position.y = 6;
            const sword = new THREE.Mesh(new THREE.BoxGeometry(0.8, 14, 0.8), new THREE.MeshStandardMaterial({ color: 0x00e5ff }));
            sword.position.set(5, 7, 2);
            this.mesh.add(head, maskPart, body, sword);
        } else {
            // 👑 슈테른릿터 보스 (영자 대검 + 아우라)
            const body = new THREE.Mesh(new THREE.CylinderGeometry(6, 8, 22), new THREE.MeshStandardMaterial({ color: 0x001133 }));
            body.position.y = 11;
            const sword = new THREE.Mesh(new THREE.BoxGeometry(2, 28, 2), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
            sword.position.set(9, 14, 3);
            this.mesh.add(body, sword);
        }

        // 🧊 결빙 감옥 오브젝트
        const iceCube = new THREE.Mesh(
            new THREE.BoxGeometry(16, 28, 16),
            new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5, wireframe: true })
        );
        iceCube.position.y = 12;
        iceCube.name = "iceBlock";
        iceCube.visible = false;
        this.mesh.add(iceCube);
    }

    freeze(duration) {
        this.isFrozen = true;
        const ice = this.mesh.getObjectByName("iceBlock");
        if(ice) ice.visible = true;

        clearTimeout(this.freezeTimer);
        this.freezeTimer = setTimeout(() => {
            this.isFrozen = false;
            if(ice) ice.visible = false;
        }, duration * 1000);
    }

    takeDamage(amt) {
        this.hp = Math.max(0, this.hp - amt);
        if(this.hp <= 0) {
            this.game.addParticles(this.mesh.position, 0xff1744, 30, 8.0);
            this.mesh.position.y = -300;
            this.game.player.addExp(this.isBoss ? 300 : 70);
            this.game.onEnemyKilled(this.type);
        }
    }

    update() {
        if(this.hp <= 0 || this.isFrozen) return;
        
        const pPos = this.game.player.mesh.position;
        const dist = this.mesh.position.distanceTo(pPos);

        if (dist < 90.0) {
            let dir = new THREE.Vector3().subVectors(pPos, this.mesh.position).normalize();
            this.mesh.position.addScaledVector(dir, this.speed);
            this.mesh.rotation.y = Math.atan2(dir.x, dir.z);

            if(dist < (this.isBoss ? 18.0 : 10.0)) {
                this.game.player.hp = Math.max(0, this.game.player.hp - (this.isBoss ? 0.4 : 0.18));
                this.game.updateUI();
            }
        }
    }
}

window.onload = () => {
    gameInstance = new Game();
    function animate() {
        requestAnimationFrame(animate);
        if (gameInstance) {
            const delta = gameInstance.clock.getDelta();
            gameInstance.player.move(delta); 
            gameInstance.enemies.forEach(e => e.update()); 
            gameInstance.updateAndCleanFX();
            gameInstance.checkPortalEntry();
            gameInstance.applyCameraUpdate(); 
            gameInstance.renderer.render(gameInstance.scene, gameInstance.camera);
        }
    }
    animate();
};
