<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>블리치: 삼포검수 - 풀 액션 RPG</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050508; color: #fff; }
        #webgl-container { width: 100%; height: 100%; display: block; }

        /* Top Header UI */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
        .top-hud { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; gap: 10px; }

        /* Player Profile Card */
        .player-card { background: rgba(12, 10, 24, 0.88); border: 2px solid #ff1493; border-left: 5px solid #ff1493; padding: 10px 14px; border-radius: 8px; width: 220px; pointer-events: auto; box-shadow: 0 0 15px rgba(255, 20, 147, 0.3); }
        .player-card h2 { font-size: 0.95rem; color: #ff69b4; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .bar-bg { width: 100%; height: 9px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
        .bar-hp { height: 100%; background: linear-gradient(90deg, #e6005c, #ff1493); width: 100%; transition: width 0.15s; }
        .bar-mp { height: 100%; background: linear-gradient(90deg, #7b1fa2, #ba55d3); width: 100%; transition: width 0.15s; }
        .bar-exp { height: 100%; background: linear-gradient(90deg, #00bfff, #1e90ff); width: 0%; transition: width 0.15s; }
        .stat-text { font-size: 0.75rem; color: #ffd700; font-weight: bold; margin-top: 2px; }

        /* Boss Health Bar */
        #boss-bar-container { display: none; flex-direction: column; align-items: center; width: 50%; max-width: 400px; background: rgba(0,0,0,0.8); border: 2px solid #ff0000; padding: 6px 12px; border-radius: 8px; }
        #boss-name { color: #ff3333; font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; letter-spacing: 1px; }
        .bar-boss { height: 12px; background: linear-gradient(90deg, #990000, #ff0000); width: 100%; transition: width 0.15s; }

        /* Menu Buttons (GLB Upload & Shop) */
        .menu-btns { display: flex; gap: 8px; pointer-events: auto; }
        .btn-menu { background: rgba(20, 20, 35, 0.9); border: 1px solid #ff69b4; color: #fff; padding: 8px 12px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer; backdrop-filter: blur(4px); }
        .btn-menu:active { background: #ff1493; }

        /* Shop & Stat Upgrade Modal */
        #shop-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 12, 0.9); display: none; justify-content: center; align-items: center; z-index: 100; pointer-events: auto; }
        .shop-box { background: #12101f; border: 2px solid #ff1493; padding: 20px; border-radius: 12px; width: 90%; max-width: 420px; box-shadow: 0 0 25px rgba(255, 20, 147, 0.4); }
        .shop-box h3 { color: #ff69b4; text-align: center; margin-bottom: 15px; font-size: 1.3rem; border-bottom: 1px solid rgba(255,105,180,0.3); padding-bottom: 8px; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 6px; }
        .shop-item span { font-size: 0.85rem; color: #ddd; }
        .btn-buy { background: #8a2be2; border: none; color: #fff; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-buy:active { background: #ff1493; }
        .btn-close-shop { width: 100%; margin-top: 10px; background: #333; border: 1px solid #666; color: #fff; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* Bottom Controls */
        .bottom-hud { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; pointer-events: auto; }
        #joystick-zone { width: 120px; height: 120px; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 105, 180, 0.5); border-radius: 50%; position: relative; touch-action: none; }
        #joystick-knob { width: 44px; height: 44px; background: radial-gradient(circle, #ff1493, #7b1fa2); border: 2px solid #fff; border-radius: 50%; position: absolute; top: 38px; left: 38px; }

        .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .btn-act { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #ff69b4; background: rgba(15, 10, 25, 0.9); color: #ff69b4; font-weight: bold; font-size: 0.7rem; display: flex; flex-direction: column; justify-content: center; align-items: center; touch-action: manipulation; }
        .btn-act:active { transform: scale(0.92); background: #ff1493; color: #fff; }
        .btn-act.main-atk { width: 66px; height: 66px; background: linear-gradient(135deg, #ff1493, #8a2be2); color: #fff; border: 2px solid #fff; grid-column: span 3; justify-self: center; font-size: 0.85rem; }

        /* Floating Damage Text */
        .dmg-float { position: absolute; font-weight: 900; font-size: 1.5rem; pointer-events: none; animation: floatUp 0.6s forwards; text-shadow: 0 0 8px #000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1.2); } 100% { opacity: 0; transform: translateY(-35px) scale(0.8); } }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <input type="file" id="glb-file-input" accept=".glb,.gltf" style="display:none;" onchange="handleGLBUpload(event)">

    <div id="hud">
        <div class="top-hud">
            <div class="player-card">
                <h2><span>🌸 야치루</span><span id="ui-level">Lv.1</span></h2>
                <div class="bar-bg"><div class="bar-hp" id="ui-hp-bar"></div></div>
                <div class="bar-bg"><div class="bar-mp" id="ui-mp-bar"></div></div>
                <div class="bar-bg"><div class="bar-exp" id="ui-exp-bar"></div></div>
                <div class="stat-text">💎 영자: <span id="ui-gold">0</span> | 🧪 포션: <span id="ui-potion">2</span>개</div>
            </div>

            <div id="boss-bar-container">
                <div id="boss-name">☠️ 메노스 그란데 (BOSS)</div>
                <div class="bar-bg"><div class="bar-boss" id="ui-boss-hp"></div></div>
            </div>

            <div class="menu-btns">
                <button class="btn-menu" onclick="document.getElementById('glb-file-input').click()">📁 GLB 로드</button>
                <button class="btn-menu" onclick="toggleShop(true)">🛒 상점/강화</button>
            </div>
        </div>

        <div class="bottom-hud">
            <div id="joystick-zone"><div id="joystick-knob"></div></div>
            <div class="action-grid">
                <button class="btn-act" onclick="usePotion()">🧪<br>포션</button>
                <button class="btn-act" onclick="useDash()">⚡<br>순보</button>
                <button class="btn-act" onclick="useUltimate()">🌀<br>영압</button>
                <button class="btn-act main-atk" onclick="playerAttack()">⚔️<br>삼포참격</button>
            </div>
        </div>
    </div>

    <div id="shop-modal">
        <div class="shop-box">
            <h3>⚔️ 영압 강화 & 상점</h3>
            <div class="shop-item">
                <span>⚔️ 공격력 (+15) <br><small id="info-atk">현재: 70</small></span>
                <button class="btn-buy" onclick="buyUpgrade('atk')">50 영자</button>
            </div>
            <div class="shop-item">
                <span>❤️ 최대 체력 (+50) <br><small id="info-hp">현재: 250</small></span>
                <button class="btn-buy" onclick="buyUpgrade('hp')">60 영자</button>
            </div>
            <div class="shop-item">
                <span>⚡ 이동 속도 (+10%) <br><small id="info-spd">현재: 100%</small></span>
                <button class="btn-buy" onclick="buyUpgrade('spd')">80 영자</button>
            </div>
            <div class="shop-item">
                <span>🧪 영압 회복 포션 (+1)</span>
                <button class="btn-buy" onclick="buyUpgrade('potion')">30 영자</button>
            </div>
            <button class="btn-close-shop" onclick="toggleShop(false)">닫기</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, gltfLoader;
        let playerGroup, customGLBMesh, frontBeastMesh, backBeastMesh, particleGroup;
        let monsters = [];

        let joystickInput = { x: 0, z: 0, active: false };
        let activeBoss = null;

        // Player Stats
        let player = {
            level: 1, exp: 0, maxExp: 100, gold: 0, potions: 2,
            hp: 250, maxHp: 250, mp: 100, maxMp: 100,
            atk: 70, speed: 0.32, angle: 0,
            attackCooldown: false, isDashing: false
        };

        function init() {
            const container = document.getElementById('webgl-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x06060c);
            scene.fog = new THREE.FogExp2(0x06060c, 0.012);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            gltfLoader = new THREE.GLTFLoader();

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.75));
            const dirLight = new THREE.DirectionalLight(0xfff0f5, 1.6);
            dirLight.position.set(30, 60, 30);
            dirLight.castShadow = true;
            scene.add(dirLight);

            particleGroup = new THREE.Group();
            scene.add(particleGroup);

            createSeireiteiMap();
            createYachiruCharacter();
            spawnMonsterWave();
            setupJoystick();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // 🏯 Map Creation
        function createSeireiteiMap() {
            const floorGeo = new THREE.PlaneGeometry(240, 240);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
        }

        // 🌸 Character Creation
        function createYachiruCharacter() {
            playerGroup = new THREE.Group();

            // Default Mesh
            const defaultMesh = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1.4, 16), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            body.position.y = 0.7;
            defaultMesh.add(body);
            const hair = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), new THREE.MeshStandardMaterial({ color: 0xff1493 }));
            hair.position.y = 1.5;
            defaultMesh.add(hair);

            playerGroup.add(defaultMesh);

            // Triple-Blade Beasts (삼포검수 야수)
            frontBeastMesh = new THREE.Group();
            const fMesh = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.2, 8), new THREE.MeshStandardMaterial({ color: 0x8a2be2 }));
            fMesh.rotation.x = -Math.PI / 2; fMesh.position.y = 0.8;
            frontBeastMesh.add(fMesh);
            frontBeastMesh.position.set(0, 0, 1.8);
            frontBeastMesh.scale.set(0.001, 0.001, 0.001);
            playerGroup.add(frontBeastMesh);

            backBeastMesh = new THREE.Group();
            const bMesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.7), new THREE.MeshStandardMaterial({ color: 0xffd700 }));
            bMesh.position.y = 0.8;
            backBeastMesh.add(bMesh);
            backBeastMesh.position.set(0, 0, -1.8);
            backBeastMesh.scale.set(0.001, 0.001, 0.001);
            playerGroup.add(backBeastMesh);

            scene.add(playerGroup);
        }

        // 📁 User GLB Upload Loader Function
        function handleGLBUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            gltfLoader.load(url, (gltf) => {
                const model = gltf.scene;

                // Auto Scale & Pivot Alignment
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 2.2 / (maxDim || 1);
                model.scale.set(scale, scale, scale);

                const adjustedBox = new THREE.Box3().setFromObject(model);
                model.position.y = -adjustedBox.min.y;

                model.traverse(child => { if (child.isMesh) child.castShadow = true; });

                // Remove existing visual meshes except beasts
                playerGroup.children.forEach(child => {
                    if (child !== frontBeastMesh && child !== backBeastMesh) {
                        playerGroup.remove(child);
                    }
                });

                playerGroup.add(model);
                spawnParticles(playerGroup.position.x, 1, playerGroup.position.z, 0x00bfff, 40);
                alert("🎉 GLB 3D 모델을 성공적으로 적용했습니다!");
            }, undefined, (err) => {
                alert("⚠️ GLB 파일을 로드하지 못했습니다.");
            });
        }

        // 👹 Monster Wave & Boss Spawn
        function spawnMonsterWave() {
            for (let i = 0; i < 6; i++) spawnMonster(false);
            spawnMonster(true); // Boss
        }

        function spawnMonster(isBoss) {
            const mGroup = new THREE.Group();
            const scaleSize = isBoss ? 4.5 : 1.8;

            const body = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, isBoss ? 2.5 : 1.4, 0.8),
                new THREE.MeshStandardMaterial({ color: isBoss ? 0xff0033 : 0x4a148c })
            );
            body.position.y = isBoss ? 1.25 : 0.7;
            mGroup.add(body);

            const mask = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            mask.position.set(0, isBoss ? 2.4 : 1.3, 0.3);
            mGroup.add(mask);

            let rx = (Math.random() - 0.5) * 110;
            let rz = (Math.random() - 0.5) * 110;
            if (Math.abs(rx) < 15) rx += 25;
            mGroup.position.set(rx, 0, rz);

            scene.add(mGroup);
            const mData = {
                mesh: mGroup, hp: isBoss ? 1500 : 200, maxHp: isBoss ? 1500 : 200,
                atk: isBoss ? 35 : 12, speed: isBoss ? 0.08 : 0.1, isBoss: isBoss, lastAttack: 0
            };

            monsters.push(mData);
            if (isBoss) {
                activeBoss = mData;
                document.getElementById('boss-bar-container').style.display = 'flex';
                updateBossUI();
            }
        }

        // ⚔️ Attack Actions
        function playerAttack() {
            if (player.attackCooldown) return;
            player.attackCooldown = true;

            spawnSlashArc(playerGroup.position, player.angle, 0, 0xff1493);
            executeHit(0, 1.0);

            setTimeout(() => {
                frontBeastMesh.scale.set(1.4, 1.4, 1.4);
                spawnSlashArc(playerGroup.position, player.angle, 2.2, 0x8a2be2);
                executeHit(2.2, 1.2);
            }, 90);

            setTimeout(() => {
                backBeastMesh.scale.set(1.5, 1.5, 1.5);
                spawnSlashArc(playerGroup.position, player.angle, -1.8, 0xffd700);
                executeHit(-1.8, 1.3);
            }, 180);

            setTimeout(() => {
                frontBeastMesh.scale.set(0.001, 0.001, 0.001);
                backBeastMesh.scale.set(0.001, 0.001, 0.001);
                player.attackCooldown = false;
            }, 340);
        }

        function useUltimate() {
            if (player.mp < 40 || player.attackCooldown) return;
            player.mp -= 40;
            player.attackCooldown = true;

            spawnParticles(playerGroup.position.x, 2, playerGroup.position.z, 0x8a2be2, 80);
            monsters.forEach(m => {
                if (playerGroup.position.distanceTo(m.mesh.position) < 14.0) {
                    let dmg = Math.floor(player.atk * 4.2);
                    m.hp -= dmg;
                    showDamageText(`💥${dmg}`, m.mesh.position, '#ba55d3');
                }
            });

            setTimeout(() => { player.attackCooldown = false; }, 400);
            updateUI();
        }

        function useDash() {
            if (player.mp < 10 || player.isDashing) return;
            player.mp -= 10;
            player.isDashing = true;
            playerGroup.position.x += Math.sin(player.angle) * 8.5;
            playerGroup.position.z += Math.cos(player.angle) * 8.5;
            setTimeout(() => { player.isDashing = false; }, 180);
            updateUI();
        }

        function usePotion() {
            if (player.potions <= 0) return alert("포션이 부족합니다! 상점에서 구매하세요.");
            player.potions--;
            player.hp = Math.min(player.maxHp, player.hp + 120);
            spawnParticles(playerGroup.position.x, 1, playerGroup.position.z, 0x00ff00, 30);
            updateUI();
        }

        function executeHit(offsetZ, mult) {
            const hitPos = new THREE.Vector3(
                playerGroup.position.x + Math.sin(player.angle) * offsetZ,
                playerGroup.position.y + 1.0,
                playerGroup.position.z + Math.cos(player.angle) * offsetZ
            );

            monsters.forEach(m => {
                if (hitPos.distanceTo(m.mesh.position) < 5.0) {
                    let dmg = Math.floor(player.atk * mult + Math.random() * 10);
                    m.hp -= dmg;
                    showDamageText(dmg, m.mesh.position, m.isBoss ? '#ff0000' : '#ff1493');
                    if (m.isBoss) updateBossUI();
                }
            });
        }

        function spawnSlashArc(pos, angle, offsetZ, colorHex) {
            const arcGeo = new THREE.RingGeometry(1.8, 3.2, 16, 1, 0, Math.PI);
            const arcMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
            const arcMesh = new THREE.Mesh(arcGeo, arcMat);
            arcMesh.rotation.x = Math.PI / 2;
            arcMesh.rotation.z = -angle + Math.PI / 2;
            arcMesh.position.set(pos.x + Math.sin(angle) * offsetZ, pos.y + 1.2, pos.z + Math.cos(angle) * offsetZ);

            scene.add(arcMesh);
            let opacity = 0.9;
            const fade = setInterval(() => {
                opacity -= 0.18;
                arcMesh.material.opacity = opacity;
                if (opacity <= 0) { clearInterval(fade); scene.remove(arcMesh); }
            }, 30);
        }

        // 🛒 Shop & Upgrades
        function toggleShop(show) {
            document.getElementById('shop-modal').style.display = show ? 'flex' : 'none';
        }

        function buyUpgrade(type) {
            if (type === 'atk' && player.gold >= 50) {
                player.gold -= 50; player.atk += 15;
            } else if (type === 'hp' && player.gold >= 60) {
                player.gold -= 60; player.maxHp += 50; player.hp += 50;
            } else if (type === 'spd' && player.gold >= 80) {
                player.gold -= 80; player.speed += 0.04;
            } else if (type === 'potion' && player.gold >= 30) {
                player.gold -= 30; player.potions++;
            } else {
                return alert("영자가 부족합니다!");
            }
            updateUI();
        }

        function addExpAndGold(expGained, goldGained) {
            player.gold += goldGained;
            player.exp += expGained;

            if (player.exp >= player.maxExp) {
                player.level++;
                player.exp -= player.maxExp;
                player.maxExp = Math.floor(player.maxExp * 1.4);
                player.hp = player.maxHp;
                player.mp = player.maxMp;
                player.atk += 10;
                spawnParticles(playerGroup.position.x, 2, playerGroup.position.z, 0xffd700, 50);
                showDamageText("LEVEL UP!", playerGroup.position, "#ffd700");
            }
            updateUI();
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const maxRadius = 38;

            function handleTouch(e) {
                const touch = e.touches[0];
                const rect = zone.getBoundingClientRect();
                let dx = touch.clientX - (rect.left + rect.width / 2);
                let dy = touch.clientY - (rect.top + rect.height / 2);
                let dist = Math.hypot(dx, dy);

                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickInput.x = dx / maxRadius;
                joystickInput.z = dy / maxRadius;
                joystickInput.active = true;
            }

            zone.addEventListener('touchstart', handleTouch, { passive: false });
            zone.addEventListener('touchmove', (e) => { e.preventDefault(); handleTouch(e); }, { passive: false });
            zone.addEventListener('touchend', () => {
                knob.style.transform = `translate(0px, 0px)`;
                joystickInput = { x: 0, z: 0, active: false };
            });
        }

        function updateGame() {
            if (joystickInput.active) {
                const moveX = joystickInput.x;
                const moveZ = joystickInput.z;
                const angle = Math.atan2(moveX, moveZ);

                player.angle = angle;
                playerGroup.rotation.y = angle;
                playerGroup.position.x += moveX * player.speed;
                playerGroup.position.z += moveZ * player.speed;

                player.mp = Math.min(player.maxMp, player.mp + 0.12);
                updateUI();
            }

            const now = Date.now();

            // Monster Loop & Combat Logic
            for (let i = monsters.length - 1; i >= 0; i--) {
                const m = monsters[i];

                if (m.hp <= 0) {
                    spawnParticles(m.mesh.position.x, 1, m.mesh.position.z, 0xff0055, 30);
                    scene.remove(m.mesh);
                    monsters.splice(i, 1);

                    if (m.isBoss) {
                        activeBoss = null;
                        document.getElementById('boss-bar-container').style.display = 'none';
                        addExpAndGold(250, 200);
                        setTimeout(() => spawnMonsterWave(), 3000); // Reset Wave
                    } else {
                        addExpAndGold(40, 25);
                    }
                    continue;
                }

                const dist = m.mesh.position.distanceTo(playerGroup.position);
                if (dist > 1.8) {
                    m.mesh.position.x += ((playerGroup.position.x - m.mesh.position.x) / dist) * m.speed;
                    m.mesh.position.z += ((playerGroup.position.z - m.mesh.position.z) / dist) * m.speed;
                    m.mesh.lookAt(playerGroup.position);
                } else {
                    if (now - m.lastAttack > 1200) {
                        m.lastAttack = now;
                        player.hp = Math.max(0, player.hp - m.atk);
                        showDamageText(`-${m.atk}`, playerGroup.position, '#ff0000');
                        updateUI();
                    }
                }
            }

            camera.position.set(playerGroup.position.x, playerGroup.position.y + 17, playerGroup.position.z + 19);
            camera.lookAt(playerGroup.position);
        }

        function spawnParticles(x, y, z, colorHex, count = 12) {
            for (let i = 0; i < count; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.MeshBasicMaterial({ color: colorHex }));
                p.position.set(x, y, z);
                p.userData = { vx: (Math.random() - 0.5) * 0.4, vy: Math.random() * 0.4, vz: (Math.random() - 0.5) * 0.4, life: 1.0 };
                particleGroup.add(p);
            }
        }

        function showDamageText(dmg, pos, color = '#ff1493') {
            const el = document.createElement('div');
            el.className = 'dmg-float';
            el.innerText = `${dmg}`;
            el.style.color = color;

            const vector = pos.clone().project(camera);
            const x = (vector.x * .5 + .5) * window.innerWidth;
            const y = (-(vector.y * .5) + .5) * window.innerHeight;

            el.style.left = `${x}px`; el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }

        function updateUI() {
            document.getElementById('ui-level').innerText = `Lv.${player.level}`;
            document.getElementById('ui-hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
            document.getElementById('ui-mp-bar').style.width = `${(player.mp / player.maxMp) * 100}%`;
            document.getElementById('ui-exp-bar').style.width = `${(player.exp / player.maxExp) * 100}%`;
            document.getElementById('ui-gold').innerText = player.gold;
            document.getElementById('ui-potion').innerText = player.potions;

            document.getElementById('info-atk').innerText = `현재: ${player.atk}`;
            document.getElementById('info-hp').innerText = `현재: ${player.maxHp}`;
            document.getElementById('info-spd').innerText = `현재: ${Math.round((player.speed / 0.32) * 100)}%`;
        }

        function updateBossUI() {
            if (activeBoss) {
                document.getElementById('ui-boss-hp').style.width = `${Math.max(0, (activeBoss.hp / activeBoss.maxHp)) * 100}%`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();

            for (let i = particleGroup.children.length - 1; i >= 0; i--) {
                let p = particleGroup.children[i];
                p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
                p.userData.life -= 0.05; p.scale.setScalar(p.userData.life);
                if (p.userData.life <= 0) particleGroup.remove(p);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
