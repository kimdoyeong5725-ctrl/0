<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>블리치: 보스 대전 Legacy</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
        body { background: #000; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; }
        #game-container { position: relative; width: 100%; max-width: 480px; height: 100%; max-height: 860px; background: #000; overflow: hidden; display: flex; flex-direction: column; border: 2px solid #1a1a24; box-shadow: 0 0 60px rgba(0, 229, 255, 0.2); }
        
        #top-status-bar { width: 100%; height: 20%; background: rgba(5, 7, 12, 0.95); border-bottom: 2px solid #00e5ff33; padding: 10px 14px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px; z-index: 105; }
        .bar-group { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
        .bar-row { display: flex; align-items: center; gap: 6px; }
        .bar-label { width: 55px; font-weight: bold; color: #88a0a8; font-size: 10px; }
        .bar-bg { flex: 1; height: 12px; background: #06090e; border: 1px solid #1e2d3d; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.2s ease-out; }
        #hp-fill { background: linear-gradient(90deg, #ff1744, #b20028); }
        #exp-fill { background: linear-gradient(90deg, #76ff03, #33691e); width: 0%; }
        #mp-fill { background: linear-gradient(90deg, #00e5ff, #007c91); width: 0%; }
        .bar-text { font-size: 9px; width: 50px; text-align: right; color: #a0b0b8; font-weight: bold; }
        
        .right-info { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; font-size: 11px; border-left: 1px solid #1e2d3d; padding-left: 10px; color: #eee; gap: 3px; }
        .char-tag { color: #00e5ff; font-weight: 900; font-size: 13px; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        .lvl-tag { color: #76ff03; font-weight: 900; font-size: 11px; }

        #quest-box { position: absolute; top: 21%; left: 10px; z-index: 140; background: rgba(5, 10, 20, 0.9); border: 1px solid #00e5ff; border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 10px; width: 230px; box-shadow: 0 0 15px rgba(0,229,255,0.2); }
        #quest-title { color: #ffd700; font-weight: bold; font-size: 11px; margin-bottom: 3px; }

        #canvas3d-container { position: relative; width: 100%; height: 48%; background: #050811; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; display: block; }

        #glb-upload-btn-panel { position: absolute; top: 21%; right: 10px; z-index: 140; }
        #glb-btn { background: #ffd700; color: #000; font-weight: bold; border: none; font-size: 9px; padding: 4px 8px; border-radius: 3px; cursor: pointer; }

        #combo-container { position: absolute; top: 12%; right: 15px; z-index: 145; color: #fff; font-weight: 900; font-size: 32px; text-align: right; opacity: 0; transform: scale(0.5); transition: 0.2s; }
        #combo-container.active { opacity: 1; transform: scale(1); }
        #combo-container span { font-size: 10px; color: #00e5ff; display: block; }

        .damage-popup { position: absolute; color: #fff; font-weight: 900; font-size: 16px; pointer-events: none; z-index: 150; transform: translate(-50%, -50%); animation: popupAnim 0.5s ease-out forwards; }
        .crit-popup { color: #00e5ff !important; font-size: 24px !important; text-shadow: 0 0 12px #00e5ff; }
        .enemy-skill-popup { color: #ff1744 !important; font-size: 20px !important; text-shadow: 0 0 10px #ff0000; }
        .bankai-popup { color: #ffd700 !important; font-size: 26px !important; text-shadow: 0 0 15px #ffaa00; }
        
        @keyframes popupAnim { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); } 30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -50%) translateY(-40px); } }

        #ui-panel { width: 100%; height: 32%; background: #040609; border-top: 1px solid #1e2d3d; padding: 8px; display: grid; grid-template-columns: 0.9fr 1.1fr 1.2fr; gap: 6px; z-index: 100; }
        #dpad-container { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 100px; height: 100px; margin: auto; gap: 2px; }
        .dpad-btn { background: #0a0f18; border: 1px solid #1e2d3d; border-radius: 4px; color: #708898; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .dpad-btn:active { background: #00e5ff; color: #000; }
        .dpad-empty { visibility: hidden; }

        #status-board { background: #020305; border: 1px solid #141f2c; border-radius: 6px; padding: 8px; color: #8090a0; font-size: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .log-title { color: #00e5ff; font-weight: bold; border-bottom: 1px solid #141f2c; padding-bottom: 4px; }
        #log-content { flex: 1; font-size: 9px; overflow-y: auto; color: #607080; }

        #action-grid { display: grid; grid-template-columns: 1fr; grid-template-rows: repeat(4, 1fr); gap: 4px; }
        .action-btn { width: 100%; height: 100%; border: 1px solid #1e2d3d; border-radius: 5px; font-size: 10px; font-weight: bold; color: #a0b0c0; background: #0a0f18; cursor: pointer; }
        #btn-atk { background: linear-gradient(180deg, #141f2c, #0a0f18); color: #fff; }
        #btn-skl { background: linear-gradient(180deg, #00e5ff, #007c91); color: #000; font-weight: 900; }
        #btn-heal { color: #80c090; }
        #btn-ban { background: linear-gradient(180deg, #ffd700, #998000); color: #000; font-weight: 900; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="combo-container"><span id="combo-count">0</span><span>COMBO</span></div>

    <div id="top-status-bar">
        <div class="bar-group">
            <div class="bar-row">
                <span class="bar-label">HP 생명력</span>
                <div class="bar-bg"><div id="hp-fill" class="bar-fill"></div></div>
                <span id="hp-txt" class="bar-text">300 / 300</span>
            </div>
            <div class="bar-row">
                <span class="bar-label">MP 영압</span>
                <div class="bar-bg"><div id="mp-fill" class="bar-fill"></div></div>
                <span id="mp-txt" class="bar-text">0 / 100</span>
            </div>
        </div>
        <div class="right-info">
            <div class="lvl-tag" id="player-lvl">LV. 1</div>
            <div class="char-tag" id="player-char-name">히츠가야 토시로</div>
        </div>
    </div>

    <div id="quest-box">
        <div id="quest-title">📜 퀘스트 [CH.1 현세]</div>
        <span id="quest-desc">거대 호로 처치 (0/1)</span>
    </div>

    <div id="glb-upload-btn-panel">
        <button id="glb-btn" onclick="triggerFileUpload()">📂 내 GLB 불러오기</button>
    </div>

    <div id="canvas3d-container"></div>

    <div id="ui-panel">
        <div id="dpad-container">
            <div class="dpad-empty"></div><div class="dpad-btn" id="dpad-up">▲</div><div class="dpad-empty"></div>
            <div class="dpad-btn" id="dpad-left">◀</div><div class="dpad-empty"></div><div class="dpad-btn" id="dpad-right">▶</div>
            <div class="dpad-empty"></div><div class="dpad-btn" id="dpad-down">▼</div><div class="dpad-empty"></div>
        </div>
        
        <div id="status-board">
            <div class="log-title">⚔️ [보스 전황 기록]</div>
            <div id="log-content">필드 진입 완료.</div>
        </div>

        <div id="action-grid">
            <button id="btn-atk" class="action-btn">⚔️ 일반 참격</button>
            <button id="btn-skl" class="action-btn">❄️ 빙룡선풍</button>
            <button id="btn-heal" class="action-btn">🧪 영압 수복</button>
            <button id="btn-ban" class="action-btn">🧊 대홍련빙륜환</button>
        </div>
    </div>
</div>

<script>
let customGlbUrl = null;

function triggerFileUpload() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.glb,.gltf';
    input.onchange = (e) => {
        const file = e.target.files[0];
        if(file && gameInstance) {
            customGlbUrl = URL.createObjectURL(file);
            gameInstance.player.loadCustomModel(customGlbUrl);
        }
    };
    input.click();
}

// 테마별 거대 맵 & 고유 보스 설정
const CHAPTER_CONFIGS = [
    { 
        id: 1, name: "카라쿠라 마을 (현세)", bg: 0x0a1020, floor: 0x1a2a3a,
        bossType: "HOLLOW", bossName: "거대 그랜드 피셔", bossHp: 500, bossAtk: 0.1,
        quest: "📜 거대 호로 처치 (0/1)", bossAbilityDesc: "[호로 능력] 세로 영압구 발사"
    },
    { 
        id: 2, name: "소울 소사이어티 (정령정)", bg: 0x091428, floor: 0x788088,
        bossType: "SHINIGAMI", bossName: "호정 13대 대장", bossHp: 800, bossAtk: 0.12,
        quest: "📜 사신 대장 처치 (0/1)", bossAbilityDesc: "[사신 능력] 고유 참백도 스킬"
    },
    { 
        id: 3, name: "웨코문도 (허권)", bg: 0x020308, floor: 0xc0c8d0,
        bossType: "ARRANCAR", bossName: "에스파다 (No.4)", bossHp: 1200, bossAtk: 0.15,
        quest: "📜 에스파다 처치 (0/1)", bossAbilityDesc: "[아란칼 능력] 세로 + 레스렉시온 해방"
    },
    { 
        id: 4, name: "반덴라이히 (천년혈전 필드)", bg: 0x1a0505, floor: 0x3a1010,
        bossType: "QUINCY", bossName: "성십자기사단 (슈테른릿터)", bossHp: 2000, bossAtk: 0.18,
        quest: "📜 퀸시 기사 처치 (0/1)", bossAbilityDesc: "[퀸시 능력] 영궁 + 폴슈텐디히 폭주"
    }
];

const MAP_WIDTH = 40; const MAP_LENGTH = 180;

class Game {
    constructor() {
        this.container = document.getElementById('canvas3d-container');
        this.logBox = document.getElementById('log-content');
        this.btnHeal = document.getElementById('btn-heal');
        
        this.mp = 0; this.chapterIndex = 0;
        this.isSpecialActive = false; this.healCooldown = false;
        this.comboCount = 0; this.comboTimer = null;
        this.clock = new THREE.Clock();

        this.initThree();
        this.initWorld();
        this.player = new Player(this);
        
        this.enemies = []; this.particles = []; this.fxObjects = []; this.projectiles = [];
        this.spawnDimensionBoss();
        
        this.keys = { up: false, down: false, left: false, right: false };
        this.initEvents(); this.updateUI();
    }

    initThree() {
        this.scene = new THREE.Scene(); 
        const cfg = CHAPTER_CONFIGS[0];
        this.scene.background = new THREE.Color(cfg.bg);
        this.scene.fog = new THREE.FogExp2(cfg.bg, 0.015);
        
        this.camera = new THREE.PerspectiveCamera(42, this.container.clientWidth / this.container.clientHeight, 0.1, 1000);
        // 거대 보스 시야를 위해 카메라 거리 확대
        this.camera.position.set(0, 18, 22);
        
        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.shadowMap.enabled = true;
        this.container.appendChild(this.renderer.domElement);
        
        this.mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
        this.mainLight.position.set(15, 40, 15);
        this.scene.add(this.mainLight);
        this.scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    }

    initWorld() {
        if(this.mapGroup) this.scene.remove(this.mapGroup);
        this.mapGroup = new THREE.Group();

        const cfg = CHAPTER_CONFIGS[this.chapterIndex];
        this.scene.background = new THREE.Color(cfg.bg);
        this.scene.fog.color = new THREE.Color(cfg.bg);
        
        const floorGeo = new THREE.PlaneGeometry(MAP_WIDTH, MAP_LENGTH);
        const floorMat = new THREE.MeshStandardMaterial({ color: cfg.floor, roughness: 0.7 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, -MAP_LENGTH/2 + 20);
        this.mapGroup.add(floor);

        const grid = new THREE.GridHelper(MAP_LENGTH, 30, 0x00e5ff, 0x112233);
        grid.position.set(0, 0.02, -MAP_LENGTH/2 + 20);
        this.mapGroup.add(grid);

        // 차원 이동 게이트 (포탈)
        const gateGeo = new THREE.TorusGeometry(12, 1.5, 16, 32);
        const gateMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true });
        this.portalGate = new THREE.Mesh(gateGeo, gateMat);
        this.portalGate.position.set(0, 14.5, -MAP_LENGTH + 60);
        this.mapGroup.add(this.portalGate);

        this.scene.add(this.mapGroup);
    }

    spawnDimensionBoss() {
        this.enemies.forEach(e => this.scene.remove(e.mesh)); this.enemies = [];
        this.projectiles.forEach(p => this.scene.remove(p.mesh)); this.projectiles = [];

        const cfg = CHAPTER_CONFIGS[this.chapterIndex];
        const boss = new AbilityBoss(this, cfg);
        boss.mesh.position.set(0, 0.5, -MAP_LENGTH + 90); // 맵 끝자락 배치
        this.enemies.push(boss);
    }

    addParticles(pos, color, count = 15, scaleMult = 2.5) {
        for(let i=0; i<count; i++) {
            const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.95 });
            const p = new THREE.Mesh(new THREE.BoxGeometry(0.35 * scaleMult, 0.35 * scaleMult, 0.35 * scaleMult), mat);
            p.position.copy(pos);
            p.userData = { vx: (Math.random() - 0.5) * 0.45, vy: (Math.random() * 0.45 + 0.1), vz: (Math.random() - 0.5) * 0.45, life: 1.0 };
            this.scene.add(p); this.particles.push(p);
        }
    }

    addAdvancedFX(mesh, updateFn) {
        this.scene.add(mesh);
        this.fxObjects.push({ mesh: mesh, update: updateFn, life: 1.0 });
    }

    updateAndCleanFX() {
        for(let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
            p.userData.life -= 0.035; p.material.opacity = p.userData.life;
            if(p.userData.life <= 0) { this.scene.remove(p); this.particles.splice(i, 1); }
        }
        for(let i = this.fxObjects.length - 1; i >= 0; i--) {
            const fx = this.fxObjects[i]; fx.life -= 0.03;
            if (fx.update) fx.update(fx.mesh, fx.life);
            if(fx.life <= 0) { this.scene.remove(fx.mesh); this.fxObjects.splice(i, 1); }
        }
        for(let i = this.projectiles.length - 1; i >= 0; i--) {
            const proj = this.projectiles[i];
            proj.mesh.position.addScaledVector(proj.dir, proj.speed);
            proj.life -= 0.025;

            if(proj.mesh.position.distanceTo(this.player.mesh.position) < 1.8) {
                this.player.hp = Math.max(0, this.player.hp - proj.damage);
                this.popText(this.player.mesh.position, `💥 피격! -${proj.damage}`, 'ENEMY');
                this.updateUI();
                this.scene.remove(proj.mesh); this.projectiles.splice(i, 1);
                continue;
            }
            if(proj.life <= 0) {
                this.scene.remove(proj.mesh); this.projectiles.splice(i, 1);
            }
        }

        if(this.portalGate) this.portalGate.rotation.z += 0.03;
    }

    applyCameraUpdate() {
        let targetX = this.player.mesh.position.x;
        let targetY = this.player.mesh.position.y + 16.0;
        let targetZ = this.player.mesh.position.z + 14.0;
        this.camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.16);
        this.camera.lookAt(this.player.mesh.position.x, this.player.mesh.position.y + 6.0, this.player.mesh.position.z);
    }

    addCombo() {
        this.comboCount++;
        const el = document.getElementById('combo-container');
        document.getElementById('combo-count').innerText = this.comboCount; el.classList.add('active');
        clearTimeout(this.comboTimer);
        this.comboTimer = setTimeout(() => { this.comboCount = 0; el.classList.remove('active'); }, 2000);
    }

    // 🌌 챕터 포탈 이동 체크
    checkPortalInteraction() {
        if(this.portalGate && this.player.mesh.position.distanceTo(this.portalGate.position) < 14.0) {
            const aliveBoss = this.enemies.filter(e => e.hp > 0);
            if(aliveBoss.length > 0) {
                this.log(`⚠️ 잔여 보스를 먼저 토벌해야 다음 차원으로 넘어갈 수 있습니다!`);
                this.player.mesh.position.z += 10.0; // 살짝 튕겨냄
            } else {
                this.chapterIndex = (this.chapterIndex + 1) % CHAPTER_CONFIGS.length;
                this.player.mesh.position.set(0, 0, 0); // 플레이어 위치 초기화
                this.initWorld(); this.spawnDimensionBoss();
                this.log(`🌌 <b>[차원 이동]</b> ${CHAPTER_CONFIGS[this.chapterIndex].name} 필드에 도달했습니다!`);
                this.updateUI();
            }
        }
    }

    log(msg) { this.logBox.innerHTML = msg + "<br>" + this.logBox.innerHTML; }

    updateUI() {
        document.getElementById('hp-fill').style.width = (this.player.hp / this.player.maxHp * 100) + "%";
        document.getElementById('hp-txt').innerText = `${Math.round(this.player.hp)} / ${this.player.maxHp}`;
        document.getElementById('mp-fill').style.width = this.mp + "%";
        document.getElementById('mp-txt').innerText = `${this.mp} / 100`;
        const cfg = CHAPTER_CONFIGS[this.chapterIndex];
        const bossAlive = this.enemies.some(e => e.hp > 0);
        document.getElementById('quest-desc').innerText = bossAlive ? `${cfg.bossName} 처치 (0/1)` : `🏆 목표 달성! 차원 게이트로 이동하세요.`;
    }

    popText(pos, text, type = 'NORMAL') {
        const p = pos.clone().project(this.camera);
        const pop = document.createElement('div');
        pop.className = "damage-popup " + (type === 'CRIT' ? "crit-popup" : (type === 'ENEMY' ? "enemy-skill-popup" : ""));
        pop.innerText = text; 
        pop.style.left = ((p.x * .5 + .5) * this.container.clientWidth) + "px"; 
        pop.style.top = ((-(p.y * .5) + .5) * this.container.clientHeight) + "px";
        this.container.appendChild(pop); setTimeout(() => pop.remove(), 550);
    }

    initEvents() {
        const setKey = (id, dir, val) => {
            const el = document.getElementById(id);
            el.addEventListener('mousedown', () => this.keys[dir] = val);
            el.addEventListener('mouseup', () => this.keys[dir] = !val);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys[dir] = val; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); this.keys[dir] = !val; });
        };
        setKey('dpad-up', 'up', true); setKey('dpad-down', 'down', true);
        setKey('dpad-left', 'left', true); setKey('dpad-right', 'right', true);
        
        document.getElementById('btn-atk').addEventListener('click', () => this.player.attack());
        document.getElementById('btn-skl').addEventListener('click', () => this.player.useSkill());
        document.getElementById('btn-heal').addEventListener('click', () => this.useHealPotion());
        document.getElementById('btn-ban').addEventListener('click', () => { 
            if(this.mp >= 100 && !this.isSpecialActive) { this.mp = 0; this.isSpecialActive = true; this.player.activateBankai(); }
        });
    }
    
    useHealPotion() {
        if (this.healCooldown || this.player.hp >= this.player.maxHp) return;
        this.healCooldown = true; this.btnHeal.disabled = true;
        this.player.hp = Math.min(this.player.maxHp, this.player.hp + 120);
        this.popText(this.player.mesh.position, `💖 영압 수복`, 'NORMAL'); this.updateUI();
        setTimeout(() => { this.healCooldown = false; this.btnHeal.disabled = false; }, 6000);
    }
}

class Player {
    constructor(game) {
        this.game = game; this.hp = 300; this.maxHp = 300; this.atk = 80; this.speed = 0.22;
        this.mesh = new THREE.Group();
        this.game.scene.add(this.mesh);
        
        if (customGlbUrl) {
            this.loadCustomModel(customGlbUrl);
        } else {
            this.loadDefaultModel();
        }
    }

    loadDefaultModel() {
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.7), new THREE.MeshStandardMaterial({ color: 0xffdfc4 }));
        head.position.y = 2.4;
        const hair = new THREE.Mesh(new THREE.ConeGeometry(0.85, 1.0, 8), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        hair.position.set(0, 3.0, -0.05);
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.6, 1.8), new THREE.MeshStandardMaterial({ color: 0x111115 }));
        body.position.y = 1.2;
        this.mesh.add(head, hair, body);
    }

    loadCustomModel(url) {
        if(this.model) this.mesh.remove(this.model);
        this.mesh.children.forEach(c => this.mesh.remove(c));
        const loader = new THREE.GLTFLoader();
        loader.load(url, (gltf) => {
            this.model = gltf.scene; this.model.scale.set(2.0, 2.0, 2.0);
            this.mesh.add(this.model);
            this.game.log(`✨ 커스텀 GLB 로드 완료!`);
        }, undefined, () => {
            this.game.log(`❌ GLB 로드 실패. 기본 모델 탑재.`);
            this.loadDefaultModel();
        });
    }

    activateBankai() {
        this.game.log(`🔮 <span style='color:#ffd700;font-weight:900;'>[卍解] "대홍련빙륜환" 개방!</span>`);
        this.game.popText(this.mesh.position, `❄️ 卍解 개방!`, 'CRIT');
        this.game.updateUI();
        setTimeout(() => { this.game.isSpecialActive = false; this.game.updateUI(); }, 12000);
    }

    attack() {
        const frontPos = this.mesh.position.clone().add(new THREE.Vector3(0, 1.2, -2.5).applyQuaternion(this.mesh.quaternion));
        this.game.addParticles(frontPos, 0x00e5ff, 15, 2.5);
        
        let range = this.game.isSpecialActive ? 8.0 : 5.5;
        let targets = this.game.enemies.filter(e => e.hp > 0 && this.mesh.position.distanceTo(e.mesh.position) < range);
        
        if (targets.length > 0) this.game.addCombo();
        targets.forEach((e) => {
            let dmg = this.atk * (this.game.isSpecialActive ? 3.0 : 1.0);
            e.takeDamage(dmg); 
            this.game.popText(e.mesh.position, `⚔️ -${Math.round(dmg)}`, this.game.isSpecialActive ? 'CRIT' : 'NORMAL');
        });
        if(!this.game.isSpecialActive) this.game.mp = Math.min(100, this.game.mp + 25);
        this.game.updateUI();
    }
    
    useSkill() {
        let targets = this.game.enemies.filter(e => e.hp > 0);
        this.game.log(`❄️ <b>[오의] 빙룡선풍 난무!</b>`);
        targets.forEach(e => {
            if(this.mesh.position.distanceTo(e.mesh.position) < 9.0) {
                let dmg = this.atk * 2.5; e.takeDamage(dmg);
                this.game.popText(e.mesh.position, `💥 -${Math.round(dmg)}`, 'CRIT');
            }
        });
        this.game.addCombo(); this.game.updateUI();
    }

    move(delta) {
        let dx = 0, dz = 0;
        if (this.game.keys.up) dz = -1; if (this.game.keys.down) dz = 1;
        if (this.game.keys.left) dx = -1; if (this.game.keys.right) dx = 1;
        if (dx !== 0 || dz !== 0) {
            let mag = Math.sqrt(dx*dx + dz*dz);
            let nextX = this.mesh.position.x + (dx/mag) * this.speed;
            let nextZ = this.mesh.position.z + (dz/mag) * this.speed;
            if (Math.abs(nextX) < MAP_WIDTH / 2 - 1.2) this.mesh.position.x = nextX;
            if (nextZ > -MAP_LENGTH + 15 && nextZ < 8) this.mesh.position.z = nextZ;
            this.mesh.rotation.y = Math.atan2(dx, dz);
        }
    }
}

// 👹 AI 및 세력별 고유 능력을 갖춘 거대 보스 클래스
class AbilityBoss {
    constructor(game, cfg) {
        this.game = game; this.type = cfg.bossType; this.name = cfg.bossName;
        this.hp = cfg.bossHp; this.maxHp = this.hp; this.atk = cfg.bossAtk;
        this.speed = 0.055; this.detectionRange = 40.0;
        this.mesh = new THREE.Group();
        this.skillCooldown = 0; this.rageActive = false; // 퀸시 폭주

        // 모든 보스는 플레이어보다 수배 거대한 스케일 (3.5배)
        let scale = 3.5;

        if (this.type === "HOLLOW") {
            const body = new THREE.Mesh(new THREE.DodecahedronGeometry(0.65 * scale), new THREE.MeshStandardMaterial({ color: 0x111115 }));
            const mask = new THREE.Mesh(new THREE.BoxGeometry(0.6 * scale, 0.8 * scale, 0.3 * scale), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            mask.position.set(0, 0.1, 0.4 * scale);
            this.mesh.add(body, mask);
        } else if (this.type === "SHINIGAMI") {
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3 * scale, 0.5 * scale, 1.3 * scale), new THREE.MeshStandardMaterial({ color: 0x050505 }));
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.4 * scale), new THREE.MeshStandardMaterial({ color: 0xffdfc4 }));
            head.position.y = 0.9 * scale;
            this.mesh.add(body, head);
        } else if (this.type === "ARRANCAR") {
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35 * scale, 0.5 * scale, 1.3 * scale), new THREE.MeshStandardMaterial({ color: 0xf0f0f0 }));
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.42 * scale), new THREE.MeshStandardMaterial({ color: 0xffdfc4 }));
            head.position.y = 0.9 * scale;
            this.mesh.add(body, head);
        } else if (this.type === "QUINCY") {
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.32 * scale, 0.52 * scale, 1.4 * scale), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            body.position.y = 0.7 * scale;
            const bowRing = new THREE.Mesh(new THREE.TorusGeometry(0.8 * scale, 0.07, 8, 24), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
            bowRing.position.set(0, 1.0 * scale, -0.3);
            this.mesh.add(body, bowRing);
        }

        this.game.scene.add(this.mesh);
        this.game.log(`👾 <b>[보스 강림]</b> ${this.name}이 필드에 나타났습니다!`);
        this.game.log(`📜 ${cfg.bossAbilityDesc}`);
    }

    takeDamage(amt) {
        this.hp = Math.max(0, this.hp - amt);
        if(this.hp <= 0) { 
            this.game.addParticles(this.mesh.position, 0xffffff, 25, 3.0);
            this.mesh.position.y = -80; 
            this.game.updateUI(); 
            this.game.log(`🏆 <b>[토벌 성공!]</b> ${this.name}을 처치했습니다. CH.${CHAPTER_CONFIGS[this.game.chapterIndex].nextCh ? CHAPTER_CONFIGS[this.game.chapterIndex].nextCh : 'End'} 게이트로 이동하세요.`);
        }
    }

    useAbility(pPos) {
        let dir = new THREE.Vector3().subVectors(pPos, this.mesh.position).normalize();
        
        if(this.type === "HOLLOW") {
            // 호로: 영압구(세로) 발사
            this.game.popText(this.mesh.position, `🔊 호로 탄환!`, 'ENEMY');
            const ball = new THREE.Mesh(new THREE.SphereGeometry(0.65), new THREE.MeshBasicMaterial({ color: 0xaa00aa }));
            ball.position.copy(this.mesh.position).add(new THREE.Vector3(0, 2.0, 0));
            this.game.scene.add(ball);
            this.game.projectiles.push({ mesh: ball, dir: dir, speed: 0.28, damage: 30, life: 1.0 });

        } else if(this.type === "SHINIGAMI") {
            // 사신: 순포 돌진 참격
            this.game.popText(this.mesh.position, `⚡ 대장급 참격!`, 'ENEMY');
            this.mesh.position.addScaledVector(dir, 15.0); // 순간 이동
            this.game.player.hp = Math.max(0, this.game.player.hp - 45); 
            this.game.addParticles(this.game.player.mesh.position, 0x000000, 10);
            this.game.updateUI();

        } else if(this.type === "ARRANCAR") {
            // 아란칼: 세로 레이저 (강력)
            this.game.popText(this.mesh.position, `🔴 세로(Cero)!`, 'ENEMY');
            const cero = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 3.5), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
            cero.rotation.x = Math.PI / 2; cero.position.copy(this.mesh.position).add(new THREE.Vector3(0, 2.0, 0));
            this.game.scene.add(cero);
            this.game.projectiles.push({ mesh: cero, dir: dir, speed: 0.38, damage: 55, life: 1.0 });

        } else if(this.type === "QUINCY") {
            // 퀸시: 하일리히 프파일 연사 (or 폭주)
            if(this.hp / this.maxHp < 0.4 && !this.rageActive) {
                this.rageActive = true;
                this.game.log(`🏹 <span style='color:#ff1744;'>[퀸시 폭주] 폴슈텐디히 전개!</span>`);
                const ringfx = new THREE.Mesh(new THREE.RingGeometry(0.5, 8.0, 32), new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.3 }));
                ringfx.rotation.x = -Math.PI / 2; ringfx.position.copy(this.mesh.position);
                this.game.addFXObject(ringfx, (m, life) => m.scale.multiplyScalar(1.04));
            }
            this.game.popText(this.mesh.position, this.rageActive ? `🔥 폭주 난사!` : `🏹 신성멸화!`, 'ENEMY');
            for(let i = -1; i <= 1; i++) {
                const arrow = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 1.8), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
                arrow.position.copy(this.mesh.position).add(new THREE.Vector3(i * 0.5, 2.0, 0));
                this.game.scene.add(arrow);
                this.game.projectiles.push({ mesh: arrow, dir: dir, speed: 0.32, damage: this.rageActive ? 30 : 20, life: 1.0 });
            }
        }
    }

    update() {
        if(this.hp <= 0) return;
        const pPos = this.game.player.mesh.position;
        const dist = this.mesh.position.distanceTo(pPos);

        if (dist < this.detectionRange) {
            let dir = new THREE.Vector3().subVectors(pPos, this.mesh.position).normalize();
            this.mesh.position.addScaledVector(dir, this.speed);
            this.mesh.rotation.y = Math.atan2(dir.x, dir.z);

            this.skillCooldown += 0.025;
            if(this.skillCooldown > 3.0) {
                this.skillCooldown = 0; this.useAbility(pPos);
            }
            if(dist < 3.2) { // 근접 기본 평타
                this.game.player.hp = Math.max(0, this.game.player.hp - this.atk * (this.rageActive ? 1.5 : 1.0)); 
                this.game.updateUI();
            }
        }
    }
}

let gameInstance = null;
function startGame() {
    gameInstance = new Game();
    function animate() {
        requestAnimationFrame(animate);
        if (gameInstance) {
            const delta = gameInstance.clock.getDelta();
            gameInstance.player.move(delta); 
            gameInstance.enemies.forEach(e => e.update()); 
            gameInstance.updateAndCleanFX();
            gameInstance.checkPortalInteraction();
            gameInstance.applyCameraUpdate(); 
            gameInstance.renderer.render(gameInstance.scene, gameInstance.camera);
        }
    }
    animate();
}
window.onload = startGame;
</script>
