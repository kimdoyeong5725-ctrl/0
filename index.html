<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>블리치: 차원 보스전 Custom</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
        body { background: #000; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; }
        #game-container { position: relative; width: 100%; max-width: 480px; height: 100%; max-height: 860px; background: #000; overflow: hidden; display: flex; flex-direction: column; border: 2px solid #1a1a24; }
        
        #top-status-bar { width: 100%; height: 18%; background: rgba(5, 7, 12, 0.95); border-bottom: 2px solid #00e5ff44; padding: 8px 12px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 6px; z-index: 105; }
        .bar-group { display: flex; flex-direction: column; gap: 3px; justify-content: center; }
        .bar-row { display: flex; align-items: center; gap: 6px; }
        .bar-label { width: 55px; font-weight: bold; color: #88a0a8; font-size: 9.5px; }
        .bar-bg { flex: 1; height: 10px; background: #06090e; border: 1px solid #1e2d3d; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.2s ease-out; }
        #hp-fill { background: linear-gradient(90deg, #ff1744, #b20028); }
        #mp-fill { background: linear-gradient(90deg, #00e5ff, #007c91); width: 0%; }
        .bar-text { font-size: 8.5px; width: 55px; text-align: right; color: #a0b0b8; font-weight: bold; }
        
        .right-info { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; font-size: 10px; border-left: 1px solid #1e2d3d; padding-left: 8px; color: #eee; gap: 2px; }
        .char-tag { color: #00e5ff; font-weight: 900; font-size: 11px; }

        #quest-box { position: absolute; top: 19%; left: 10px; z-index: 140; background: rgba(5, 10, 20, 0.92); border: 1.5px solid #00e5ff; border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 10px; width: 230px; box-shadow: 0 0 12px rgba(0, 229, 255, 0.3); }
        #quest-title { color: #ffd700; font-weight: bold; font-size: 11px; margin-bottom: 2px; }

        #canvas3d-container { position: relative; width: 100%; height: 50%; background: #050811; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; display: block; }

        #glb-upload-btn-panel { position: absolute; top: 19%; right: 10px; z-index: 140; }
        #glb-btn { background: #ffd700; color: #000; font-weight: bold; border: none; font-size: 9px; padding: 5px 9px; border-radius: 4px; cursor: pointer; box-shadow: 0 0 8px rgba(255,215,0,0.4); }

        .damage-popup { position: absolute; color: #fff; font-weight: 900; font-size: 16px; pointer-events: none; z-index: 150; transform: translate(-50%, -50%); animation: popupAnim 0.5s ease-out forwards; }
        .crit-popup { color: #00e5ff !important; font-size: 24px !important; text-shadow: 0 0 12px #00e5ff; }
        .enemy-skill-popup { color: #ff1744 !important; font-size: 22px !important; text-shadow: 0 0 12px #ff0000; }
        
        @keyframes popupAnim { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); } 30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -50%) translateY(-40px); } }

        #ui-panel { width: 100%; height: 32%; background: #040609; border-top: 1px solid #1e2d3d; padding: 6px; display: grid; grid-template-columns: 0.9fr 1.1fr 1.2fr; gap: 4px; z-index: 100; }
        #dpad-container { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 95px; height: 95px; margin: auto; gap: 2px; }
        .dpad-btn { background: #0a0f18; border: 1px solid #1e2d3d; border-radius: 4px; color: #708898; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .dpad-btn:active { background: #00e5ff; color: #000; }
        .dpad-empty { visibility: hidden; }

        #status-board { background: #020305; border: 1px solid #141f2c; border-radius: 5px; padding: 6px; color: #8090a0; font-size: 8.5px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
        .log-title { color: #00e5ff; font-weight: bold; border-bottom: 1px solid #141f2c; padding-bottom: 2px; }
        #log-content { flex: 1; font-size: 8px; overflow-y: auto; color: #607080; }

        #action-grid { display: grid; grid-template-columns: 1fr; grid-template-rows: repeat(4, 1fr); gap: 3px; }
        .action-btn { width: 100%; height: 100%; border: 1px solid #1e2d3d; border-radius: 4px; font-size: 9.5px; font-weight: bold; color: #a0b0c0; background: #0a0f18; cursor: pointer; }
        #btn-atk { background: linear-gradient(180deg, #141f2c, #0a0f18); color: #fff; }
        #btn-skl { background: linear-gradient(180deg, #00e5ff, #007c91); color: #000; font-weight: 900; }
        #btn-heal { color: #80c090; }
        #btn-ban { background: linear-gradient(180deg, #ffd700, #998000); color: #000; font-weight: 900; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="top-status-bar">
        <div class="bar-group">
            <div class="bar-row"><span class="bar-label">HP 생명력</span><div class="bar-bg"><div id="hp-fill" class="bar-fill"></div></div><span id="hp-txt" class="bar-text">300 / 300</span></div>
            <div class="bar-row"><span class="bar-label">MP 영압</span><div class="bar-bg"><div id="mp-fill" class="bar-fill"></div></div><span id="mp-txt" class="bar-text">0 / 100</span></div>
        </div>
        <div class="right-info">
            <div class="char-tag" id="player-char-name">히츠가야 토시로</div>
            <div style="color:#76ff03; font-weight:bold; font-size:9px;" id="zone-tag">CH.1 현세 필드</div>
        </div>
    </div>

    <div id="quest-box">
        <div id="quest-title">📜 퀘스트 [CH.1 현세]</div>
        <span id="quest-desc">거대 호로 처치 (0/1)</span>
    </div>

    <div id="glb-upload-btn-panel">
        <button id="glb-btn" onclick="triggerFileUpload()">📂 내 GLB 불러오기</button>
    </div>

    <div id="canvas3d-container"></div>

    <div id="ui-panel">
        <div id="dpad-container">
            <div class="dpad-empty"></div><div class="dpad-btn" id="dpad-up">▲</div><div class="dpad-empty"></div>
            <div class="dpad-btn" id="dpad-left">◀</div><div class="dpad-empty"></div><div class="dpad-btn" id="dpad-right">▶</div>
            <div class="dpad-empty"></div><div class="dpad-btn" id="dpad-down">▼</div><div class="dpad-empty"></div>
        </div>
        
        <div id="status-board">
            <div class="log-title">⚔️ [전황 브리핑]</div>
            <div id="log-content">이미지 기반 디테일 보스 3D 구현 완료!</div>
        </div>

        <div id="action-grid">
            <button id="btn-atk" class="action-btn">⚔️ 일반 참격</button>
            <button id="btn-skl" class="action-btn">❄️ 빙룡선풍</button>
            <button id="btn-heal" class="action-btn">🧪 영압 수복</button>
            <button id="btn-ban" class="action-btn">🧊 대홍련빙륜환</button>
        </div>
    </div>
</div>

<script>
let customGlbUrl = null;

function triggerFileUpload() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.glb,.gltf';
    input.onchange = (e) => {
        const file = e.target.files[0];
        if(file && gameInstance) {
            customGlbUrl = URL.createObjectURL(file);
            gameInstance.player.loadCustomModel(customGlbUrl);
        }
    };
    input.click();
}

const CHAPTER_CONFIGS = [
    { 
        id: 1, name: "카라쿠라 마을 (현세)", bg: 0x0a1020, theme: 'URBAN',
        bossType: "HOLLOW", bossName: "CH.1 일반 호로", bossHp: 650, bossAtk: 0.12,
        quest: "📜 거대 호로 처치 (0/1)", bossDesc: "[호로 패턴] 세로 구체 발사"
    },
    { 
        id: 2, name: "소울 소사이어티 (정령정)", bg: 0x091428, theme: 'SOUL',
        bossType: "SHINIGAMI", bossName: "CH.2 사신 대장", bossHp: 1100, bossAtk: 0.15,
        quest: "📜 사신 대장 처치 (0/1)", bossDesc: "[사신 패턴] 청색 참백도 돌진"
    },
    { 
        id: 3, name: "웨코문도 (허권)", bg: 0x020308, theme: 'HUECO',
        bossType: "ARRANCAR", bossName: "CH.3 에스파다", bossHp: 1600, bossAtk: 0.18,
        quest: "📜 에스파다 처치 (0/1)", bossDesc: "[아란칼 패턴] 에메랄드 세로 빔"
    },
    { 
        id: 4, name: "반덴라이히 (천년혈전)", bg: 0x1a0505, theme: 'QUINCY',
        bossType: "QUINCY", bossName: "CH.4 퀸시 (슈테른릿터)", bossHp: 2600, bossAtk: 0.22,
        quest: "📜 퀸시 기사 처치 (0/1)", bossDesc: "[퀸시 패턴] 영자 활 + 폴슈텐디히 날개"
    }
];

const MAP_WIDTH = 180; const MAP_LENGTH = 450;

class Game {
    constructor() {
        this.container = document.getElementById('canvas3d-container');
        this.logBox = document.getElementById('log-content');
        this.btnHeal = document.getElementById('btn-heal');
        
        this.mp = 0; this.chapterIndex = 0;
        this.isSpecialActive = false; this.healCooldown = false;
        this.clock = new THREE.Clock();

        this.initThree();
        this.initWorld();
        this.player = new Player(this);
        
        this.enemies = []; this.particles = []; this.fxObjects = []; this.projectiles = [];
        this.spawnDimensionBoss();
        
        this.keys = { up: false, down: false, left: false, right: false };
        this.initEvents(); this.updateUI();
    }

    initThree() {
        this.scene = new THREE.Scene(); 
        const cfg = CHAPTER_CONFIGS[0];
        this.scene.background = new THREE.Color(cfg.bg);
        this.scene.fog = new THREE.FogExp2(cfg.bg, 0.0035);
        
        this.camera = new THREE.PerspectiveCamera(45, this.container.clientWidth / this.container.clientHeight, 0.1, 1500);
        this.camera.position.set(0, 35, 45);
        
        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.shadowMap.enabled = true;
        this.container.appendChild(this.renderer.domElement);
        
        this.mainLight = new THREE.DirectionalLight(0xffffff, 2.2);
        this.mainLight.position.set(40, 80, 40);
        this.scene.add(this.mainLight);
        this.scene.add(new THREE.AmbientLight(0x88bbdd, 1.2));
    }

    generateTexture(theme) {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');

        if(theme === 'URBAN') {
            ctx.fillStyle = '#1c2430'; ctx.fillRect(0,0,512,512);
            ctx.strokeStyle = '#2d3b4e'; ctx.lineWidth = 10; ctx.strokeRect(0,0,512,512);
        } else if(theme === 'SOUL') {
            ctx.fillStyle = '#2a323d'; ctx.fillRect(0,0,512,512);
            ctx.strokeStyle = '#485566'; ctx.lineWidth = 8;
            for(let i=0; i<=512; i+=128) { ctx.strokeRect(i, 0, 128, 512); ctx.strokeRect(0, i, 512, 128); }
        } else if(theme === 'HUECO') {
            ctx.fillStyle = '#e5e9f0'; ctx.fillRect(0,0,512,512);
            ctx.strokeStyle = '#bac2d0'; ctx.lineWidth = 14; ctx.strokeRect(0,0,512,512);
        } else {
            ctx.fillStyle = '#240a0a'; ctx.fillRect(0,0,512,512);
            ctx.strokeStyle = '#521818'; ctx.lineWidth = 12; ctx.strokeRect(0,0,512,512);
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(10, 25);
        return tex;
    }

    initWorld() {
        if(this.mapGroup) this.scene.remove(this.mapGroup);
        this.mapGroup = new THREE.Group();

        const cfg = CHAPTER_CONFIGS[this.chapterIndex];
        this.scene.background = new THREE.Color(cfg.bg);
        this.scene.fog.color = new THREE.Color(cfg.bg);
        
        const floorGeo = new THREE.PlaneGeometry(MAP_WIDTH, MAP_LENGTH);
        const floorMat = new THREE.MeshStandardMaterial({ map: this.generateTexture(cfg.theme), roughness: 0.4, metalness: 0.2 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, -MAP_LENGTH/2 + 40);
        this.mapGroup.add(floor);

        for(let i=0; i<12; i++) {
            const pillar = new THREE.Mesh(
                new THREE.BoxGeometry(10, 50, 10),
                new THREE.MeshStandardMaterial({ color: (cfg.theme==='HUECO'? 0xffffff : 0x141f2e), roughness:0.3 })
            );
            pillar.position.set(-MAP_WIDTH/2 + 8, 25, -i*35);
            const pillarR = pillar.clone(); pillarR.position.x = MAP_WIDTH/2 - 8;
            this.mapGroup.add(pillar, pillarR);
        }

        const gateGroup = new THREE.Group();
        const gateRing = new THREE.Mesh(new THREE.TorusGeometry(18, 2.5, 16, 32), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
        const gateCore = new THREE.Mesh(new THREE.CircleGeometry(16, 32), new THREE.MeshBasicMaterial({ color: 0x0088cc, transparent: true, opacity: 0.6, side: THREE.DoubleSide }));
        gateGroup.add(gateRing, gateCore);
        gateGroup.position.set(0, 18, -MAP_LENGTH + 80);
        this.portalGate = gateGroup;
        this.mapGroup.add(this.portalGate);

        this.scene.add(this.mapGroup);
    }

    spawnDimensionBoss() {
        this.enemies.forEach(e => this.scene.remove(e.mesh)); this.enemies = [];
        this.projectiles.forEach(p => this.scene.remove(p.mesh)); this.projectiles = [];

        const cfg = CHAPTER_CONFIGS[this.chapterIndex];
        const boss = new ImageMatchedBoss(this, cfg);
        boss.mesh.position.set(0, 0, -MAP_LENGTH + 180);
        this.enemies.push(boss);
    }

    addParticles(pos, color, count = 15, scaleMult = 4.0) {
        for(let i=0; i<count; i++) {
            const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9 });
            const p = new THREE.Mesh(new THREE.BoxGeometry(0.4 * scaleMult, 0.4 * scaleMult, 0.4 * scaleMult), mat);
            p.position.copy(pos);
            p.userData = { vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() * 0.8 + 0.2), vz: (Math.random() - 0.5) * 1.2, life: 1.0 };
            this.scene.add(p); this.particles.push(p);
        }
    }

    updateAndCleanFX() {
        for(let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
            p.userData.life -= 0.035; p.material.opacity = p.userData.life;
            if(p.userData.life <= 0) { this.scene.remove(p); this.particles.splice(i, 1); }
        }
        for(let i = this.projectiles.length - 1; i >= 0; i--) {
            const proj = this.projectiles[i];
            proj.mesh.position.addScaledVector(proj.dir, proj.speed);
            proj.life -= 0.02;

            if(proj.mesh.position.distanceTo(this.player.mesh.position) < 4.0) {
                this.player.hp = Math.max(0, this.player.hp - proj.damage);
                this.popText(this.player.mesh.position, `💥 피격! -${proj.damage}`, 'ENEMY');
                this.updateUI();
                this.scene.remove(proj.mesh); this.projectiles.splice(i, 1);
                continue;
            }
            if(proj.life <= 0) {
                this.scene.remove(proj.mesh); this.projectiles.splice(i, 1);
            }
        }

        if(this.portalGate) this.portalGate.rotation.z += 0.03;
    }

    applyCameraUpdate() {
        let targetX = this.player.mesh.position.x;
        let targetY = this.player.mesh.position.y + 32.0;
        let targetZ = this.player.mesh.position.z + 38.0;
        this.camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.15);
        this.camera.lookAt(this.player.mesh.position.x, this.player.mesh.position.y + 6.0, this.player.mesh.position.z);
    }

    checkPortalInteraction() {
        if(this.portalGate && this.player.mesh.position.distanceTo(this.portalGate.position) < 25.0) {
            const aliveBoss = this.enemies.filter(e => e.hp > 0);
            if(aliveBoss.length > 0) {
                this.log(`⚠️ 보스를 토벌해야 차원 워프가 활성화됩니다!`);
                this.player.mesh.position.z += 15.0; 
            } else {
                this.chapterIndex = (this.chapterIndex + 1) % CHAPTER_CONFIGS.length;
                this.player.mesh.position.set(0, 0, 0); 
                this.initWorld(); this.spawnDimensionBoss();
                this.log(`🌌 <b>[차원 이동]</b> ${CHAPTER_CONFIGS[this.chapterIndex].name} 도달!`);
                this.updateUI();
            }
        }
    }

    log(msg) { this.logBox.innerHTML = msg + "<br>" + this.logBox.innerHTML; }

    updateUI() {
        document.getElementById('hp-fill').style.width = (this.player.hp / this.player.maxHp * 100) + "%";
        document.getElementById('hp-txt').innerText = `${Math.round(this.player.hp)} / ${this.player.maxHp}`;
        document.getElementById('mp-fill').style.width = this.mp + "%";
        document.getElementById('mp-txt').innerText = `${this.mp} / 100`;
        const cfg = CHAPTER_CONFIGS[this.chapterIndex];
        const bossAlive = this.enemies.some(e => e.hp > 0);
        document.getElementById('quest-desc').innerText = bossAlive ? `${cfg.bossName} 처치 (0/1)` : `🏆 토벌 완료! 차원 게이트로 이동하세요.`;
        document.getElementById('zone-tag').innerText = cfg.name;
    }

    popText(pos, text, type = 'NORMAL') {
        const p = pos.clone().project(this.camera);
        const pop = document.createElement('div');
        pop.className = "damage-popup " + (type === 'CRIT' ? "crit-popup" : (type === 'ENEMY' ? "enemy-skill-popup" : ""));
        pop.innerText = text; 
        pop.style.left = ((p.x * .5 + .5) * this.container.clientWidth) + "px"; 
        pop.style.top = ((-(p.y * .5) + .5) * this.container.clientHeight) + "px";
        this.container.appendChild(pop); setTimeout(() => pop.remove(), 600);
    }

    initEvents() {
        const setKey = (id, dir, val) => {
            const el = document.getElementById(id);
            el.addEventListener('mousedown', () => this.keys[dir] = val);
            el.addEventListener('mouseup', () => this.keys[dir] = !val);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys[dir] = val; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); this.keys[dir] = !val; });
        };
        setKey('dpad-up', 'up', true); setKey('dpad-down', 'down', true);
        setKey('dpad-left', 'left', true); setKey('dpad-right', 'right', true);
        
        document.getElementById('btn-atk').addEventListener('click', () => this.player.attack());
        document.getElementById('btn-skl').addEventListener('click', () => this.player.useSkill());
        document.getElementById('btn-heal').addEventListener('click', () => this.useHealPotion());
        document.getElementById('btn-ban').addEventListener('click', () => { 
            if(this.mp >= 100 && !this.isSpecialActive) { this.mp = 0; this.isSpecialActive = true; this.player.activateBankai(); }
        });
    }
    
    useHealPotion() {
        if (this.healCooldown || this.player.hp >= this.player.maxHp) return;
        this.healCooldown = true; this.btnHeal.disabled = true;
        this.player.hp = Math.min(this.player.maxHp, this.player.hp + 150);
        this.popText(this.player.mesh.position, `💖 영압 회복`, 'NORMAL'); this.updateUI();
        setTimeout(() => { this.healCooldown = false; this.btnHeal.disabled = false; }, 5000);
    }
}

class Player {
    constructor(game) {
        this.game = game; this.hp = 300; this.maxHp = 300; this.atk = 120; this.speed = 0.55;
        this.mesh = new THREE.Group();
        this.game.scene.add(this.mesh);
        
        if (customGlbUrl) {
            this.loadCustomModel(customGlbUrl);
        } else {
            this.loadDefaultToshiroModel();
        }
    }

    loadDefaultToshiroModel() {
        const group = new THREE.Group();
        const head = new THREE.Mesh(new THREE.SphereGeometry(1.5), new THREE.MeshStandardMaterial({ color: 0xffdfc4 }));
        head.position.y = 5.2;
        const hair = new THREE.Mesh(new THREE.ConeGeometry(1.8, 2.2, 8), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        hair.position.set(0, 6.4, -0.1);
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.3, 3.8), new THREE.MeshStandardMaterial({ color: 0x0a0a0f }));
        body.position.y = 2.6;
        const haori = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.8, 2.8, 8, 1, true), new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
        haori.position.y = 2.2;

        group.add(head, hair, body, haori);
        const box = new THREE.Box3().setFromObject(group);
        group.position.y = -box.min.y;
        
        this.mesh.add(group); this.model = group;
    }

    loadCustomModel(url) {
        if(this.model) this.mesh.remove(this.model);
        const loader = new THREE.GLTFLoader();
        loader.load(url, (gltf) => {
            const customModel = gltf.scene;
            const box = new THREE.Box3().setFromObject(customModel);
            const size = box.getSize(new THREE.Vector3());
            const scaleFactor = 6.0 / (size.y || 1.0);
            customModel.scale.set(scaleFactor, scaleFactor, scaleFactor);
            const reBox = new THREE.Box3().setFromObject(customModel);
            customModel.position.y = -reBox.min.y;

            this.mesh.add(customModel); this.model = customModel;
            this.game.log(`✨ 커스텀 모델 정렬 배치 완료.`);
        }, undefined, () => {
            this.loadDefaultToshiroModel();
        });
    }

    activateBankai() {
        this.game.log(`🔮 <span style='color:#ffd700;font-weight:900;'>[卍解] "대홍련빙륜환" 개방!</span>`);
        this.game.popText(this.mesh.position, `❄️ 卍解 개방!`, 'CRIT');
        
        const wingL = new THREE.Mesh(new THREE.BoxGeometry(16, 1.2, 4), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8 }));
        wingL.position.set(-8, 5, -1); wingL.rotation.z = 0.3;
        const wingR = wingL.clone(); wingR.position.x = 8; wingR.rotation.z = -0.3;
        this.mesh.add(wingL, wingR);

        setTimeout(() => {
            this.mesh.remove(wingL, wingR);
            this.game.isSpecialActive = false; this.game.updateUI();
        }, 12000);
        this.game.updateUI();
    }

    attack() {
        const frontPos = this.mesh.position.clone().add(new THREE.Vector3(0, 3, -6).applyQuaternion(this.mesh.quaternion));
        this.game.addParticles(frontPos, 0x00e5ff, 20, 5.0);
        
        let range = this.game.isSpecialActive ? 22.0 : 14.0;
        let targets = this.game.enemies.filter(e => e.hp > 0 && this.mesh.position.distanceTo(e.mesh.position) < range);
        
        targets.forEach((e) => {
            let dmg = this.atk * (this.game.isSpecialActive ? 2.5 : 1.0);
            e.takeDamage(dmg); 
            this.game.popText(e.mesh.position, `⚔️ -${Math.round(dmg)}`, this.game.isSpecialActive ? 'CRIT' : 'NORMAL');
        });
        if(!this.game.isSpecialActive) this.game.mp = Math.min(100, this.game.mp + 20);
        this.game.updateUI();
    }
    
    useSkill() {
        let targets = this.game.enemies.filter(e => e.hp > 0);
        this.game.log(`❄️ <b>[오의] 거대 빙룡선풍!</b>`);
        targets.forEach(e => {
            if(this.mesh.position.distanceTo(e.mesh.position) < 28.0) {
                let dmg = this.atk * 2.8; e.takeDamage(dmg);
                this.game.popText(e.mesh.position, `🐉 -${Math.round(dmg)}`, 'CRIT');
            }
        });
        this.game.updateUI();
    }

    move(delta) {
        let dx = 0, dz = 0;
        if (this.game.keys.up) dz = -1; if (this.game.keys.down) dz = 1;
        if (this.game.keys.left) dx = -1; if (this.game.keys.right) dx = 1;
        if (dx !== 0 || dz !== 0) {
            let mag = Math.sqrt(dx*dx + dz*dz);
            let nextX = this.mesh.position.x + (dx/mag) * this.speed;
            let nextZ = this.mesh.position.z + (dz/mag) * this.speed;
            if (Math.abs(nextX) < MAP_WIDTH / 2 - 5.0) this.mesh.position.x = nextX;
            if (nextZ > -MAP_LENGTH + 40 && nextZ < 20) this.mesh.position.z = nextZ;
            this.mesh.rotation.y = Math.atan2(dx, dz);
        }
    }
}

// 🖼️ 첨부 이미지 매칭 3D 보스 조형 클래스
class ImageMatchedBoss {
    constructor(game, cfg) {
        this.game = game; this.type = cfg.bossType; this.name = cfg.bossName;
        this.hp = cfg.bossHp; this.maxHp = this.hp; this.atk = cfg.bossAtk;
        this.speed = 0.18; this.detectionRange = 100.0;
        this.mesh = new THREE.Group();
        this.skillCooldown = 0; this.rageActive = false;

        this.buildImageMatchedModel();
        this.game.scene.add(this.mesh);
        this.game.log(`👾 <b>[보스 강림]</b> ${this.name}이 필드에 모습을 드러냈습니다!`);
    }

    buildImageMatchedModel() {
        const group = new THREE.Group();

        if (this.type === "HOLLOW") {
            // 🔴 333.jpg 기반: 일반 호로
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(4.5, 6, 22), new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.3 }));
            torso.position.y = 11;

            // 가슴 흉공 (Hollow Hole)
            const holeRim = new THREE.Mesh(new THREE.TorusGeometry(2.5, 0.8, 16, 32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
            holeRim.position.set(0, 14, 0); holeRim.rotation.x = Math.PI / 2;

            // 흰 가면 + 붉은 문양
            const mask = new THREE.Mesh(new THREE.BoxGeometry(6.5, 8.5, 4.5), new THREE.MeshStandardMaterial({ color: 0xf2f2f2 }));
            mask.position.set(0, 21, 2);

            const stripeL = new THREE.Mesh(new THREE.BoxGeometry(0.6, 6, 0.2), new THREE.MeshBasicMaterial({ color: 0xff0033 }));
            stripeL.position.set(-1.8, 21, 4.3); stripeL.rotation.z = -0.2;
            const stripeR = stripeL.clone(); stripeR.position.x = 1.8; stripeR.rotation.z = 0.2;

            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(1.0), new THREE.MeshBasicMaterial({ color: 0xff0022 }));
            eyeL.position.set(-1.8, 22, 4.2);
            const eyeR = eyeL.clone(); eyeR.position.x = 1.8;

            const hornL = new THREE.Mesh(new THREE.ConeGeometry(1.5, 12, 8), new THREE.MeshStandardMaterial({ color: 0x15151a }));
            hornL.position.set(-4, 27, 0); hornL.rotation.z = -0.5;
            const hornR = hornL.clone(); hornR.position.x = 4; hornR.rotation.z = 0.5;

            group.add(torso, holeRim, mask, stripeL, stripeR, eyeL, eyeR, hornL, hornR);

        } else if (this.type === "SHINIGAMI") {
            // 🔵 334.jpg 기반: 사신 대장
            const shihakusho = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 4.8, 18), new THREE.MeshStandardMaterial({ color: 0x08080c }));
            shihakusho.position.y = 9;

            // 대장 순백 하오리 코트
            const haori = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 5.8, 15, 16, 1, true), new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
            haori.position.y = 8.5;

            const head = new THREE.Mesh(new THREE.SphereGeometry(2.8), new THREE.MeshStandardMaterial({ color: 0xffdfc4 }));
            head.position.y = 19;

            // 참백도 & 청색 영압 오라
            const sword = new THREE.Mesh(new THREE.BoxGeometry(0.8, 24, 1.2), new THREE.MeshStandardMaterial({ color: 0xe0e0e0, metalness: 0.9 }));
            sword.position.set(5.5, 12, 3); sword.rotation.z = -0.3;

            const aura = new THREE.Mesh(new THREE.TorusGeometry(7, 0.4, 8, 32), new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.7 }));
            aura.position.set(0, 10, 0); aura.rotation.x = Math.PI / 2;

            group.add(shihakusho, haori, head, sword, aura);

        } else if (this.type === "ARRANCAR") {
            // 🟢 335.jpg 기반: 에스파다 (아란칼)
            const uniform = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 4.5, 18), new THREE.MeshStandardMaterial({ color: 0xf8f8f8 }));
            uniform.position.y = 9;

            // 검은 중앙 지퍼라인 & 허리띠
            const line = new THREE.Mesh(new THREE.BoxGeometry(0.8, 18.2, 0.5), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            line.position.set(0, 9, 2.5);

            const head = new THREE.Mesh(new THREE.SphereGeometry(2.8), new THREE.MeshStandardMaterial({ color: 0xffdfc4 }));
            head.position.y = 19;

            // 뺨/머리 파쇄 가면 조형
            const brokenMask = new THREE.Mesh(new THREE.BoxGeometry(2.2, 3.5, 2.0), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            brokenMask.position.set(2.2, 20.2, 1.8); brokenMask.rotation.z = -0.2;

            // 손끝 에메랄드 Cero 충전 구체
            const ceroOrb = new THREE.Mesh(new THREE.SphereGeometry(2.0), new THREE.MeshBasicMaterial({ color: 0x00ff66 }));
            ceroOrb.position.set(-4.5, 12, 3);

            group.add(uniform, line, head, brokenMask, ceroOrb);

        } else if (this.type === "QUINCY") {
            // 🏹 336.jpg 기반: 퀸시 (슈테른릿터)
            const tunic = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 5.2, 20), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            tunic.position.y = 10;

            // 퀸시 십자가 문양
            const crossH = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.8, 0.4), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
            crossH.position.set(0, 15, 3.2);
            const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.8, 4.0, 0.4), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
            crossV.position.set(0, 15, 3.2);

            // 푸른 영자 날개 (Vollständig)
            const wingL = new THREE.Mesh(new THREE.BoxGeometry(22, 2.5, 1.0), new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.85 }));
            wingL.position.set(-11, 16, -2); wingL.rotation.z = 0.35;
            const wingR = wingL.clone(); wingR.position.x = 11; wingR.rotation.z = -0.35;

            // 영자 활
            const bow = new THREE.Mesh(new THREE.TorusGeometry(10, 0.8, 8, 32), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
            bow.position.set(0, 12, -3);

            group.add(tunic, crossH, crossV, wingL, wingR, bow);
        }

        const box = new THREE.Box3().setFromObject(group);
        group.position.y = -box.min.y;

        this.mesh.add(group);
    }

    takeDamage(amt) {
        this.hp = Math.max(0, this.hp - amt);
        if(this.hp <= 0) { 
            this.game.addParticles(this.mesh.position, 0xff1744, 35, 6.0);
            this.mesh.position.y = -200; 
            this.game.updateUI(); 
            this.game.log(`🏆 <b>[토벌 성공!]</b> ${this.name} 처치 완료! 차원 게이트로 이동하세요.`);
        }
    }

    useAbility(pPos) {
        let dir = new THREE.Vector3().subVectors(pPos, this.mesh.position).normalize();
        
        if(this.type === "HOLLOW") {
            this.game.popText(this.mesh.position, `🔴 호로 세로탄!`, 'ENEMY');
            const ball = new THREE.Mesh(new THREE.SphereGeometry(2.8), new THREE.MeshBasicMaterial({ color: 0xff0033 }));
            ball.position.copy(this.mesh.position).add(new THREE.Vector3(0, 14, 0));
            this.game.scene.add(ball);
            this.game.projectiles.push({ mesh: ball, dir: dir, speed: 0.82, damage: 35, life: 1.0 });

        } else if(this.type === "SHINIGAMI") {
            this.game.popText(this.mesh.position, `⚡ 대장급 참격!`, 'ENEMY');
            this.mesh.position.addScaledVector(dir, 22.0);
            this.game.player.hp = Math.max(0, this.game.player.hp - 45); 
            this.game.addParticles(this.game.player.mesh.position, 0x00e5ff, 15);
            this.game.updateUI();

        } else if(this.type === "ARRANCAR") {
            this.game.popText(this.mesh.position, `🟢 에스파다 세로!`, 'ENEMY');
            const cero = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 28.0), new THREE.MeshBasicMaterial({ color: 0x00ff66 }));
            cero.rotation.x = Math.PI / 2; cero.position.copy(this.mesh.position).add(new THREE.Vector3(0, 12, 0));
            this.game.scene.add(cero);
            this.game.projectiles.push({ mesh: cero, dir: dir, speed: 0.98, damage: 60, life: 1.0 });

        } else if(this.type === "QUINCY") {
            if(this.hp / this.maxHp < 0.45 && !this.rageActive) {
                this.rageActive = true;
                this.game.log(`🏹 <span style='color:#00e5ff;'>[퀸시] 폴슈텐디히 폭주!</span>`);
            }
            this.game.popText(this.mesh.position, this.rageActive ? `🔥 폭주 신성 멸화!` : `🏹 하일리히 프파일!`, 'ENEMY');
            for(let i = -1; i <= 1; i++) {
                const arrow = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 9.0), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
                arrow.position.copy(this.mesh.position).add(new THREE.Vector3(i * 3.5, 12, 0));
                this.game.scene.add(arrow);
                this.game.projectiles.push({ mesh: arrow, dir: dir, speed: 0.92, damage: this.rageActive ? 42 : 26, life: 1.0 });
            }
        }
    }

    update() {
        if(this.hp <= 0) return;
        const pPos = this.game.player.mesh.position;
        const dist = this.mesh.position.distanceTo(pPos);

        if (dist < this.detectionRange) {
            let dir = new THREE.Vector3().subVectors(pPos, this.mesh.position).normalize();
            this.mesh.position.addScaledVector(dir, this.speed);
            this.mesh.rotation.y = Math.atan2(dir.x, dir.z);

            this.skillCooldown += 0.02;
            if(this.skillCooldown > 2.8) {
                this.skillCooldown = 0; this.useAbility(pPos);
            }
            if(dist < 10.0) {
                this.game.player.hp = Math.max(0, this.game.player.hp - this.atk * (this.rageActive ? 1.5 : 1.0)); 
                this.game.updateUI();
            }
        }
    }
}

let gameInstance = null;
window.onload = () => {
    gameInstance = new Game();
    function animate() {
        requestAnimationFrame(animate);
        if (gameInstance) {
            const delta = gameInstance.clock.getDelta();
            gameInstance.player.move(delta); 
            gameInstance.enemies.forEach(e => e.update()); 
            gameInstance.updateAndCleanFX();
            gameInstance.checkPortalInteraction();
            gameInstance.applyCameraUpdate(); 
            gameInstance.renderer.render(gameInstance.scene, gameInstance.camera);
        }
    }
    animate();
};
