<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>블리치: 차원 대전 Colorful Metal Edition</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
        body { background: #020305; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; }
        #game-container { position: relative; width: 100%; max-width: 480px; height: 100%; max-height: 860px; background: #000; overflow: hidden; display: flex; flex-direction: column; border: 2px solid #00e5ff55; box-shadow: 0 0 40px rgba(0,229,255,0.3); }
        
        #top-status-bar { width: 100%; height: 15%; background: rgba(8, 12, 22, 0.95); border-bottom: 2px solid #00e5ffaa; padding: 8px 12px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 6px; z-index: 105; backdrop-filter: blur(5px); }
        .bar-group { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
        .bar-row { display: flex; align-items: center; gap: 6px; }
        .bar-label { width: 55px; font-weight: bold; color: #88a0a8; font-size: 9.5px; }
        .bar-bg { flex: 1; height: 10px; background: #06090e; border: 1px solid #1e2d3d; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.15s ease-out; }
        #hp-fill { background: linear-gradient(90deg, #ff1744, #ff5252); }
        #mp-fill { background: linear-gradient(90deg, #00e5ff, #7c4dff); width: 0%; }
        .bar-text { font-size: 8.5px; width: 55px; text-align: right; color: #a0b0b8; font-weight: bold; }
        
        .right-info { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; font-size: 10px; border-left: 1px solid #1e2d3d; padding-left: 8px; color: #eee; gap: 2px; }
        .char-tag { color: #00e5ff; font-weight: 900; font-size: 11px; text-shadow: 0 0 10px rgba(0,229,255,0.8); }

        #minimap-container { position: absolute; top: 16%; right: 10px; width: 85px; height: 85px; background: rgba(5,8,18,0.85); border: 2px solid #00e5ff; border-radius: 50%; z-index: 140; overflow: hidden; box-shadow: 0 0 12px rgba(0,229,255,0.5); }
        #minimap-canvas { width: 100%; height: 100%; }

        #boss-hp-container { position: absolute; top: 16%; left: 50%; transform: translateX(-50%); width: 60%; z-index: 140; display: none; flex-direction: column; align-items: center; background: rgba(10,5,15,0.9); padding: 5px 10px; border-radius: 6px; border: 1px solid #ff1744; box-shadow: 0 0 15px rgba(255,23,68,0.6); }
        #boss-name-tag { color: #ff1744; font-size: 10px; font-weight: 900; margin-bottom: 2px; }
        #boss-hp-bg { width: 100%; height: 8px; background: #220000; border-radius: 4px; overflow: hidden; border: 1px solid #550000; }
        #boss-hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ffab00); transition: width 0.1s; }

        #quest-box { position: absolute; top: 16%; left: 10px; z-index: 140; background: rgba(5, 10, 20, 0.9); border: 1.5px solid #00e5ff; border-radius: 6px; padding: 6px 10px; color: #fff; font-size: 9px; width: 140px; box-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        #quest-title { color: #ffd700; font-weight: bold; font-size: 10px; margin-bottom: 2px; }

        #canvas3d-container { position: relative; width: 100%; height: 53%; background: #050811; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; display: block; }

        .damage-popup { position: absolute; color: #fff; font-weight: 900; font-size: 16px; pointer-events: none; z-index: 150; transform: translate(-50%, -50%); animation: popupAnim 0.5s ease-out forwards; }
        .crit-popup { color: #00ffff !important; font-size: 28px !important; text-shadow: 0 0 16px #00ffff, 0 0 30px #ffffff; }
        .enemy-skill-popup { color: #ff1744 !important; font-size: 22px !important; text-shadow: 0 0 14px #ff0000; }
        .mob-hit-popup { color: #ffd700 !important; font-size: 15px !important; text-shadow: 0 0 8px #ffab00; }
        
        @keyframes popupAnim { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); } 30% { opacity: 1; transform: translate(-50%, -50%) scale(1.4); } 100% { opacity: 0; transform: translate(-50%, -50%) translateY(-50px); } }

        #ui-panel { width: 100%; height: 32%; background: #040609; border-top: 1px solid #1e2d3d; padding: 6px; display: grid; grid-template-columns: 0.9fr 1.1fr 1.2fr; gap: 4px; z-index: 100; }
        #dpad-container { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 95px; height: 95px; margin: auto; gap: 2px; }
        .dpad-btn { background: #0a0f18; border: 1px solid #1e2d3d; border-radius: 4px; color: #708898; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .dpad-btn:active { background: #00e5ff; color: #000; }
        .dpad-empty { visibility: hidden; }

        #status-board { background: #020305; border: 1px solid #141f2c; border-radius: 5px; padding: 6px; color: #8090a0; font-size: 8.5px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
        .log-title { color: #00e5ff; font-weight: bold; border-bottom: 1px solid #141f2c; padding-bottom: 2px; }
        #log-content { flex: 1; font-size: 8px; overflow-y: auto; color: #607080; }

        #action-grid { display: grid; grid-template-columns: 1fr; grid-template-rows: repeat(4, 1fr); gap: 3px; }
        .action-btn { width: 100%; height: 100%; border: 1px solid #1e2d3d; border-radius: 4px; font-size: 9.5px; font-weight: bold; color: #a0b0c0; background: #0a0f18; cursor: pointer; }
        #btn-atk { background: linear-gradient(180deg, #1e2a3a, #0a0f18); color: #fff; border-color: #00e5ff44; }
        #btn-skl { background: linear-gradient(180deg, #00e5ff, #7c4dff); color: #fff; font-weight: 900; text-shadow: 0 0 5px #000; }
        #btn-heal { color: #69ff94; }
        #btn-ban { background: linear-gradient(180deg, #ffd700, #ff6d00); color: #000; font-weight: 900; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="top-status-bar">
        <div class="bar-group">
            <div class="bar-row"><span class="bar-label">HP 생명력</span><div class="bar-bg"><div id="hp-fill" class="bar-fill"></div></div><span id="hp-txt" class="bar-text">300 / 300</span></div>
            <div class="bar-row"><span class="bar-label">MP 영압</span><div class="bar-bg"><div id="mp-fill" class="bar-fill"></div></div><span id="mp-txt" class="bar-text">0 / 100</span></div>
        </div>
        <div class="right-info">
            <div class="char-tag" id="player-char-name">히츠가야 토시로</div>
            <div style="color:#76ff03; font-weight:bold; font-size:9px;" id="zone-tag">CH.1 현세 필드</div>
        </div>
    </div>

    <div id="minimap-container">
        <canvas id="minimap-canvas" width="85" height="85"></canvas>
    </div>

    <div id="boss-hp-container">
        <div id="boss-name-tag">BOSS: 거대 호로</div>
        <div id="boss-hp-bg"><div id="boss-hp-fill"></div></div>
    </div>

    <div id="quest-box">
        <div id="quest-title">📜 퀘스트 [CH.1]</div>
        <span id="quest-desc">적 토벌 및 차원 이동</span>
    </div>

    <div id="canvas3d-container"></div>

    <div id="ui-panel">
        <div id="dpad-container">
            <div class="dpad-empty"></div><div class="dpad-btn" id="dpad-up">▲</div><div class="dpad-empty"></div>
            <div class="dpad-btn" id="dpad-left">◀</div><div class="dpad-empty"></div><div class="dpad-btn" id="dpad-right">▶</div>
            <div class="dpad-empty"></div><div class="dpad-btn" id="dpad-down">▼</div><div class="dpad-empty"></div>
        </div>
        
        <div id="status-board">
            <div class="log-title">⚔️ [Metallic SFX & Color Engine]</div>
            <div id="log-content">날카로운 챙-! 참격음과 세련된 컬러링 맵이 적용되었습니다.</div>
        </div>

        <div id="action-grid">
            <button id="btn-atk" class="action-btn">⚔️ 일반 참격</button>
            <button id="btn-skl" class="action-btn">❄️ 빙룡선풍</button>
            <button id="btn-heal" class="action-btn">🧪 영압 수복</button>
            <button id="btn-ban" class="action-btn">🧊 대홍련빙륜환</button>
        </div>
    </div>
</div>

<script>
// 🔊 챙-! 날카로운 검격음을 위한 하이엔드 사운드 합성기
class SoundEngine {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }

    // ⚔️ 쨍-! 날카로운 쇠 부딪히는 소리 (Metallic Slash SFX)
    playMetallicSlashSFX() {
        if(this.ctx.state === 'suspended') this.ctx.resume();
        const now = this.ctx.currentTime;

        // 1. 금속 마찰음 (고주파 오실레이터)
        const osc1 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(2400, now);
        osc1.frequency.exponentialRampToValueAtTime(300, now + 0.12);
        gain1.gain.setValueAtTime(0.4, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc1.connect(gain1); gain1.connect(this.ctx.destination);

        // 2. 챙-! 링잉 공명음 (고음 피치)
        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(4800, now);
        osc2.frequency.exponentialRampToValueAtTime(1200, now + 0.18);
        gain2.gain.setValueAtTime(0.3, now);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc2.connect(gain2); gain2.connect(this.ctx.destination);

        osc1.start(now); osc1.stop(now + 0.12);
        osc2.start(now); osc2.stop(now + 0.18);
    }

    playIceSkillSFX() {
        if(this.ctx.state === 'suspended') this.ctx.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.linearRampToValueAtTime(2200, now + 0.35);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.35);
    }

    playBankaiSFX() {
        if(this.ctx.state === 'suspended') this.ctx.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.6);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.6);
    }
}

const soundFx = new SoundEngine();

const CHAPTER_CONFIGS = [
    { id: 1, name: "카라쿠라 마을 (현세)", bg: 0x080e1a, theme: 'URBAN', mobType: "HOLLOW", mobName: "하급 호로", mobHp: 90, bossType: "HOLLOW", bossName: "CH.1 거대 호로", bossHp: 800, bossAtk: 0.12 },
    { id: 2, name: "소울 소사이어티 (정령정)", bg: 0x071224, theme: 'SOUL', mobType: "SHINIGAMI", mobName: "하급 사신", mobHp: 140, bossType: "SHINIGAMI", bossName: "CH.2 사신 대장", bossHp: 1300, bossAtk: 0.15 },
    { id: 3, name: "웨코문도 (허권)", bg: 0x05040a, theme: 'HUECO', mobType: "ARRANCAR", mobName: "아란칼 프라시온", mobHp: 200, bossType: "ARRANCAR", bossName: "CH.3 에스파다", bossHp: 2000, bossAtk: 0.18 },
    { id: 4, name: "반덴라이히 (천년혈전)", bg: 0x180508, theme: 'QUINCY', mobType: "QUINCY", mobName: "퀸시 성기사단", mobHp: 280, bossType: "QUINCY", bossName: "CH.4 퀸시 (슈테른릿터)", bossHp: 3000, bossAtk: 0.22 }
];

const MAP_WIDTH = 180; const MAP_LENGTH = 450;

class Game {
    constructor() {
        this.container = document.getElementById('canvas3d-container');
        this.logBox = document.getElementById('log-content');
        this.btnHeal = document.getElementById('btn-heal');
        this.minimapCanvas = document.getElementById('minimap-canvas');
        this.minimapCtx = this.minimapCanvas.getContext('2d');
        
        this.mp = 0; this.chapterIndex = 0;
        this.isSpecialActive = false; this.healCooldown = false;
        this.clock = new THREE.Clock();
        this.shakeTimer = 0;

        this.initThree();
        this.initWorld();
        this.player = new Player(this);
        
        this.mobs = []; this.enemies = []; this.particles = []; this.projectiles = []; this.slashes = [];
        this.spawnMobs();
        this.spawnDimensionBoss();
        
        this.keys = { up: false, down: false, left: false, right: false };
        this.initEvents(); this.updateUI();
    }

    initThree() {
        this.scene = new THREE.Scene(); 
        const cfg = CHAPTER_CONFIGS[0];
        this.scene.background = new THREE.Color(cfg.bg);
        this.scene.fog = new THREE.FogExp2(cfg.bg, 0.0025);
        
        this.camera = new THREE.PerspectiveCamera(45, this.container.clientWidth / this.container.clientHeight, 0.1, 1500);
        this.camera.position.set(0, 38, 50);
        
        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
        this.renderer.shadowMap.enabled = true;
        this.container.appendChild(this.renderer.domElement);
        
        this.mainLight = new THREE.DirectionalLight(0xffffff, 2.8);
        this.mainLight.position.set(60, 100, 50);
        this.scene.add(this.mainLight);

        // 은은한 듀얼 포인트 라이트 (알록달록 오라)
        const lightCyan = new THREE.PointLight(0x00e5ff, 1.5, 120);
        lightCyan.position.set(-30, 20, -100);
        const lightPurple = new THREE.PointLight(0x7c4dff, 1.5, 120);
        lightPurple.position.set(30, 20, -200);
        this.scene.add(lightCyan, lightPurple);

        this.scene.add(new THREE.AmbientLight(0x6080a0, 1.2));
    }

    // 🎨 세련된 알록달록 컬러링이 적용된 지형 및 결정체 맵
    initWorld() {
        if(this.mapGroup) this.scene.remove(this.mapGroup);
        this.mapGroup = new THREE.Group();

        const cfg = CHAPTER_CONFIGS[this.chapterIndex];
        this.scene.background = new THREE.Color(cfg.bg);
        this.scene.fog.color = new THREE.Color(cfg.bg);
        
        const terrainGeo = new THREE.PlaneGeometry(MAP_WIDTH, MAP_LENGTH, 50, 100);
        const posAttr = terrainGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            let x = posAttr.getX(i);
            let y = posAttr.getY(i);
            let zVal = Math.sin(x * 0.04) * Math.cos(y * 0.02) * 5.5;
            posAttr.setZ(i, zVal);
        }
        terrainGeo.computeVertexNormals();

        const terrainMat = new THREE.MeshStandardMaterial({
            color: cfg.theme==='URBAN'? 0x1d2d44 : (cfg.theme==='SOUL'? 0x1f3a52 : (cfg.theme==='HUECO'? 0xd0d8e8 : 0x3d141d)),
            roughness: 0.5, metalness: 0.2
        });

        const floor = new THREE.Mesh(terrainGeo, terrainMat);
        floor.rotation.x = -Math.PI / 2; floor.position.set(0, -2, -MAP_LENGTH/2 + 40);
        this.mapGroup.add(floor);

        // 알록달록 크리스탈 및 바위산 배치
        const colors = [0x00e5ff, 0x7c4dff, 0x69ff94, 0xffd700];
        for(let i=0; i<20; i++) {
            const rockGeo = new THREE.DodecahedronGeometry(8 + Math.random()*5, 1);
            const rockMat = new THREE.MeshStandardMaterial({ 
                color: cfg.theme==='HUECO'? 0xe2e8f0 : 0x162232, 
                roughness: 0.7 
            });
            const rockL = new THREE.Mesh(rockGeo, rockMat);
            rockL.position.set(-MAP_WIDTH/2 - 5 + Math.random()*8, 8, -i*22);
            rockL.scale.set(1.2, 2.5, 1.2);
            
            const rockR = rockL.clone();
            rockR.position.x = MAP_WIDTH/2 + 5 - Math.random()*8;
            this.mapGroup.add(rockL, rockR);

            // 빛나는 발광 결정 기둥 (너무 과하지 않은 조화)
            if(i % 2 === 0) {
                const crystalGeo = new THREE.ConeGeometry(2.5, 12, 5);
                const crystalMat = new THREE.MeshBasicMaterial({ color: colors[i % colors.length], wireframe: true });
                const cry = new THREE.Mesh(crystalGeo, crystalMat);
                cry.position.set(-MAP_WIDTH/2 + 12, 6, -i*22 + 5);
                cry.rotation.z = 0.2;
                const cryR = cry.clone(); cryR.position.x = MAP_WIDTH/2 - 12; cryR.rotation.z = -0.2;
                this.mapGroup.add(cry, cryR);
            }
        }

        const gateGroup = new THREE.Group();
        const gateRing = new THREE.Mesh(new THREE.TorusGeometry(18, 2.5, 16, 32), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
        const gateCore = new THREE.Mesh(new THREE.CircleGeometry(16, 32), new THREE.MeshBasicMaterial({ color: 0x7c4dff, transparent: true, opacity: 0.6, side: THREE.DoubleSide }));
        gateGroup.add(gateRing, gateCore);
        gateGroup.position.set(0, 18, -MAP_LENGTH + 80);
        this.portalGate = gateGroup;
        this.mapGroup.add(this.portalGate);

        this.scene.add(this.mapGroup);
    }

    spawnMobs() {
        this.mobs.forEach(m => this.scene.remove(m.mesh)); this.mobs = [];
        const cfg = CHAPTER_CONFIGS[this.chapterIndex];

        for(let i=0; i<8; i++) {
            const mob = new NormalMob(this, cfg);
            let randX = (Math.random() - 0.5) * (MAP_WIDTH - 40);
            let randZ = -Math.random() * (MAP_LENGTH - 150) - 20;
            mob.mesh.position.set(randX, 0, randZ);
            this.mobs.push(mob);
        }
    }

    spawnDimensionBoss() {
        this.enemies.forEach(e => this.scene.remove(e.mesh)); this.enemies = [];
        this.projectiles.forEach(p => this.scene.remove(p.mesh)); this.projectiles = [];

        const cfg = CHAPTER_CONFIGS[this.chapterIndex];
        const boss = new ImageMatchedBoss(this, cfg);
        boss.mesh.position.set(0, 0, -MAP_LENGTH + 180);
        this.enemies.push(boss);
    }

    triggerShake(amount = 0.5) { this.shakeTimer = amount; }

    // ✨ 다채로운 시안/골드/퍼플 스파크 입자
    addParticles(pos, mainColor = 0x00e5ff, count = 15, scaleMult = 4.0) {
        const palette = [mainColor, 0xffd700, 0x7c4dff];
        for(let i=0; i<count; i++) {
            const c = palette[i % palette.length];
            const mat = new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.95 });
            const p = new THREE.Mesh(new THREE.BoxGeometry(0.4 * scaleMult, 0.4 * scaleMult, 0.4 * scaleMult), mat);
            p.position.copy(pos);
            p.userData = { vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() * 0.9 + 0.3), vz: (Math.random() - 0.5) * 1.5, life: 1.0 };
            this.scene.add(p); this.particles.push(p);
        }
    }

    // ⚔️ 3D 입체 그라데이션 검기
    add3DSlashEffect(pos, rotationY) {
        const slashGeo = new THREE.RingGeometry(3.0, 9.0, 16, 1, 0, Math.PI * 0.85);
        const slashMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.95 });
        const slash = new THREE.Mesh(slashGeo, slashMat);
        
        slash.position.copy(pos).add(new THREE.Vector3(0, 4, 0));
        slash.rotation.x = Math.PI / 2.5;
        slash.rotation.z = Math.PI / 4;
        slash.rotation.y = rotationY;
        
        this.scene.add(slash);
        this.slashes.push({ mesh: slash, life: 1.0 });
    }

    renderMinimap() {
        const ctx = this.minimapCtx;
        ctx.clearRect(0, 0, 85, 85);
        ctx.fillStyle = 'rgba(8, 12, 22, 0.85)';
        ctx.fillRect(0, 0, 85, 85);

        const scale = 85 / MAP_LENGTH;
        const centerX = 85 / 2;
        const centerY = 85 / 2;

        ctx.fillStyle = '#00e5ff';
        ctx.beginPath();
        ctx.arc(centerX + (this.player.mesh.position.x * scale), centerY + (this.player.mesh.position.z * scale * 0.2), 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffd700';
        this.mobs.forEach(m => {
            if (m.hp > 0) {
                ctx.beginPath();
                ctx.arc(centerX + (m.mesh.position.x * scale), centerY + (m.mesh.position.z * scale * 0.2), 2, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        ctx.fillStyle = '#ff1744';
        this.enemies.forEach(e => {
            if (e.hp > 0) {
                ctx.beginPath();
                ctx.arc(centerX + (e.mesh.position.x * scale), centerY + (e.mesh.position.z * scale * 0.2), 5, 0, Math.PI * 2);
                ctx.fill();
            }
        });
    }

    updateAndCleanFX() {
        for(let i = this.slashes.length - 1; i >= 0; i--) {
            const s = this.slashes[i];
            s.mesh.scale.addScalar(0.09);
            s.life -= 0.08;
            s.mesh.material.opacity = s.life;
            if(s.life <= 0) { this.scene.remove(s.mesh); this.slashes.splice(i, 1); }
        }

        for(let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
            p.userData.life -= 0.038; p.material.opacity = p.userData.life;
            if(p.userData.life <= 0) { this.scene.remove(p); this.particles.splice(i, 1); }
        }
        for(let i = this.projectiles.length - 1; i >= 0; i--) {
            const proj = this.projectiles[i];
            proj.mesh.position.addScaledVector(proj.dir, proj.speed);
            proj.life -= 0.02;

            if(proj.mesh.position.distanceTo(this.player.mesh.position) < 4.0) {
                this.player.hp = Math.max(0, this.player.hp - proj.damage);
                this.triggerShake(0.6);
                this.popText(this.player.mesh.position, `💥 피격! -${proj.damage}`, 'ENEMY');
                this.updateUI();
                this.scene.remove(proj.mesh); this.projectiles.splice(i, 1);
                continue;
            }
            if(proj.life <= 0) {
                this.scene.remove(proj.mesh); this.projectiles.splice(i, 1);
            }
        }

        if(this.portalGate) this.portalGate.rotation.z += 0.03;
        this.renderMinimap();
    }

    applyCameraUpdate() {
        let targetX = this.player.mesh.position.x;
        let targetY = this.player.mesh.position.y + 35.0;
        let targetZ = this.player.mesh.position.z + 42.0;

        if (this.shakeTimer > 0) {
            targetX += (Math.random() - 0.5) * this.shakeTimer * 3.5;
            targetY += (Math.random() - 0.5) * this.shakeTimer * 3.5;
            this.shakeTimer -= 0.04;
        }

        this.camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.15);
        this.camera.lookAt(this.player.mesh.position.x, this.player.mesh.position.y + 6.0, this.player.mesh.position.z);
    }

    checkPortalInteraction() {
        if(this.portalGate && this.player.mesh.position.distanceTo(this.portalGate.position) < 25.0) {
            const aliveBoss = this.enemies.filter(e => e.hp > 0);
            if(aliveBoss.length > 0) {
                this.log(`⚠️ 보스를 토벌해야 다음 차원으로 이동할 수 있습니다!`);
                this.player.mesh.position.z += 15.0; 
            } else {
                this.chapterIndex = (this.chapterIndex + 1) % CHAPTER_CONFIGS.length;
                this.player.mesh.position.set(0, 0, 0); 
                this.initWorld(); this.spawnMobs(); this.spawnDimensionBoss();
                this.log(`🌌 <b>[차원 이동]</b> ${CHAPTER_CONFIGS[this.chapterIndex].name} 진입!`);
                this.updateUI();
            }
        }
    }

    log(msg) { this.logBox.innerHTML = msg + "<br>" + this.logBox.innerHTML; }

    updateUI() {
        document.getElementById('hp-fill').style.width = (this.player.hp / this.player.maxHp * 100) + "%";
        document.getElementById('hp-txt').innerText = `${Math.round(this.player.hp)} / ${this.player.maxHp}`;
        document.getElementById('mp-fill').style.width = this.mp + "%";
        document.getElementById('mp-txt').innerText = `${this.mp} / 100`;
        
        const cfg = CHAPTER_CONFIGS[this.chapterIndex];
        const boss = this.enemies[0];
        const bossHpBar = document.getElementById('boss-hp-container');

        if (boss && boss.hp > 0 && this.player.mesh.position.distanceTo(boss.mesh.position) < 120.0) {
            bossHpBar.style.display = 'flex';
            document.getElementById('boss-name-tag').innerText = `BOSS: ${boss.name}`;
            document.getElementById('boss-hp-fill').style.width = (boss.hp / boss.maxHp * 100) + "%";
        } else {
            bossHpBar.style.display = 'none';
        }

        const bossAlive = this.enemies.some(e => e.hp > 0);
        document.getElementById('quest-desc').innerText = bossAlive ? `필드 적 및 ${cfg.bossName} 토벌` : `🏆 차원 게이트로 이동하여 다음 단계 진입`;
        document.getElementById('zone-tag').innerText = cfg.name;
    }

    popText(pos, text, type = 'NORMAL') {
        const p = pos.clone().project(this.camera);
        const pop = document.createElement('div');
        pop.className = "damage-popup " + (type === 'CRIT' ? "crit-popup" : (type === 'ENEMY' ? "enemy-skill-popup" : (type==='MOB'? "mob-hit-popup" : "")));
        pop.innerText = text; 
        pop.style.left = ((p.x * .5 + .5) * this.container.clientWidth) + "px"; 
        pop.style.top = ((-(p.y * .5) + .5) * this.container.clientHeight) + "px";
        this.container.appendChild(pop); setTimeout(() => pop.remove(), 600);
    }

    initEvents() {
        const setKey = (id, dir, val) => {
            const el = document.getElementById(id);
            el.addEventListener('mousedown', () => this.keys[dir] = val);
            el.addEventListener('mouseup', () => this.keys[dir] = !val);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys[dir] = val; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); this.keys[dir] = !val; });
        };
        setKey('dpad-up', 'up', true); setKey('dpad-down', 'down', true);
        setKey('dpad-left', 'left', true); setKey('dpad-right', 'right', true);
        
        document.getElementById('btn-atk').addEventListener('click', () => this.player.attack());
        document.getElementById('btn-skl').addEventListener('click', () => this.player.useSkill());
        document.getElementById('btn-heal').addEventListener('click', () => this.useHealPotion());
        document.getElementById('btn-ban').addEventListener('click', () => { 
            if(this.mp >= 100 && !this.isSpecialActive) { this.mp = 0; this.isSpecialActive = true; this.player.activateBankai(); }
        });
    }
    
    useHealPotion() {
        if (this.healCooldown || this.player.hp >= this.player.maxHp) return;
        this.healCooldown = true; this.btnHeal.disabled = true;
        this.player.hp = Math.min(this.player.maxHp, this.player.hp + 150);
        this.popText(this.player.mesh.position, `💖 영압 회복`, 'NORMAL'); this.updateUI();
        setTimeout(() => { this.healCooldown = false; this.btnHeal.disabled = false; }, 5000);
    }
}

class Player {
    constructor(game) {
        this.game = game; this.hp = 300; this.maxHp = 300; this.atk = 120; 
        this.baseSpeed = 0.65;
        this.mesh = new THREE.Group();
        this.game.scene.add(this.mesh);
        this.loadDefaultToshiroModel();
    }

    loadDefaultToshiroModel() {
        const group = new THREE.Group();
        const head = new THREE.Mesh(new THREE.SphereGeometry(1.5), new THREE.MeshStandardMaterial({ color: 0xffdfc4 }));
        head.position.y = 5.2;
        const hair = new THREE.Mesh(new THREE.ConeGeometry(1.8, 2.2, 8), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        hair.position.set(0, 6.4, -0.1);
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.3, 3.8), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
        body.position.y = 2.6;
        const haori = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.8, 2.8, 8, 1, true), new THREE.MeshStandardMaterial({ color: 0xf8fafc, side: THREE.DoubleSide }));
        haori.position.y = 2.2;

        group.add(head, hair, body, haori);
        const box = new THREE.Box3().setFromObject(group);
        group.position.y = -box.min.y;
        
        this.mesh.add(group); this.model = group;
    }

    activateBankai() {
        soundFx.playBankaiSFX();
        this.game.log(`🔮 <span style='color:#ffd700;font-weight:900;'>[卍解] "대홍련빙륜환" 개방!</span>`);
        this.game.popText(this.mesh.position, `🧊 만해 개방!`, 'CRIT');
        this.game.triggerShake(1.0);
        
        const wingL = new THREE.Mesh(new THREE.BoxGeometry(16, 1.2, 4), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.85 }));
        wingL.position.set(-8, 5, -1); wingL.rotation.z = 0.3;
        const wingR = wingL.clone(); wingR.position.x = 8; wingR.rotation.z = -0.3;
        this.mesh.add(wingL, wingR);

        setTimeout(() => {
            this.mesh.remove(wingL, wingR);
            this.game.isSpecialActive = false; this.game.updateUI();
        }, 12000);
        this.game.updateUI();
    }

    attack() {
        // ⚔️ 날카로운 챙-! 검격음 재생
        soundFx.playMetallicSlashSFX();
        
        this.game.add3DSlashEffect(this.mesh.position, this.mesh.rotation.y);
        this.game.addParticles(this.mesh.position.clone().add(new THREE.Vector3(0,3,-4).applyQuaternion(this.mesh.quaternion)), 0x00e5ff, 15, 4.0);
        this.game.triggerShake(0.3);
        
        let range = this.game.isSpecialActive ? 24.0 : 16.0;

        this.game.mobs.forEach(m => {
            if (m.hp > 0 && this.mesh.position.distanceTo(m.mesh.position) < range) {
                let dmg = this.atk * (this.game.isSpecialActive ? 2.5 : 1.0);
                m.takeDamage(dmg);
                this.game.popText(m.mesh.position, `⚔️ -${Math.round(dmg)}`, 'MOB');
            }
        });

        this.game.enemies.forEach(e => {
            if (e.hp > 0 && this.mesh.position.distanceTo(e.mesh.position) < range) {
                let dmg = this.atk * (this.game.isSpecialActive ? 2.8 : 1.0);
                e.takeDamage(dmg);
                this.game.popText(e.mesh.position, `💥 -${Math.round(dmg)}`, this.game.isSpecialActive ? 'CRIT' : 'NORMAL');
            }
        });

        if(!this.game.isSpecialActive) this.game.mp = Math.min(100, this.game.mp + 15);
        this.game.updateUI();
    }
    
    useSkill() {
        soundFx.playIceSkillSFX();
        this.game.log(`❄️ <b>[오의] 대용권 빙룡선풍!</b>`);
        this.game.triggerShake(1.2);

        for(let r=0; r<Math.PI*2; r+=Math.PI/2) {
            this.game.add3DSlashEffect(this.mesh.position, r);
        }

        this.game.mobs.forEach(m => {
            if(m.hp > 0 && this.mesh.position.distanceTo(m.mesh.position) < 32.0) {
                let dmg = this.atk * 3.0; m.takeDamage(dmg);
                this.game.popText(m.mesh.position, `🐉 -${Math.round(dmg)}`, 'CRIT');
            }
        });

        this.game.enemies.forEach(e => {
            if(e.hp > 0 && this.mesh.position.distanceTo(e.mesh.position) < 32.0) {
                let dmg = this.atk * 3.0; e.takeDamage(dmg);
                this.game.popText(e.mesh.position, `🐉 -${Math.round(dmg)}`, 'CRIT');
            }
        });

        this.game.updateUI();
    }

    move(delta) {
        let dx = 0, dz = 0;
        if (this.game.keys.up) dz = -1; if (this.game.keys.down) dz = 1;
        if (this.game.keys.left) dx = -1; if (this.game.keys.right) dx = 1;
        if (dx !== 0 || dz !== 0) {
            let mag = Math.sqrt(dx*dx + dz*dz);
            let currentSpeed = this.game.isSpecialActive ? this.baseSpeed * 2.5 : this.baseSpeed;
            
            let nextX = this.mesh.position.x + (dx/mag) * currentSpeed;
            let nextZ = this.mesh.position.z + (dz/mag) * currentSpeed;
            if (Math.abs(nextX) < MAP_WIDTH / 2 - 5.0) this.mesh.position.x = nextX;
            if (nextZ > -MAP_LENGTH + 40 && nextZ < 20) this.mesh.position.z = nextZ;
            this.mesh.rotation.y = Math.atan2(dx, dz);
        }
    }
}

class NormalMob {
    constructor(game, cfg) {
        this.game = game; this.type = cfg.mobType; this.name = cfg.mobName;
        this.hp = cfg.mobHp; this.maxHp = this.hp; this.atk = 8; this.speed = 0.22;
        this.mesh = new THREE.Group();
        this.buildMobModel();
        this.game.scene.add(this.mesh);
    }

    buildMobModel() {
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.8, 5.0), new THREE.MeshStandardMaterial({ color: 0x334155 }));
        body.position.y = 2.5;
        const mask = new THREE.Mesh(new THREE.SphereGeometry(1.5), new THREE.MeshStandardMaterial({ color: 0xf1f5f9 }));
        mask.position.set(0, 5.5, 0);
        group.add(body, mask);
        const box = new THREE.Box3().setFromObject(group);
        group.position.y = -box.min.y;
        this.mesh.add(group);
    }

    takeDamage(amt) {
        this.hp -= amt;
        if (this.hp <= 0) {
            this.game.addParticles(this.mesh.position, 0xffd700, 10, 3.0);
            this.mesh.position.y = -100;
            this.game.mp = Math.min(100, this.game.mp + 25);
            this.game.log(`⚔️ 적 <b>[${this.name}]</b> 처치! (영압 +25)`);
            this.game.updateUI();

            setTimeout(() => {
                if(this.mesh) {
                    let randX = (Math.random() - 0.5) * (MAP_WIDTH - 40);
                    let randZ = -Math.random() * (MAP_LENGTH - 150) - 20;
                    this.mesh.position.set(randX, 0, randZ);
                    this.hp = this.maxHp;
                }
            }, 6000);
        }
    }

    update() {
        if (this.hp <= 0) return;
        const pPos = this.game.player.mesh.position;
        const dist = this.mesh.position.distanceTo(pPos);

        if (dist < 45.0) {
            let dir = new THREE.Vector3().subVectors(pPos, this.mesh.position).normalize();
            this.mesh.position.addScaledVector(dir, this.speed);
            this.mesh.rotation.y = Math.atan2(dir.x, dir.z);

            if (dist < 4.0) {
                this.game.player.hp = Math.max(0, this.game.player.hp - this.atk * 0.08);
                this.game.updateUI();
            }
        }
    }
}

class ImageMatchedBoss {
    constructor(game, cfg) {
        this.game = game; this.type = cfg.bossType; this.name = cfg.bossName;
        this.hp = cfg.bossHp; this.maxHp = this.hp; this.atk = cfg.bossAtk;
        this.speed = 0.18; this.detectionRange = 100.0;
        this.mesh = new THREE.Group();
        this.skillCooldown = 0; this.rageActive = false;

        this.buildImageMatchedModel();
        this.game.scene.add(this.mesh);
        this.game.log(`👾 <b>[보스 강림]</b> ${this.name} 등장!`);
    }

    buildImageMatchedModel() {
        const group = new THREE.Group();
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(4.5, 6, 22), new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.3 }));
        torso.position.y = 11;
        const mask = new THREE.Mesh(new THREE.BoxGeometry(6.5, 8.5, 4.5), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
        mask.position.set(0, 21, 2);
        group.add(torso, mask);

        const box = new THREE.Box3().setFromObject(group);
        group.position.y = -box.min.y;
        this.mesh.add(group);
    }

    takeDamage(amt) {
        this.hp = Math.max(0, this.hp - amt);
        if(this.hp <= 0) { 
            this.game.addParticles(this.mesh.position, 0xff1744, 40, 7.0);
            this.mesh.position.y = -200; 
            this.game.updateUI(); 
            this.game.log(`🏆 <b>[보스 토벌 성공!]</b> ${this.name} 처치! 차원 게이트로 이동하세요.`);
        }
    }

    useAbility(pPos) {
        let dir = new THREE.Vector3().subVectors(pPos, this.mesh.position).normalize();
        this.game.popText(this.mesh.position, `🔴 호로 세로탄!`, 'ENEMY');
        const ball = new THREE.Mesh(new THREE.SphereGeometry(2.8), new THREE.MeshBasicMaterial({ color: 0xff0055 }));
        ball.position.copy(this.mesh.position).add(new THREE.Vector3(0, 14, 0));
        this.game.scene.add(ball);
        this.game.projectiles.push({ mesh: ball, dir: dir, speed: 0.82, damage: 35, life: 1.0 });
    }

    update() {
        if(this.hp <= 0) return;
        const pPos = this.game.player.mesh.position;
        const dist = this.mesh.position.distanceTo(pPos);

        if (dist < this.detectionRange) {
            let dir = new THREE.Vector3().subVectors(pPos, this.mesh.position).normalize();
            this.mesh.position.addScaledVector(dir, this.speed);
            this.mesh.rotation.y = Math.atan2(dir.x, dir.z);

            this.skillCooldown += 0.02;
            if(this.skillCooldown > 2.8) {
                this.skillCooldown = 0; this.useAbility(pPos);
            }
            if(dist < 10.0) {
                this.game.player.hp = Math.max(0, this.game.player.hp - this.atk); 
                this.game.triggerShake(0.3);
                this.game.updateUI();
            }
        }
    }
}

let gameInstance = null;
window.onload = () => {
    gameInstance = new Game();
    function animate() {
        requestAnimationFrame(animate);
        if (gameInstance) {
            const delta = gameInstance.clock.getDelta();
            gameInstance.player.move(delta); 
            gameInstance.mobs.forEach(m => m.update());
            gameInstance.enemies.forEach(e => e.update()); 
            gameInstance.updateAndCleanFX();
            gameInstance.checkPortalInteraction();
            gameInstance.applyCameraUpdate(); 
            gameInstance.renderer.render(gameInstance.scene, gameInstance.camera);
        }
    }
    animate();
};
</script>
